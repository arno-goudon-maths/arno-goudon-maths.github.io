<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Signe de f′ et variations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* La courbe de f en haut, celle de f′ en dessous, sur le même axe des abscisses.
   On fait glisser le point : la tangente prend la couleur du signe de f′(x). */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e7eaef;
  --courbe: #1f5fbf; --derivee: #6b4fa0; --positif: #0b8a3a; --negatif: #d81b2c; --nul: #b06000;
  --positif-fond: rgba(20, 170, 70, 0.30); --negatif-fond: rgba(235, 40, 60, 0.26);
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --courbe: #6fa3f0; --derivee: #c49be6; --positif: #4ade80; --negatif: #ff6b7a; --nul: #f0a35e; --positif-fond: rgba(74, 222, 128, 0.26); --negatif-fond: rgba(255, 90, 110, 0.26); color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --courbe: #6fa3f0; --derivee: #c49be6; --positif: #4ade80; --negatif: #ff6b7a; --nul: #f0a35e; --positif-fond: rgba(74, 222, 128, 0.26); --negatif-fond: rgba(255, 90, 110, 0.26); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 70ch; }
.m { font-family: var(--math); font-style: italic; }
.choix { display: flex; flex-wrap: wrap; gap: 8px; }
.choix button { font: inherit; font-family: var(--math); font-size: 17px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
.choix button[aria-pressed="true"] { border-color: var(--courbe); box-shadow: inset 0 0 0 1px var(--courbe); }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 8px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; }
.signes { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 10px; overflow-x: auto; }
.signes svg { min-width: 520px; }
.constat { font-size: 16px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--etat, var(--filet)); background: var(--carte); margin: 0; }
button:focus-visible { outline: 3px solid var(--nul); outline-offset: 2px; }
</style>

<div class="page">
  <span class="niveau">Première spécialité · Chapitre 8 · Applications de la dérivation</span>
  <h1>Signe de <span class="m">f</span>′ et variations de <span class="m">f</span></h1>
  <p class="chapeau">Faites glisser le point <span class="m">M</span> le long de la courbe. Là où <span class="m">f</span>′(<span class="m">x</span>) &gt; 0, la tangente monte et <span class="m">f</span> est croissante ; là où <span class="m">f</span>′(<span class="m">x</span>) &lt; 0, elle descend et <span class="m">f</span> est décroissante.</p>
  <div class="choix" id="choix" role="group" aria-label="Choix de la fonction"></div>
  <div class="figure"><svg id="g" viewBox="0 0 900 640" role="img" aria-label="Courbe de f et courbe de f′"></svg></div>
  <p class="constat" id="constat"></p>
  <div class="signes"><svg id="tab" viewBox="0 0 900 222" role="img" aria-label="Tableau de signes de f′ et de variations de f"></svg></div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = (x, d = 2) => { const r = Math.round(x * 10 ** d) / 10 ** d; return (Object.is(r, -0) ? 0 : r).toString().replace(".", ",").replace("-", "−"); };
  // Fonctions du cours (exemples 1 et 2) et du TD
  const F = [
    { nom: "f(x) = x² − 3x + 2", f: x => x * x - 3 * x + 2, d: x => 2 * x - 3, dnom: "f′(x) = 2x − 3", X: [-1.5, 4.5], z: [1.5], Y: [-1, 6], D: [-6, 6] },
    { nom: "f(x) = −2x² + 4x − 1", f: x => -2 * x * x + 4 * x - 1, d: x => -4 * x + 4, dnom: "f′(x) = −4x + 4", X: [-1.5, 3.5], z: [1], Y: [-7, 2], D: [-10, 10] },
    { nom: "f(x) = x³ − 3x", f: x => x ** 3 - 3 * x, d: x => 3 * x * x - 3, dnom: "f′(x) = 3x² − 3", X: [-2.5, 2.5], z: [-1, 1], Y: [-4, 4], D: [-4, 15] },
    { nom: "f(x) = x³ − 6x² + 9x + 1", f: x => x ** 3 - 6 * x * x + 9 * x + 1, d: x => 3 * x * x - 12 * x + 9, dnom: "f′(x) = 3x² − 12x + 9", X: [-0.5, 4.5], z: [1, 3], Y: [-4, 7], D: [-4, 12] },
    { nom: "f(x) = x³ + 3x", f: x => x ** 3 + 3 * x, d: x => 3 * x * x + 3, dnom: "f′(x) = 3x² + 3", X: [-2, 2], z: [], Y: [-12, 12], D: [-2, 16] }
  ];
  let k = 0, x0 = 0;
  const W = 900, G = 60, DR = 880, H1 = [16, 330], H2 = [370, 610];
  const sx = x => G + (x - F[k].X[0]) / (F[k].X[1] - F[k].X[0]) * (DR - G);
  const ix = px => F[k].X[0] + (px - G) / (DR - G) * (F[k].X[1] - F[k].X[0]);
  const sy = (y, Y, H) => H[1] - (y - Y[0]) / (Y[1] - Y[0]) * (H[1] - H[0]);
  const choix = $("choix");
  F.forEach((o, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = o.nom; b.addEventListener("click", () => { k = i; x0 = (F[i].X[0] + F[i].X[1]) / 2 + 0.37; maj(); }); choix.appendChild(b); });

  let etiquettes = [];
  function panneau(g, Y, H, titre) {
    const step = (Y[1] - Y[0]) > 14 ? 4 : (Y[1] - Y[0]) > 8 ? 2 : 1;
    for (let y = Math.ceil(Y[0] / step) * step; y <= Y[1]; y += step) g.appendChild(el("line", { x1: G, x2: DR, y1: sy(y, Y, H), y2: sy(y, Y, H), stroke: "var(--grille)" }));
    for (let x = Math.ceil(F[k].X[0]); x <= F[k].X[1]; x++) g.appendChild(el("line", { x1: sx(x), x2: sx(x), y1: H[0], y2: H[1], stroke: "var(--grille)" }));
    if (Y[0] < 0 && Y[1] > 0) g.appendChild(el("line", { x1: G, x2: DR, y1: sy(0, Y, H), y2: sy(0, Y, H), stroke: "var(--encre)", "stroke-width": 1.4 }));
    if (F[k].X[0] < 0 && F[k].X[1] > 0) g.appendChild(el("line", { x1: sx(0), x2: sx(0), y1: H[0], y2: H[1], stroke: "var(--encre)", "stroke-width": 1.4 }));
    etiquettes.push([H[0], titre]);
  }
  function trace(g, fn, Y, H, couleur, clip) {
    let d = "";
    for (let i = 0; i <= 400; i++) { const x = F[k].X[0] + (F[k].X[1] - F[k].X[0]) * i / 400; d += (i ? "L" : "M") + sx(x).toFixed(1) + "," + Math.max(-2000, Math.min(2000, sy(fn(x), Y, H))).toFixed(1); }
    g.appendChild(el("path", { d, fill: "none", stroke: couleur, "stroke-width": 4, "clip-path": `url(#${clip})` }));
  }
  function maj() {
    const o = F[k]; [...choix.children].forEach((b, i) => b.setAttribute("aria-pressed", i === k));
    x0 = Math.max(o.X[0] + 0.02, Math.min(o.X[1] - 0.02, x0));
    const g = $("g"); g.textContent = "";
    const defs = g.appendChild(el("defs"));
    defs.appendChild(el("clipPath", { id: "c1" })).appendChild(el("rect", { x: G, y: H1[0], width: DR - G, height: H1[1] - H1[0] }));
    defs.appendChild(el("clipPath", { id: "c2" })).appendChild(el("rect", { x: G, y: H2[0], width: DR - G, height: H2[1] - H2[0] }));
    // bandes de signe de f′ (dans les deux panneaux)
    const bornes = [o.X[0], ...o.z.filter(z => z > o.X[0] && z < o.X[1]), o.X[1]];
    for (let i = 0; i < bornes.length - 1; i++) {
      const pos = o.d((bornes[i] + bornes[i + 1]) / 2) > 0;
      for (const H of [H1, H2]) g.appendChild(el("rect", { x: sx(bornes[i]), y: H[0], width: sx(bornes[i + 1]) - sx(bornes[i]), height: H[1] - H[0], fill: pos ? "var(--positif-fond)" : "var(--negatif-fond)" }));
    }
    panneau(g, o.Y, H1, "f");
    panneau(g, o.D, H2, "f′");
    for (let i = 0; i < bornes.length - 1; i++) {
      const pos = o.d((bornes[i] + bornes[i + 1]) / 2) > 0, xm = (sx(bornes[i]) + sx(bornes[i + 1])) / 2;
      g.appendChild(el("rect", { x: xm - 16, y: H2[1] - 40, width: 32, height: 30, rx: 6, fill: "var(--carte)" }));
      g.appendChild(el("text", { x: xm, y: H2[1] - 16, "text-anchor": "middle", "font-size": 28, "font-weight": 600, fill: pos ? "var(--positif)" : "var(--negatif)", "font-family": "var(--ui)" }, pos ? "+" : "−"));
    }
    trace(g, o.f, o.Y, H1, "var(--courbe)", "c1");
    trace(g, o.d, o.D, H2, "var(--derivee)", "c2");
    etiquettes.forEach(([y, titre]) => { const lab = el("text", { x: G + 8, y: y + 26, "font-family": "var(--math)", "font-size": 22, fill: "var(--discret)", stroke: "var(--carte)", "stroke-width": 7, "paint-order": "stroke", "stroke-linejoin": "round" }); lab.appendChild(el("tspan", {}, "courbe de ")); lab.appendChild(el("tspan", { "font-style": "italic" }, titre)); g.appendChild(lab); }); etiquettes = [];
    // graduations
    for (let x = Math.ceil(o.X[0]); x <= o.X[1]; x++) if (x) g.appendChild(el("text", { x: sx(x), y: H2[1] + 22, "text-anchor": "middle", "font-size": 14, fill: "var(--discret)", "font-family": "var(--ui)" }, String(x).replace("-", "−")));
    // valeurs où f′ s'annule
    o.z.forEach(z => {
      g.appendChild(el("line", { x1: sx(z), x2: sx(z), y1: H1[0], y2: H2[1], stroke: "var(--nul)", "stroke-dasharray": "5 5", "stroke-width": 1.5 }));
      g.appendChild(el("circle", { cx: sx(z), cy: sy(0, o.D, H2), r: 6, fill: "var(--nul)" }));
    });
    // point M, tangente, point de f′
    const y0 = o.f(x0), p = o.d(x0), etat = Math.abs(p) < 0.05 ? "nul" : p > 0 ? "positif" : "negatif";
    const dx = (o.X[1] - o.X[0]) * 0.16;
    g.appendChild(el("line", { x1: sx(x0 - dx), y1: sy(y0 - p * dx, o.Y, H1), x2: sx(x0 + dx), y2: sy(y0 + p * dx, o.Y, H1), stroke: `var(--${etat})`, "stroke-width": 4, "clip-path": "url(#c1)" }));
    g.appendChild(el("line", { x1: sx(x0), x2: sx(x0), y1: sy(y0, o.Y, H1), y2: sy(p, o.D, H2), stroke: "var(--discret)", "stroke-dasharray": "3 5" }));
    g.appendChild(el("circle", { cx: sx(x0), cy: sy(p, o.D, H2), r: 8, fill: `var(--${etat})`, stroke: "var(--carte)", "stroke-width": 2 }));
    g.appendChild(el("circle", { cx: sx(x0), cy: sy(y0, o.Y, H1), r: 11, fill: "var(--courbe)", stroke: "var(--carte)", "stroke-width": 3, style: "cursor:grab" }));
    g.appendChild(el("text", { x: sx(x0) + 14, y: sy(y0, o.Y, H1) - 12, "font-family": "var(--math)", "font-style": "italic", "font-size": 22, fill: "var(--courbe)" }, "M"));
    // constat
    const c = $("constat");
    c.style.setProperty("--etat", `var(--${etat})`);
    const sens = etat === "positif" ? `<strong style="color:var(--positif)">positif</strong> : la tangente monte, <span class="m">f</span> est <strong>croissante</strong> autour de ce point.`
      : etat === "negatif" ? `<strong style="color:var(--negatif)">négatif</strong> : la tangente descend, <span class="m">f</span> est <strong>décroissante</strong> autour de ce point.`
      : `<strong style="color:var(--nul)">nul</strong> : la tangente est horizontale.`;
    c.innerHTML = `<span class="m">x</span> = ${fr(x0)} et <span class="m">${o.dnom.replace("x)", "x)")}</span>, donc <span class="m">f</span>′(${fr(x0)}) ≈ ${fr(p)} est ${sens}`;
    tableau(o);
  }
  function tableau(o) {
    const t = $("tab"); t.textContent = "";
    const L = 150, R = [5, 55, 105, 215], Wt = 880, x0t = 10 + L;
    t.appendChild(el("rect", { x: 10, y: R[0], width: Wt - 10, height: R[3] - R[0], fill: "none", stroke: "var(--encre)", "stroke-width": 1.5 }));
    [R[1], R[2]].forEach(y => t.appendChild(el("line", { x1: 10, x2: Wt, y1: y, y2: y, stroke: "var(--encre)", "stroke-width": 1.5 })));
    t.appendChild(el("line", { x1: x0t, x2: x0t, y1: R[0], y2: R[3], stroke: "var(--encre)", "stroke-width": 1.5 }));
    const txt = (x, y, s, it, taille = 22) => t.appendChild(el("text", { x, y, "text-anchor": "middle", "font-size": taille, "font-style": it ? "italic" : "normal", "font-family": "var(--math)", fill: "var(--encre)" }, s));
    txt(10 + L / 2, R[0] + 33, "x", true); txt(10 + L / 2, R[1] + 33, "f′(x)", true); txt(10 + L / 2, R[2] + 48, "f", true);
    const z = o.z, n = z.length, larg = Wt - x0t, pos = i => x0t + larg * (i + 1) / (n + 1);
    txt(x0t + 30, R[0] + 33, "−∞"); txt(Wt - 30, R[0] + 33, "+∞");
    z.forEach((v, i) => { txt(pos(i), R[0] + 33, fr(v)); t.appendChild(el("line", { x1: pos(i), x2: pos(i), y1: R[1], y2: R[2], stroke: "var(--encre)", "stroke-dasharray": "4 4" })); txt(pos(i), R[1] + 33, "0"); });
    const cols = [x0t, ...z.map((_, i) => pos(i)), Wt], pts = [-1e3, ...z, 1e3];
    const signes = [];
    for (let i = 0; i <= n; i++) { const m = i === 0 ? z.length ? z[0] - 1 : 0 : i === n ? z[n - 1] + 1 : (pts[i] + pts[i + 1]) / 2; const s = o.d(m) > 0; signes.push(s); txt((cols[i] + cols[i + 1]) / 2, R[1] + 34, s ? "+" : "−", false, 26); }
    // flèches de variations
    const haut = R[2] + 30, bas = R[3] - 32;
    for (let i = 0; i <= n; i++) {
      const a = cols[i] + (i ? 16 : 28), b = cols[i + 1] - (i < n ? 16 : 28), monte = signes[i];
      const y1 = monte ? bas : haut, y2 = monte ? haut : bas;
      t.appendChild(el("line", { x1: a, y1, x2: b, y2, stroke: "var(--encre)", "stroke-width": 1.6, "marker-end": "url(#fl)" }));
    }
    const defs = t.appendChild(el("defs")), mk = defs.appendChild(el("marker", { id: "fl", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }));
    mk.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--encre)" }));
    z.forEach((v, i) => { const extr = signes[i] && !signes[i + 1] ? haut - 10 : !signes[i] && signes[i + 1] ? bas + 24 : null; if (extr != null) txt(pos(i), extr, fr(o.f(v)), false, 18); });
  }
  // glisser
  const g = $("g"); let actif = false;
  const versX = ev => { const r = g.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W; x0 = ix(px); maj(); };
  g.addEventListener("pointerdown", ev => { actif = true; g.setPointerCapture(ev.pointerId); versX(ev); });
  g.addEventListener("pointermove", ev => { if (actif) versX(ev); });
  g.addEventListener("pointerup", () => actif = false);
  g.addEventListener("pointercancel", () => actif = false);
  window.addEventListener("keydown", ev => { if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { x0 += (ev.key === "ArrowRight" ? 1 : -1) * (F[k].X[1] - F[k].X[0]) / 100; maj(); } });
  x0 = 0.4; maj();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
