<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Problèmes d'optimisation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Un problème à la fois : la figure qui se déforme quand x varie, et à côté la courbe
   de la grandeur à optimiser, parcourue par le même point. Le bouton révèle l'optimum. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e7eaef;
  --courbe: #1f5fbf; --objet: #2e7d32; --objet-fond: rgba(46, 125, 50, 0.18); --coupe: #c62828; --coupe-fond: rgba(214, 48, 48, 0.16); --optimum: #d35400;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --courbe: #6fa3f0; --objet: #6fcf7a; --objet-fond: rgba(111, 207, 122, 0.2); --coupe: #f07a7a; --coupe-fond: rgba(240, 122, 122, 0.18); --optimum: #f0a35e; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --courbe: #6fa3f0; --objet: #6fcf7a; --objet-fond: rgba(111, 207, 122, 0.2); --coupe: #f07a7a; --coupe-fond: rgba(240, 122, 122, 0.18); --optimum: #f0a35e; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.m { font-family: var(--math); font-style: italic; }
.onglets { display: flex; flex-wrap: wrap; gap: 6px; }
.onglets button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
.onglets button[aria-pressed="true"] { border-color: var(--courbe); box-shadow: inset 0 0 0 1px var(--courbe); font-weight: 600; }
.enonce { margin: 0; font-size: 16px; max-width: 75ch; }
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.panneau { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 8px; min-width: 0; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; }
.commande { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.commande label { font-family: var(--math); font-size: 20px; font-style: italic; }
.commande input { width: 100%; accent-color: var(--courbe); }
.commande button { font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--optimum); color: #fff; cursor: pointer; }
.constat { margin: 0; font-size: 17px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--filet); background: var(--carte); }
.constat b { font-family: var(--math); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--optimum); outline-offset: 2px; }
@media (max-width: 560px) { .commande { grid-template-columns: auto minmax(0, 1fr); } .commande button { grid-column: 1 / -1; } }
</style>

<div class="page">
  <span class="niveau">Première spécialité · Chapitre 8 · Applications de la dérivation</span>
  <h1>Problèmes d'optimisation</h1>
  <div class="onglets" id="onglets" role="group" aria-label="Choix du problème"></div>
  <p class="enonce" id="enonce"></p>
  <div class="duo">
    <div class="panneau"><svg id="fig" viewBox="0 0 440 340" role="img" aria-label="Figure du problème"></svg></div>
    <div class="panneau"><svg id="gr" viewBox="0 0 440 340" role="img" aria-label="Courbe de la grandeur à optimiser"></svg></div>
  </div>
  <div class="commande">
    <label for="cx" id="nomx">x</label>
    <input id="cx" type="range" min="0" max="1000" value="300">
    <button type="button" id="voir">Voir l'optimum</button>
  </div>
  <p class="constat" id="constat"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = (x, d = 2) => { const r = Math.round(x * 10 ** d) / 10 ** d; return (Object.is(r, -0) ? 0 : r).toLocaleString("fr-FR", { maximumFractionDigits: d }).replace("-", "−"); };
  const T = (g, x, y, s, o = {}) => g.appendChild(el("text", Object.assign({ x, y, "text-anchor": "middle", "font-size": 17, "font-family": "var(--math)", "font-style": "italic", fill: "var(--encre)", stroke: "var(--carte)", "stroke-width": 5, "paint-order": "stroke" }, o), s));
  const R = (g, x, y, w, h, o) => g.appendChild(el("rect", Object.assign({ x, y, width: Math.max(0, w), height: Math.max(0, h) }, o)));
  const P = (g, d, o) => g.appendChild(el("path", Object.assign({ d }, o)));
  const objet = { fill: "var(--objet-fond)", stroke: "var(--objet)", "stroke-width": 2.5 };
  const coupe = { fill: "var(--coupe-fond)", stroke: "var(--coupe)", "stroke-width": 1.5 };
  const trait = { fill: "none", stroke: "var(--encre)", "stroke-width": 1.5 };
  // une boîte ouverte vue en perspective cavalière : largeur a, profondeur b, hauteur h (en pixels)
  function boite(g, x0, y0, a, b, h) {
    const dx = b * 0.5, dy = -b * 0.35;
    P(g, `M${x0},${y0} h${a} l${dx},${dy} v${-h} l${-dx},${-dy} h${-a} z`, objet);
    P(g, `M${x0},${y0 - h} l${dx},${dy} h${a} M${x0 + dx},${y0 + dy - h} v${h}`, { fill: "none", stroke: "var(--objet)", "stroke-width": 1, "stroke-dasharray": "4 3" });
    P(g, `M${x0},${y0} v${-h} M${x0 + a},${y0} v${-h}`, { fill: "none", stroke: "var(--objet)", "stroke-width": 2.5 });
  }
  // patron d'une boîte : rectangle L × l, carrés de côté x coupés dans les coins
  function patron(g, L, l, x, s, ox, oy) {
    R(g, ox, oy, L * s, l * s, trait);
    for (const [cx, cy] of [[0, 0], [L - x, 0], [0, l - x], [L - x, l - x]]) R(g, ox + cx * s, oy + cy * s, x * s, x * s, coupe);
    R(g, ox + x * s, oy + x * s, (L - 2 * x) * s, (l - 2 * x) * s, objet);
    T(g, ox + x * s / 2, oy - 6, "x", { fill: "var(--coupe)" });
  }
  const PB = [
    { id: "rectangle", nom: "Rectangle de périmètre 60 cm", src: "cours",
      enonce: "Un rectangle a pour périmètre 60 cm. On note x sa largeur, en cm. Pour quelle largeur son aire est-elle maximale ?",
      dom: [0, 30], f: x => x * (30 - x), fn: "A", u: "cm²", type: "max", opt: 15,
      fig(g, x) { const s = 10; R(g, 220 - x * s / 2 - (30 - x) * 0 , 0, 0, 0, {}); const w = (30 - x) * s, h = x * s, ox = 220 - w / 2, oy = 170 - h / 2; R(g, ox, oy, w, h, objet); T(g, ox - 14, oy + h / 2 + 5, "x"); T(g, ox + w / 2, oy - 8, "30 − x"); },
      conclu: "Le rectangle d'aire maximale est un carré de 15 cm de côté : son aire vaut 225 cm²." },
    { id: "boite", nom: "Boîte du pâtissier", src: "cours",
      enonce: "Dans une plaque carrée de 12 cm de côté, on découpe un carré de côté x dans chaque coin, puis on plie. Pour quelle valeur de x le volume de la boîte est-il maximal ?",
      dom: [0, 6], f: x => x * (12 - 2 * x) ** 2, fn: "V", u: "cm³", type: "max", opt: 2,
      fig(g, x) { patron(g, 12, 12, x, 13, 14, 50); const s = 16; boite(g, 232, 315, (12 - 2 * x) * s * 0.75, (12 - 2 * x) * s * 0.75, x * s); T(g, 330, 40, "boîte pliée", { "font-style": "normal", "font-family": "var(--ui)", "font-size": 14, fill: "var(--discret)" }); },
      conclu: "Le volume est maximal pour x = 2 cm : la boîte mesure 8 cm × 8 cm × 2 cm, soit 128 cm³." },
    { id: "aire", nom: "Rectangle d'aire 36 cm²", src: "TD",
      enonce: "Un rectangle a pour aire 36 cm². On note x sa largeur, en cm. Pour quelle largeur son périmètre est-il minimal ?",
      dom: [1, 18], f: x => 2 * x + 72 / x, fn: "P", u: "cm", type: "min", opt: 6,
      fig(g, x) { const s = 13, w = Math.min(36 / x * s, 420), h = x * s, ox = 220 - w / 2, oy = 175 - h / 2; R(g, ox, oy, w, h, objet); T(g, ox - 14, oy + h / 2 + 5, "x"); T(g, ox + w / 2, oy - 8, "36/x"); },
      conclu: "Le périmètre est minimal pour un carré de 6 cm de côté : il vaut 24 cm." },
    { id: "hangar", nom: "Habitat sous le hangar", src: "TD",
      enonce: "Sous le toit parabolique d'équation y = −x²/4 + 3x/2, on place la façade rectangulaire DEFG, symétrique par rapport à (CO), avec AG = x. Pour quelle valeur de x son aire est-elle maximale ?",
      dom: [0, 3], f: x => (6 - 2 * x) * (-x * x / 4 + 1.5 * x), fn: "A", u: "m²", type: "max", opt: 3 - Math.sqrt(3),
      fig(g, x) { const s = 66, ox = 22, oy = 290, f = t => -t * t / 4 + 1.5 * t; let d = ""; for (let i = 0; i <= 60; i++) { const t = 6 * i / 60; d += (i ? "L" : "M") + (ox + t * s) + "," + (oy - f(t) * s); } P(g, `M${ox - 10},${oy} H${ox + 6 * s + 10}`, trait); P(g, d, { fill: "none", stroke: "var(--encre)", "stroke-width": 3 });
        R(g, ox + x * s, oy - f(x) * s, (6 - 2 * x) * s, f(x) * s, objet); T(g, ox, oy + 22, "A", { "font-style": "normal" }); T(g, ox + 6 * s, oy + 22, "B", { "font-style": "normal" }); T(g, ox + x * s, oy + 22, "G", { "font-style": "normal" }); T(g, ox + (6 - x) * s, oy + 22, "F", { "font-style": "normal" }); T(g, ox + x * s / 2, oy - 8, "x"); },
      conclu: "L'aire est maximale pour x = 3 − √3 ≈ 1,27 m : elle vaut environ 5,2 m²." },
    { id: "casserole", nom: "Casserole de 1 000 cm³", src: "TD",
      enonce: "Une casserole cylindrique a un volume de 1 000 cm³. On note x le rayon du fond, en cm. Pour quel rayon utilise-t-on le moins de matière ?",
      dom: [2.5, 15], f: x => Math.PI * x * x + 2000 / x, fn: "A", u: "cm²", type: "min", opt: Math.cbrt(1000 / Math.PI),
      fig(g, x) { const s = 13, r = Math.min(x * s, 200), h = Math.min(1000 / (Math.PI * x * x) * s, 250), cx = 220, by = 310, e = r * 0.28; P(g, `M${cx - r},${by - h} V${by} A${r},${e} 0 0 0 ${cx + r},${by} V${by - h}`, objet); g.appendChild(el("ellipse", { cx, cy: by - h, rx: r, ry: e, fill: "var(--carte)", stroke: "var(--objet)", "stroke-width": 2.5 })); P(g, `M${cx},${by} h${r}`, { stroke: "var(--coupe)", "stroke-width": 2 }); T(g, cx + r / 2, by - 6, "x", { fill: "var(--coupe)" }); T(g, cx + r + 22, by - h / 2, "h"); T(g, 80, 40, `h ≈ ${fr(1000 / (Math.PI * x * x), 1)} cm`, { "font-style": "normal", "font-size": 15 }); },
      conclu: "La matière est minimale pour x ≈ 6,83 cm ; la hauteur h est alors égale au rayon x." },
    { id: "petits-fours", nom: "Boîte des petits fours", src: "fiche",
      enonce: "Dans une plaque de 25 cm sur 15 cm, on découpe un carré de côté x dans chaque coin, puis on plie. Quel est le volume maximal de la boîte ?",
      dom: [0, 7.5], f: x => x * (25 - 2 * x) * (15 - 2 * x), fn: "V", u: "cm³", type: "max", opt: (160 - Math.sqrt(7600)) / 24,
      fig(g, x) { patron(g, 25, 15, x, 8, 14, 30); const s = 9; boite(g, 150, 325, (25 - 2 * x) * s, (15 - 2 * x) * s, x * s); },
      conclu: "Le volume est maximal pour x ≈ 3,03 cm : il vaut environ 513 cm³." },
    { id: "stade", nom: "Stade olympique", src: "fiche",
      enonce: "La piste intérieure d'un stade (un rectangle et deux demi-cercles de rayon x) mesure 400 m. Pour quelle valeur de x la surface rectangulaire est-elle maximale ?",
      dom: [0, 400 / (2 * Math.PI)], f: x => 2 * x * (200 - Math.PI * x), fn: "A", u: "m²", type: "max", opt: 100 / Math.PI,
      fig(g, x) { const s = 1.6, L = (200 - Math.PI * x) * s, r = x * s, cx = 220, cy = 170; R(g, cx - L / 2, cy - r, L, 2 * r, objet); P(g, `M${cx - L / 2},${cy - r} A${r},${r} 0 0 0 ${cx - L / 2},${cy + r} M${cx + L / 2},${cy - r} A${r},${r} 0 0 1 ${cx + L / 2},${cy + r}`, { fill: "none", stroke: "var(--encre)", "stroke-width": 2.5 }); P(g, `M${cx - L / 2},${cy - r} H${cx + L / 2} M${cx - L / 2},${cy + r} H${cx + L / 2}`, { stroke: "var(--encre)", "stroke-width": 2.5 }); P(g, `M${cx + L / 2},${cy} h${r}`, { stroke: "var(--coupe)", "stroke-width": 2 }); T(g, cx + L / 2 + r / 2, cy - 6, "x", { fill: "var(--coupe)" }); T(g, cx, cy - r - 10, "200 − πx"); },
      conclu: "La surface est maximale pour x = 100/π ≈ 31,8 m : le rectangle mesure 100 m sur 63,7 m environ." },
    { id: "potager", nom: "Potager de mamie", src: "fiche",
      enonce: "Dans une cour ABCD de 8 m sur 4 m, on délimite deux carrés de potager AEFG et IJCK dans deux coins opposés, avec G, F, I et J alignés. On note x = AE. Pour quelle valeur de x l'aire restante est-elle maximale ?",
      dom: [0, 4], f: x => 32 - x * x - (4 - x) ** 2, fn: "A", u: "m²", type: "max", opt: 2,
      fig(g, x) { const s = 50, ox = 20, oy = 70; R(g, ox, oy, 8 * s, 4 * s, objet); R(g, ox, oy + (4 - x) * s, x * s, x * s, coupe); R(g, ox + (8 - (4 - x)) * s, oy, (4 - x) * s, (4 - x) * s, coupe); P(g, `M${ox},${oy + (4 - x) * s} H${ox + 8 * s}`, { stroke: "var(--discret)", "stroke-dasharray": "5 4" }); T(g, ox - 10, oy + 4 * s + 18, "A", { "font-style": "normal" }); T(g, ox + 8 * s + 10, oy + 4 * s + 18, "B", { "font-style": "normal" }); T(g, ox + 8 * s + 10, oy - 6, "C", { "font-style": "normal" }); T(g, ox - 10, oy - 6, "D", { "font-style": "normal" }); T(g, ox + x * s / 2, oy + 4 * s + 20, "x"); },
      conclu: "L'aire restante est maximale pour x = 2 m : deux carrés de 2 m de côté, et il reste 24 m²." },
    { id: "pave", nom: "Pavé du laboratoire", src: "fiche",
      enonce: "Un pavé droit de largeur x, de longueur 2x et de hauteur y a un volume de 576 mm³. Pour quelle valeur de x (entre 3 et 12 mm) son aire totale est-elle minimale ?",
      dom: [3, 12], f: x => 4 * x * x + 1728 / x, fn: "A", u: "mm²", type: "min", opt: 6,
      fig(g, x) { const s = 13, y = 288 / (x * x), a = 2 * x * s, b = x * s, h = Math.min(y * s, 240), x0 = 200 - a / 2 - b * 0.25, y0 = 300, dx = b * 0.5, dy = -b * 0.35; P(g, `M${x0},${y0} h${a} v${-h} h${-a} z`, objet); P(g, `M${x0},${y0 - h} l${dx},${dy} h${a} l${-dx},${-dy} z`, objet); P(g, `M${x0 + a},${y0} l${dx},${dy} v${-h} l${-dx},${-dy} z`, objet); T(g, x0 + a / 2, y0 + 20, "2x"); T(g, x0 + a + dx / 2 + 12, y0 + dy / 2 + 4, "x"); T(g, x0 - 14, y0 - h / 2, "y"); T(g, 80, 40, `y ≈ ${fr(y, 1)} mm`, { "font-style": "normal", "font-size": 15 }); },
      conclu: "L'aire totale est minimale pour x = 6 mm ; alors y = 8 mm et l'aire vaut 432 mm²." },
    { id: "benefice", nom: "Bénéfice de l'entreprise", src: "fiche",
      enonce: "Une entreprise fabrique x pièces par jour (0 ≤ x ≤ 25), vendues 247 € l'une ; le coût vaut C(x) = x³ − 30x² + 400x + 100. Combien de pièces produire pour un bénéfice maximal ?",
      dom: [0, 25], f: x => -(x ** 3) + 30 * x * x - 153 * x - 100, fn: "B", u: "€", type: "max", opt: 17,
      fig(g, x) { const sx = t => 40 + t * 15.5, sy = v => 310 - v * 0.043, C = t => t ** 3 - 30 * t * t + 400 * t + 100; P(g, `M40,310 H${sx(25) + 5} M40,310 V20`, trait); let dc = "", dr = ""; for (let i = 0; i <= 50; i++) { const t = 25 * i / 50; dc += (i ? "L" : "M") + sx(t) + "," + sy(C(t)); dr += (i ? "L" : "M") + sx(t) + "," + sy(247 * t); } P(g, dc, { fill: "none", stroke: "var(--coupe)", "stroke-width": 3 }); P(g, dr, { fill: "none", stroke: "var(--objet)", "stroke-width": 3 });
        const yc = sy(C(x)), yr = sy(247 * x); P(g, `M${sx(x)},${yc} V${yr}`, { stroke: yr < yc ? "var(--objet)" : "var(--coupe)", "stroke-width": 6, opacity: .55 }); T(g, sx(24), sy(C(24)) - 10, "C", { fill: "var(--coupe)" }); T(g, sx(24), sy(247 * 24) + 22, "R", { fill: "var(--objet)" }); T(g, 120, 40, "bénéfice = R − C", { "font-style": "normal", "font-size": 15 }); },
      conclu: "Le bénéfice est maximal pour 17 pièces par jour : il vaut 1 056 €." }
  ];
  let k = 0, x = 0, revele = false;
  const ong = $("onglets");
  PB.forEach((p, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = p.nom; b.addEventListener("click", () => choisir(i)); ong.appendChild(b); });
  function choisir(i) { k = i; revele = false; const p = PB[i]; x = p.dom[0] + (p.dom[1] - p.dom[0]) * 0.22; $("cx").value = 220; try { history.replaceState(null, "", "#" + p.id); } catch (e) {} maj(); }
  function courbe(p) {
    const g = $("gr"); g.textContent = "";
    const N = 200, xs = [], ys = [];
    for (let i = 0; i <= N; i++) { const t = p.dom[0] + (p.dom[1] - p.dom[0]) * i / N; xs.push(t); ys.push(p.f(t)); }
    let ymin = Math.min(0, ...ys), ymax = Math.max(...ys); if (p.type === "min") { ymin = 0; ymax = Math.min(ymax, p.f(p.opt) * 2.6); }
    const G = 50, D = 425, H = 18, B = 300, sx = t => G + (t - p.dom[0]) / (p.dom[1] - p.dom[0]) * (D - G), sy = v => B - (v - ymin) / (ymax - ymin) * (B - H);
    P(g, `M${G},${sy(0)} H${D} M${G},${B} V${H - 8}`, trait);
    g.appendChild(el("clipPath", { id: "cg" })).appendChild(el("rect", { x: G, y: H - 6, width: D - G, height: B - H + 12 }));
    P(g, xs.map((t, i) => (i ? "L" : "M") + sx(t).toFixed(1) + "," + Math.max(-500, sy(ys[i])).toFixed(1)).join(""), { fill: "none", stroke: "var(--courbe)", "stroke-width": 3.5, "clip-path": "url(#cg)" });
    T(g, G - 4, H, `${p.fn}(x)`, { "text-anchor": "end", "font-size": 16 });
    T(g, D, sy(0) + 34, "x", { "font-size": 16 });
