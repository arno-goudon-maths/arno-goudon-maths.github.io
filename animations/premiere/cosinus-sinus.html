<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Cosinus et sinus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Cours de 1re spé, chapitre 2 : M point image du réel x, cos(x) abscisse et sin(x) ordonnée de M.
   cos en bleu (axe des abscisses), sin en orange (axe des ordonnées). M s'aimante sur les valeurs
   remarquables (multiples de π/6 et de π/4), où les valeurs exactes s'affichent. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --cos: #1a56db; --sin: #f07800; --m: #7c3aed;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --cos: #6fa3f0; --sin: #ff9a3c; --m: #b48cff; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --cos: #6fa3f0; --sin: #ff9a3c; --m: #b48cff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.poignee { cursor: grab; } .poignee:active { cursor: grabbing; }
.constat { font-family: var(--math); font-size: clamp(18px, 2.6vw, 24px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); }
.constat .x { color: var(--m); font-weight: 600; } .constat .c { color: var(--cos); font-weight: 600; } .constat .s { color: var(--sin); font-weight: 600; }
</style>

<div class="page">
  <span class="niveau">Première spécialité · Chapitre 2 · Trigonométrie</span>
  <h1>Cosinus et sinus d'un réel</h1>
  <p class="chapeau">Faites glisser le point <i>M</i>, image du réel <i>x</i>, sur le cercle trigonométrique : son abscisse est cos(<i>x</i>), son ordonnée est sin(<i>x</i>). Le point s'arrête sur les valeurs remarquables.</p>
  <div class="figure"><svg id="g" viewBox="0 0 900 600" role="img" aria-label="Cercle trigonométrique, point M et projections sur les axes"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const CX = 450, CY = 300, R = 230, PI = Math.PI;
  const svg = $("g");
  let th = PI / 6, remarquable = true;
  // valeurs remarquables : angle en multiples de π/12 → (nom, cos exact, sin exact)
  const EX = { 0: "0", 0.5: "1/2", [Math.SQRT2 / 2]: "√2/2", [Math.sqrt(3) / 2]: "√3/2", 1: "1" };
  function exact(v) {
    const a = Math.abs(v);
    for (const k in EX) if (Math.abs(a - +k) < 1e-9) return (v < -1e-9 ? "−" : "") + EX[k];
    return null;
  }
  function nomAngle(t) {           // mesure principale dans ]−π ; π], en fraction de π
    let n = Math.round(t / (PI / 12));          // en douzièmes de π
    n = ((n % 24) + 24) % 24; if (n > 12) n -= 24;
    if (n === 0) return "0";
    const pg = (a, b) => b ? pg(b, a % b) : a, g = pg(Math.abs(n), 12), num = n / g, den = 12 / g;
    const s = num < 0 ? "−" : "", a = Math.abs(num);
    return s + (a === 1 ? "" : a) + "π" + (den === 1 ? "" : "/" + den);
  }
  const REM = [];
  for (let k = 0; k < 12; k++) REM.push(k * PI / 6);
  for (let k = 1; k < 8; k += 2) REM.push(k * PI / 4);

  function dessin() {
    svg.textContent = "";
    // axes et graduations
    svg.appendChild(el("line", { x1: CX - R - 50, y1: CY, x2: CX + R + 50, y2: CY, stroke: "var(--encre)", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: CX, y1: CY - R - 40, x2: CX, y2: CY + R + 40, stroke: "var(--encre)", "stroke-width": 1.5 }));
    svg.appendChild(el("circle", { cx: CX, cy: CY, r: R, fill: "none", stroke: "var(--encre)", "stroke-width": 2 }));
    [[1, "1"], [-1, "−1"]].forEach(([v, t]) => {
      svg.appendChild(el("text", { x: CX + v * R + (v > 0 ? 8 : -8), y: CY + 22, "text-anchor": v > 0 ? "start" : "end", "font-family": "var(--math)", "font-size": 17, fill: "var(--discret)" }, t));
      svg.appendChild(el("text", { x: CX - 10, y: CY - v * R + (v > 0 ? -8 : 20), "text-anchor": "end", "font-family": "var(--math)", "font-size": 17, fill: "var(--discret)" }, t));
    });
    svg.appendChild(el("text", { x: CX - 10, y: CY + 22, "text-anchor": "end", "font-family": "var(--math)", "font-style": "italic", "font-size": 17, fill: "var(--discret)" }, "O"));
    // points remarquables
    REM.forEach(a => svg.appendChild(el("circle", { cx: CX + R * Math.cos(a), cy: CY - R * Math.sin(a), r: 3.5, fill: "var(--discret)", opacity: 0.6 })));
    const c = Math.cos(th), s = Math.sin(th), mx = CX + R * c, my = CY - R * s;
    // arc de l'angle
    const ra = 46, grand = (((th % (2 * PI)) + 2 * PI) % (2 * PI)) > PI ? 1 : 0;
    const thp = ((th % (2 * PI)) + 2 * PI) % (2 * PI);
    if (thp > 1e-6) svg.appendChild(el("path", { d: `M${CX + ra},${CY} A${ra},${ra} 0 ${thp > PI ? 1 : 0} 0 ${CX + ra * c},${CY - ra * s}`, fill: "none", stroke: "var(--m)", "stroke-width": 2 }));
    svg.appendChild(el("line", { x1: CX, y1: CY, x2: mx, y2: my, stroke: "var(--m)", "stroke-width": 2 }));
    // projections
    svg.appendChild(el("line", { x1: mx, y1: my, x2: mx, y2: CY, stroke: "var(--cos)", "stroke-width": 1.5, "stroke-dasharray": "6 5" }));
    svg.appendChild(el("line", { x1: mx, y1: my, x2: CX, y2: my, stroke: "var(--sin)", "stroke-width": 1.5, "stroke-dasharray": "6 5" }));
    svg.appendChild(el("line", { x1: CX, y1: CY, x2: mx, y2: CY, stroke: "var(--cos)", "stroke-width": 6, "stroke-linecap": "round" }));
    svg.appendChild(el("line", { x1: CX, y1: CY, x2: CX, y2: my, stroke: "var(--sin)", "stroke-width": 6, "stroke-linecap": "round" }));
    const ec = remarquable ? exact(c) : null, es = remarquable ? exact(s) : null;
    const dec = v => (Math.round(v * 100) / 100).toFixed(2).replace(".", ",").replace("-", "−");
    svg.appendChild(el("text", { x: mx, y: CY + (s >= 0 ? 26 : -12), "text-anchor": "middle", "font-family": "var(--math)", "font-size": 20, fill: "var(--cos)" }, ec || "≈ " + dec(c)));
    svg.appendChild(el("text", { x: CX + (c >= 0 ? -12 : 12), y: my + 7, "text-anchor": c >= 0 ? "end" : "start", "font-family": "var(--math)", "font-size": 20, fill: "var(--sin)" }, es || "≈ " + dec(s)));
    // M
    svg.appendChild(el("circle", { cx: mx, cy: my, r: 8, fill: "var(--m)" }));
    svg.appendChild(el("text", { x: mx + 22 * c, y: my - 22 * s + 7, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-size": 22, fill: "var(--m)" }, "M"));
    const h = el("circle", { cx: mx, cy: my, r: 22, fill: "var(--m)", opacity: 0.15, class: "poignee" });
    svg.appendChild(h);
    glisse(h, p => {
      let t = Math.atan2(CY - p.y, p.x - CX);
      remarquable = false;
      for (const a of REM) { let d = Math.abs(((t - a) % (2 * PI) + 3 * PI) % (2 * PI) - PI); if (d < 0.06) { t = a; remarquable = true; break; } }
      th = t;
    });
    $("constat").innerHTML = remarquable
      ? `<span class="x">x = ${nomAngle(th)}</span> : cos(x) = <span class="c">${ec}</span> et sin(x) = <span class="s">${es}</span>`
      : `<span class="x">x ≈ ${dec(Math.atan2(s, c))}</span> rad : cos(x) ≈ <span class="c">${dec(c)}</span> et sin(x) ≈ <span class="s">${dec(s)}</span>`;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return { x: (evt.clientX - r.left) * 900 / r.width, y: (evt.clientY - r.top) * 600 / r.height }; }
  function glisse(node, maj) {
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { maj(point(ev)); dessin(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
