<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Probabilités en images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Première spécialité, chapitre 5, TD5 : arbre pondéré et mosaïque (aires proportionnelles aux probabilités) pour chaque exercice ; la condition est entourée en orange, l'événement en bleu. Ancre #eN pour les QR codes des exercices. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e7eaef;
  --courbe: #1f5fbf; --plus: #1f5fbf; --moins: #7b4fa0; --zero: #d35400; --sol: #d35400; --vert: #0b8a3a; --secante: #1f5fbf; --tangente: #d35400; --attention: #9a5b00;
  --sel: #1f5fbf; --cond: #f07800; --cond-fond: #fde7cf; --fond1: #e4eaf3; --fond2: #f1f3f6; --fond3: #d9e6d2; --porte: #8a5a2b;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34;
    --courbe: #6fa3f0; --plus: #6fa3f0; --moins: #c49be6; --zero: #f0a35e; --sol: #f0a35e; --vert: #5fd38a; --secante: #6fa3f0; --tangente: #f0a35e; --attention: #e0a64a;
    --sel: #6fa3f0; --cond: #ffa040; --cond-fond: #3d2c1a; --fond1: #26303d; --fond2: #22262d; --fond3: #2a3a2a; --porte: #a87444; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34;
    --courbe: #6fa3f0; --plus: #6fa3f0; --moins: #c49be6; --zero: #f0a35e; --sol: #f0a35e; --vert: #5fd38a; --secante: #6fa3f0; --tangente: #f0a35e; --attention: #e0a64a;
    --sel: #6fa3f0; --cond: #ffa040; --cond-fond: #3d2c1a; --fond1: #26303d; --fond2: #22262d; --fond3: #2a3a2a; --porte: #a87444; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 12px; }
.tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-right: 140px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
select { font: 500 13px var(--ui); padding: 3px 8px; border-radius: 8px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); max-width: 100%; }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(24px, 3.6vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 70ch; }
.onglets, .commandes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.onglets button, .commandes button { font: 500 13px var(--ui); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
.onglets button[aria-pressed="true"], .commandes button[aria-pressed="true"] { background: var(--encre); color: var(--carte); border-color: var(--encre); }
.commandes label { font: 500 13px var(--ui); color: var(--discret); display: flex; align-items: center; gap: 8px; }
.commandes input[type=range] { width: min(320px, 60vw); accent-color: var(--plus); }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; overflow: hidden; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-family: var(--math); font-size: clamp(17px, 2.3vw, 21px); margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); text-align: center; }
.constat .petit { display: block; font-family: var(--ui); font-size: 14px; color: var(--discret); margin-top: 2px; }
.b { color: var(--plus); } .o { color: var(--zero); } .m { color: var(--moins); }
</style>

<div class="page">
  <div class="tete">
    <span class="niveau">Première spécialité · Chapitre 5 · TD5</span>
    <select id="choix" aria-label="Exercice"></select>
  </div>
  <h1 id="titre"></h1>
  <p class="chapeau" id="chapeau"></p>
  <div class="onglets" id="onglets"></div>
  <div class="figure"><svg id="g" viewBox="0 0 900 500" role="img" aria-label="Figure de l'exercice"></svg></div>
  <div class="commandes" id="commandes"></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const svg = $("g"); let W = 900, H = 500;
  const fr = (x, d = 2) => { const r = Number((+x).toFixed(d)); return (r < 0 ? "−" : "") + String(Math.abs(r)).replace(".", ","); };
  const frac = x => { for (const q of [1, 2, 3, 4, 5, 6, 8, 9, 12]) { const p = Math.round(x * q); if (Math.abs(p / q - x) < 1e-9) return q === 1 ? fr(p, 0) : (p < 0 ? "−" : "") + Math.abs(p) + "/" + q; } return fr(x, 2); };
  const texte = (x, y, t, o = {}) => svg.appendChild(el("text", Object.assign({ x, y, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 17, fill: "var(--encre)", "paint-order": "stroke", stroke: "var(--carte)", "stroke-width": 4 }, o), t));
  const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  const sup = d => String(d).split("").map(c => SUP[c] || c).join("");

  // repère : fenêtre [xmin, xmax, ymin, ymax], pas des graduations
  function repere(fen, pas = [1, 1], cadre = [55, 20, 20, 30]) {
    const [a, b, c, d] = fen, [gx, dx, hy, by] = cadre;
    const X = x => gx + (W - gx - dx) * (x - a) / (b - a), Y = y => H - by - (H - hy - by) * (y - c) / (d - c);
    const id = "clip" + Math.random().toString(36).slice(2, 7);
    const cp = el("clipPath", { id }); cp.appendChild(el("rect", { x: gx, y: hy, width: W - gx - dx, height: H - hy - by })); svg.appendChild(cp);
    const g = el("g", { "clip-path": `url(#${id})` }); svg.appendChild(g);
    const ax = Math.min(Math.max(Y(0), hy), H - by), ay = Math.min(Math.max(X(0), gx), W - dx);
    for (let x = Math.ceil(a / pas[0]) * pas[0]; x <= b + 1e-9; x += pas[0]) {
      g.appendChild(el("line", { x1: X(x), y1: hy, x2: X(x), y2: H - by, stroke: "var(--grille)" }));
      if (Math.abs(x) > 1e-9) texte(X(x), Math.min(ax + 18, H - by + 18), fr(x, 2), { "font-size": 13, fill: "var(--discret)" });
    }
    for (let y = Math.ceil(c / pas[1]) * pas[1]; y <= d + 1e-9; y += pas[1]) {
      g.appendChild(el("line", { x1: gx, y1: Y(y), x2: W - dx, y2: Y(y), stroke: "var(--grille)" }));
      if (Math.abs(y) > 1e-9) texte(Math.max(ay - 7, gx - 7), Y(y) + 5, fr(y, 2), { "font-size": 13, fill: "var(--discret)", "text-anchor": "end" });
    }
    g.appendChild(el("line", { x1: gx, y1: ax, x2: W - dx, y2: ax, stroke: "var(--encre)", "stroke-width": 1.2 }));
    g.appendChild(el("line", { x1: ay, y1: hy, x2: ay, y2: H - by, stroke: "var(--encre)", "stroke-width": 1.2 }));
    if (a < 0 && b > 0 && c < 0 && d > 0) texte(X(0) - 9, Y(0) + 17, "O", { "font-size": 14, fill: "var(--discret)", "font-style": "italic" });
    const R = { X, Y, g, fen, gx, dx, hy, by };
    // une courbe, éventuellement colorée selon le signe de la fonction
    R.courbe = (f, o = {}) => {
      const N = 600, [u, v] = o.dom || [a, b]; let d0 = "", coul = null;
      const vider = () => { if (d0) g.appendChild(el("path", { d: d0, fill: "none", stroke: coul, "stroke-width": o.ep || 3.2, "stroke-dasharray": o.tirets || "", "stroke-linejoin": "round", "stroke-linecap": "round" })); d0 = ""; };
      for (let i = 0; i <= N; i++) {
        const x = u + (v - u) * i / N, y = f(x);
        if (!isFinite(y) || Math.abs(y) > 1e6 || Math.abs(Y(y)) > 4000) { vider(); continue; }
        const cc = o.signe ? (y > 1e-9 ? "var(--plus)" : y < -1e-9 ? "var(--moins)" : coul || "var(--plus)") : (o.c || "var(--courbe)");
        if (cc !== coul && d0) { d0 += `L${X(x)},${Y(y)}`; vider(); }
        coul = cc; d0 += (d0 ? "L" : "M") + `${X(x)},${Y(y)}`;
      }
      vider();
      if (o.nom) { const xe = o.xNom ?? (u + (v - u) * 0.88); texte(X(xe) + (o.dxNom || 8), Y(f(xe)) + (o.dyNom ?? -10), o.nom, { "text-anchor": "start", fill: o.c || "var(--courbe)", "font-style": "italic" }); }
    };
    R.droite = (m, p, o = {}) => { R.courbe(x => m * x + p, Object.assign({ ep: 2.2 }, o)); };
    R.point = (x, y, nom, o = {}) => {
      g.appendChild(el("circle", { cx: X(x), cy: Y(y), r: o.r || 5.5, fill: o.c || "var(--encre)" }));
      if (nom) texte(X(x) + (o.dx ?? 10), Y(y) + (o.dy ?? -10), nom, { "text-anchor": o.ancre || "start", fill: o.c || "var(--encre)", "font-size": 16 });
    };
    R.seg = (x1, y1, x2, y2, o = {}) => g.appendChild(el("line", { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), stroke: o.c || "var(--encre)", "stroke-width": o.ep || 2, "stroke-dasharray": o.tirets || "" }));
    // ensemble de solutions sur l'axe des abscisses (intervalles)
    R.solution = (test, o = {}) => {
      const N = 900; let deb = null;
      const tr = (x1, x2) => g.appendChild(el("line", { x1: X(x1), y1: ax, x2: X(x2), y2: ax, stroke: o.c || "var(--sol)", "stroke-width": 7, "stroke-linecap": "butt", opacity: 0.85 }));
      for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, ok = test(x); if (ok && deb === null) deb = x; if ((!ok || i === N) && deb !== null) { tr(deb, ok ? x : x - (b - a) / N); deb = null; } }
    };
    return R;
  }
  const racines = (A, B, C) => { if (Math.abs(A) < 1e-12) return Math.abs(B) < 1e-12 ? [] : [-C / B]; const D = B * B - 4 * A * C; if (D < -1e-12) return []; if (Math.abs(D) < 1e-12) return [-B / (2 * A)]; return [(-B - Math.sqrt(D)) / (2 * A), (-B + Math.sqrt(D)) / (2 * A)].sort((p, q) => p - q); };
  // curseur générique
  function curseur(c, nom, min, max, pas, val, maj, fmt = frac) {
    const l = document.createElement("label"), b = document.createElement("b");
    b.style.cssText = "font-family:var(--math);font-size:17px;color:var(--encre);min-width:2.8em"; b.textContent = fmt(val);
    l.append(nom + " = ", b);
    const r = document.createElement("input"); r.type = "range"; r.min = min; r.max = max; r.step = pas; r.value = val;
    r.oninput = () => { let v = Math.round(+r.value / pas) * pas; if (Math.abs(v - Math.round(v)) < 1e-9) v = Math.round(v); v = Number(v.toFixed(6)); b.textContent = fmt(v); maj(v); };
    l.appendChild(r); c.appendChild(l);
  }
  function boutons(c, liste, actif, choisir) {
    liste.forEach((n, i) => { const b = document.createElement("button"); b.type = "button"; b.innerHTML = n; b.setAttribute("aria-pressed", i === actif); b.onclick = () => choisir(i); c.appendChild(b); });
  }
  // aiguillage par l'ancre #eN
  function lancer(SCENES, defaut, dessiner) {
    const etat = { scene: defaut, vue: 0 };
    function choisir(cle) {
      etat.scene = SCENES[cle] ? cle : defaut; etat.vue = 0;
      const S = SCENES[etat.scene];
      $("titre").innerHTML = S.titre; $("chapeau").innerHTML = S.chapeau; $("choix").value = etat.scene;
      const o = $("onglets"); o.textContent = "";
      if (S.vues.length > 1) boutons(o, S.vues.map(v => v.nom), 0, i => { etat.vue = i; [...o.children].forEach((x, j) => x.setAttribute("aria-pressed", j === i)); ouvrir(); });
      o.hidden = S.vues.length < 2;
      ouvrir();
    }
    function ouvrir() { const v = SCENES[etat.scene].vues[etat.vue]; v.p = v.curseur ? v.curseur[4] : v.p; v.ev = 0; dessiner(v, SCENES[etat.scene]); }
    for (const k in SCENES) { const op = document.createElement("option"); op.value = k; op.textContent = SCENES[k].titre.replace(/<[^>]+>/g, ""); $("choix").appendChild(op); }
    $("choix").onchange = () => { choisir($("choix").value); try { history.replaceState(null, "", "#" + $("choix").value); } catch (e) {} };
    const ancre = () => (location.hash.match(/e\d+/) || [defaut])[0];
    window.addEventListener("hashchange", () => choisir(ancre()));
    choisir(ancre());
  }

  // ---------- 1re spé, TD5 : probabilités conditionnelles et indépendance ----------
  // Données à deux niveaux : colonnes (premier critère) × lignes (second critère), en effectifs ou en probabilités.
  // Événement = liste de cases [colonne, ligne] ; probabilité conditionnelle = cases / cases de la condition.
  const somme = (D, cases) => cases.reduce((s, [c, r]) => s + D.m[c][r], 0);
  const tout = D => D.m.flatMap((col, c) => col.map((_, r) => [c, r]));
  const colonne = (D, c) => D.m[c].map((_, r) => [c, r]), ligne = (D, r) => D.m.map((_, c) => [c, r]);
  const inter = (a, b) => a.filter(([c, r]) => b.some(([c2, r2]) => c === c2 && r === r2));
  const dans = (cases, c, r) => cases.some(([c2, r2]) => c2 === c && r2 === r);

  function mosaique(D, ev, x0, y0, w, h, eti) {
    const T = somme(D, tout(D)); let x = x0;
    D.m.forEach((col, c) => {
      const tc = col.reduce((s, v) => s + v, 0), wc = w * tc / T; let y = y0;
      col.forEach((v, r) => {
        const hr = h * v / tc, sel = ev && dans(ev.cases, c, r), cond = ev && ev.cond && dans(ev.cond, c, r);
        svg.appendChild(el("rect", { x, y, width: Math.max(wc, 0.8), height: Math.max(hr, 0.8), fill: sel ? "var(--sel)" : cond ? "var(--cond-fond)" : D.teintes ? D.teintes[r] : (r % 2 ? "var(--fond2)" : "var(--fond1)"), stroke: "var(--carte)", "stroke-width": 1.5 }));
        if (hr > 22 && wc > 46) texte(x + wc / 2, y + hr / 2 + 6, D.effectifs ? String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ") : eti ? eti(v / T) : fr(v / T, 4), { "font-size": 15, fill: sel ? "var(--carte)" : "var(--encre)", stroke: sel ? "var(--sel)" : "var(--carte)" });
        y += hr;
      });
      texte(x + wc / 2, y0 - 10, D.cols[c], { "font-size": wc > 30 ? 17 : 14, "font-style": "italic" });
      x += wc;
    });
    // lignes nommées à droite, à la hauteur des cases de la dernière colonne (voisine des étiquettes)
    let y = y0; const cN = D.m[D.m.length - 1], tN = cN.reduce((s, v) => s + v, 0);
    cN.forEach((v, r) => { const hr = h * v / tN; texte(x0 + w + 8, y + Math.max(hr / 2, 7) + 5, D.rows[r], { "text-anchor": "start", "font-size": hr > 14 ? 16 : 13, "font-style": "italic" }); y += hr; });
    // contour de la condition
    if (ev && ev.cond) {
      const cs = ev.cond, toutesLignes = D.m.every((col, c) => !cs.some(([cc]) => cc === c) || col.every((_, r) => dans(cs, c, r)));
      let xx = x0; D.m.forEach((col, c) => { const tc = col.reduce((s, v) => s + v, 0), wc = w * tc / T; let yy = y0;
        col.forEach((v, r) => { const hr = h * v / tc; if (dans(cs, c, r)) svg.appendChild(el("rect", { x: xx + 1.5, y: yy + 1.5, width: Math.max(wc - 3, 1), height: Math.max(hr - 3, 1), fill: "none", stroke: "var(--cond)", "stroke-width": 3.5 })); yy += hr; }); xx += wc; });
    }
  }
  // tableau d'effectifs : cases de l'événement en bleu, condition entourée en orange
  function tableau(D, ev, x0, y0, w) {
    const nc = D.cols.length + 2, nr = D.rows.length + 2, cw = w / nc, ch = Math.min(52, 400 / nr);
    const sep = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    const totC = D.m.map(col => col.reduce((a, b) => a + b, 0)), totR = D.rows.map((_, r) => D.m.reduce((a, col) => a + col[r], 0)), T = totC.reduce((a, b) => a + b, 0);
    const caseT = (i, j, t, o = {}) => {
      const x = x0 + i * cw, y = y0 + j * ch;
      svg.appendChild(el("rect", { x, y, width: cw, height: ch, fill: o.fond || "var(--carte)", stroke: "var(--filet)" }));
      texte(x + cw / 2, y + ch / 2 + 6, t, { "font-size": o.taille || 15, "font-style": o.ital ? "italic" : "normal", fill: o.coul || "var(--encre)", stroke: o.fond || "var(--carte)" });
    };
    caseT(0, 0, "", { fond: "var(--fond2)" });
    D.cols.forEach((c, i) => caseT(i + 1, 0, c, { fond: "var(--fond2)", ital: true }));
    caseT(nc - 1, 0, "Total", { fond: "var(--fond2)", taille: 13 });
    D.rows.forEach((r, j) => {
      caseT(0, j + 1, r, { fond: "var(--fond2)", ital: true, taille: r.length > 9 ? 12 : 14 });
      D.m.forEach((col, i) => { const sel = ev && dans(ev.cases, i, j); caseT(i + 1, j + 1, sep(col[j]), sel ? { fond: "var(--sel)", coul: "var(--carte)" } : {}); });
      caseT(nc - 1, j + 1, sep(totR[j]), { coul: "var(--discret)" });
    });
    caseT(0, nr - 1, "Total", { fond: "var(--fond2)", taille: 13 });
    totC.forEach((t, i) => caseT(i + 1, nr - 1, sep(t), { coul: "var(--discret)" }));
    caseT(nc - 1, nr - 1, sep(T), { coul: "var(--discret)" });
    if (ev && ev.cond) ev.cond.forEach(([i, j]) => svg.appendChild(el("rect", { x: x0 + (i + 1) * cw + 2, y: y0 + (j + 1) * ch + 2, width: cw - 4, height: ch - 4, fill: "none", stroke: "var(--cond)", "stroke-width": 3.5 })));
  }
  // arbre pondéré de profondeur quelconque, de gauche à droite, sans flèches
  function arbre(niveaux, proba, feuilles, x0, y0, w, h, eti) {
    const d = niveaux.length, N = 2 ** d, dx = w / (d + 0.35);
    const yF = i => y0 + h * (i + 0.5) / N;
    function noeud(chemin) { const k = chemin.length; if (k === d) return { y: yF(parseInt(chemin.map(b => b ? 1 : 0).join(""), 2) || 0) }; }
    const pos = (ch) => { const k = ch.length; const deb = parseInt((ch.map(b => b ? 1 : 0).join("") || "0"), 2) * 2 ** (d - k); return { x: x0 + k * dx, y: k === 0 ? y0 + h / 2 : (yF(deb) + yF(deb + 2 ** (d - k) - 1)) / 2 }; };
    function rec(ch) {
      if (ch.length === d) return;
      const P = pos(ch);
      [0, 1].forEach(b => {
        const ch2 = ch.concat([b]), Q = pos(ch2), p = proba(ch, b);
        const actif = feuilles && feuilles.some(f => f.slice(0, ch2.length).every((v, i) => v === ch2[i]));
        svg.appendChild(el("line", { x1: P.x + 6, y1: P.y, x2: Q.x - 22, y2: Q.y, stroke: actif ? "var(--sel)" : "var(--discret)", "stroke-width": actif ? 3 : 1.3 }));
        const mx = (P.x + Q.x) / 2 - 8, my = (P.y + Q.y) / 2 + (b ? 22 : -10);

        E("P<sub>T⁺</sub>(M)", D => [[0, 0]], D => ligne(D, 0), { calcul: () => "200/500", note: "Parmi les tests positifs, seuls 40 % concernent des malades." }), E("P<sub>T⁻</sub>(S)", D => [[1, 1]], D => ligne(D, 1), { calcul: () => "3 450/3 500" })])] },
    e3: { titre: "Exercice 3 · La patineuse", chapeau: "Premier saut réussi (R₁) ou non, puis second saut réussi (R₂) ou non.",
      vues: [vueDeux({ cols: ["R₁", "R̄₁"], rows: ["R₂", "R̄₂"], m: [[0.95 * 0.9, 0.95 * 0.1], [0.05 * 0.7, 0.05 * 0.3]] }, [
        E("P(R₁ ∩ R₂)", D => [[0, 0]], null, { calcul: () => "0,95 × 0,9" }), E("P(R̄₁ ∩ R̄₂)", D => [[1, 1]], null, { calcul: () => "0,05 × 0,3" }),
        E("P(R₂)", D => ligne(D, 0), null, { calcul: () => "0,855 + 0,035" }), E("P<sub>R₂</sub>(R₁)", D => [[0, 0]], D => ligne(D, 0), { calcul: () => "0,855/0,89" })])] },
    e4: { titre: "Exercice 4 · Stephen Curry", chapeau: "Tir à 2 points (D) ou à 3 points (D̄), réussi (M) ou non.",
      vues: [vueDeux({ cols: ["D", "D̄"], rows: ["M", "M̄"], m: [[0.2 * 0.9, 0.2 * 0.1], [0.8 * 0.8, 0.8 * 0.2]] }, [
        E("P(D ∩ M)", D => [[0, 0]], null, { calcul: () => "0,2 × 0,9" }), E("P(D̄ ∩ M)", D => [[1, 0]], null, { calcul: () => "0,8 × 0,8" }),
        E("P(M)", D => ligne(D, 0), null, { calcul: () => "0,18 + 0,64" }), E("P<sub>M</sub>(D)", D => [[0, 0]], D => ligne(D, 0), { calcul: () => "0,18/0,82" })])] },
    e5: { titre: "Exercice 5 · Les machines sous garantie", chapeau: "20 % des machines sont sous garantie (G), 8,2 % sont défectueuses (D), 0,2 % les deux à la fois.",
      vues: [vueDeux({ cols: ["G", "Ḡ"], rows: ["D", "D̄"], m: [[0.002, 0.198], [0.08, 0.72]] }, [
        E("P<sub>G</sub>(D)", D => [[0, 0]], D => colonne(D, 0), { calcul: () => "0,002/0,2" }), E("P(Ḡ ∩ D)", D => [[1, 0]], null, { calcul: () => "0,082 − 0,002" }),
        E("P<sub>D</sub>(G)", D => [[0, 0]], D => ligne(D, 0), { calcul: () => "0,002/0,082" })], { eti: p => fr(p, 3) })] },
    e6: { titre: "Exercice 6 · « 63 % des morts sont des vaccinés »", chapeau: "Il y a beaucoup plus de vaccinés que de non-vaccinés : il faut comparer les risques dans chaque groupe, P<sub>V</sub>(M) et P<sub>V̄</sub>(M).",

      vues: [vueDeux({ cols: ["F", "H"], rows: ["sport", "C : culture", "aucune"], m: [[272, 58, 1120], [378, 42, 630]], effectifs: true, teintes: ["var(--fond1)", "var(--fond3)", "var(--fond2)"] }, [
        E("P<sub>F</sub>(C)", D => [[0, 1]], D => colonne(D, 0), { calcul: () => "58/1 450", note: "Même proportion que P(C) = 100/2 500 = 0,04 : F et C sont indépendants." }),
        E("P<sub>H</sub>(C)", D => [[1, 1]], D => colonne(D, 1), { calcul: () => "42/1 050" }), E("P(C)", D => ligne(D, 1), null, { calcul: () => "100/2 500" }),
        E("P<sub>F</sub>(A)", D => [[0, 0]], D => colonne(D, 0), { calcul: () => "272/1 450", note: "A : « activité sportive ». P(A) = 650/2 500 = 0,26 ≠ 0,1876 : F et A ne sont pas indépendants." })])] },

  // ----- vues particulières -----
  function rendreCovid() {
    const pop = 51283237, morts = 1391, pV = 0.91, mV = 0.63 * morts, mN = 0.37 * morts, rV = mV / (pV * pop), rN = mN / ((1 - pV) * pop);
    const barre = (y, titre, parts) => { texte(60, y - 10, titre, { "text-anchor": "start", "font-family": "var(--ui)", "font-size": 14, fill: "var(--discret)" }); let x = 60; parts.forEach(p => { svg.appendChild(el("rect", { x, y, width: 780 * p.v, height: 34, fill: p.c })); if (p.t) texte(x + 780 * p.v / 2, y + 23, p.t, { "font-size": 15, fill: "var(--carte)", stroke: p.c }); x += 780 * p.v; }); };
    barre(60, "Population de plus de 20 ans", [{ v: .91, c: "var(--sel)", t: "vaccinés : 91 %" }, { v: .09, c: "var(--cond)", t: "9 %" }]);
    barre(150, "Décès du Covid-19 (8 novembre – 5 décembre 2021)", [{ v: .63, c: "var(--sel)", t: "vaccinés : 63 %" }, { v: .37, c: "var(--cond)", t: "non vaccinés : 37 %" }]);
    texte(60, 255, "Décès pour 100 000 personnes de chaque groupe", { "text-anchor": "start", "font-family": "var(--ui)", "font-size": 14, fill: "var(--discret)" });
    const k = 52;   // pixels pour 1 décès sur 100 000
    [[rV, "vaccinés", "var(--sel)"], [rN, "non vaccinés", "var(--cond)"]].forEach(([r, n, c], i) => { const y = 275 + i * 70; svg.appendChild(el("rect", { x: 200, y, width: r * 1e5 * k, height: 44, fill: c, rx: 3 })); texte(190, y + 28, n, { "text-anchor": "end", "font-family": "var(--ui)", "font-size": 15 }); texte(210 + r * 1e5 * k, y + 28, fr(r * 1e5, 2), { "text-anchor": "start" }); });
    $("commandes").textContent = "";
    $("constat").innerHTML = `P<sub>V</sub>(M) ≈ <b class="b">${fr(rV * 1e5, 2)} × 10⁻⁵</b> et P<sub>V̄</sub>(M) ≈ <b class="o">${fr(rN * 1e5, 2)} × 10⁻⁵</b><span class="petit">Le risque de mourir du Covid-19 était environ ${Math.round(rN / rV)} fois plus élevé chez les non-vaccinés : l'affirmation confond P<sub>M</sub>(V) et P<sub>V</sub>(M).</span>`;
  }
  function rendreArbre3(v) {
    const ev = v.evs[v.ev]; const feuilles = [];
    for (let i = 0; i < 8; i++) { const ch = [i >> 2 & 1, i >> 1 & 1, i & 1]; if (ev.f(ch)) feuilles.push(ch); }
    arbre([["P", "F"], ["P", "F"], ["P", "F"]], (ch, b) => b ? 0.75 : 0.25, feuilles, 30, 20, 640, 450, p => p === 0.25 ? "1/4" : "3/4");

  }

      svg.appendChild(el("rect", { x, y: 110, width: 150, height: 170, rx: 14, fill: elim ? "var(--fond2)" : ff ? "var(--sel)" : "var(--fond1)", opacity: elim ? 0.35 : 1, stroke: "var(--filet)" }));
      f.forEach((e, j) => texte(x + 45 + j * 60, 210, e, { "font-size": 44, fill: ff && !elim ? "var(--carte)" : "var(--encre)", stroke: "none" }));
      texte(x + 75, 315, "aîné, cadet", { "font-size": 14, fill: "var(--discret)", "font-family": "var(--ui)" });
      if (elim) svg.appendChild(el("line", { x1: x + 10, y1: 120, x2: x + 140, y2: 270, stroke: "var(--cond)", "stroke-width": 4 }));
    });
    $("constat").innerHTML = cond ? `Sachant qu'il y a au moins une fille, il reste 3 familles équiprobables, dont une seule a deux filles : <b class="b">1/3</b><span class="petit">Alice a raison. Bob aurait raison si l'on savait que l'aînée (une enfant précise) est une fille.</span>` : `Sans information : 4 familles équiprobables, P(deux filles) = 1/4.`;
  }
  const monty = { n: 0, gReste: 0, gChange: 0, partie: null };
  function rendreMonty() {
    const P = monty.partie;
    for (let i = 0; i < 3; i++) {
      const x = 120 + i * 230, ouverte = P && (P.ouverte === i || P.fin), voiture = P && P.voiture === i;
      svg.appendChild(el("rect", { x, y: 60, width: 180, height: 240, rx: 10, fill: ouverte ? "var(--fond1)" : "var(--porte)", stroke: P && P.choix === i ? "var(--cond)" : "var(--filet)", "stroke-width": P && P.choix === i ? 5 : 1.5, style: "cursor:pointer" })).addEventListener("click", () => jouerMonty(i));
      texte(x + 90, 330, `Porte ${i + 1}`, { "font-family": "var(--ui)", "font-size": 15, fill: "var(--discret)" });
      if (ouverte) texte(x + 90, 195, voiture ? "🚗" : "🐐", { "font-size": 64, stroke: "none" });
    }
    const pr = (g, n) => n ? fr(g / n, 3) : "—";
    $("constat").innerHTML = (P ? (P.fin ? (P.gagne ? "Gagné !" : "Perdu.") + " Recommencez en choisissant une porte." : `L'animateur ouvre la porte ${P.ouverte + 1}. Cliquez sur une porte fermée : la vôtre (garder) ou l'autre (changer).`) : "Choisissez une porte.")
      + `<span class="petit">Sur ${monty.n} parties simulées : fréquence de gain en gardant ≈ ${pr(monty.gReste, monty.n)}, en changeant ≈ ${pr(monty.gChange, monty.n)}. Théorie : 1/3 contre 2/3.</span>`;
  }
  function jouerMonty(i) {
    let P = monty.partie;
    if (!P || P.fin) { const voiture = Math.floor(Math.random() * 3), autres = [0, 1, 2].filter(k => k !== i && k !== voiture); monty.partie = { voiture, choix: i, ouverte: autres[Math.floor(Math.random() * autres.length)] }; }
    else if (i !== P.ouverte) { P.fin = true; P.gagne = i === P.voiture; P.choix = i; }
    rendreMonty();
  }
  function simulerMonty(k) { for (let j = 0; j < k; j++) { const v = Math.floor(Math.random() * 3), c = Math.floor(Math.random() * 3); monty.n++; if (c === v) monty.gReste++; else monty.gChange++; } rendreMonty(); }

  function rendu(v) {
    svg.textContent = ""; svg.setAttribute("viewBox", "0 0 900 480");
    if (v.type === "deux") rendreDeux(v); else if (v.type === "covid") rendreCovid(); else if (v.type === "arbre3") rendreArbre3(v); else if (v.type === "enfants") rendreEnfants(v); else if (v.type === "monty") rendreMonty();
  }
  function dessiner(v) {
    const c = $("commandes"); c.textContent = "";
    const evs = v.type === "enfants" ? [{ nom: "Sans information" }, { nom: "Au moins une fille" }] : v.evs || [];
    if (evs.length) boutons(c, evs.map(e => e.nom), v.ev, i => { v.ev = i; [...c.querySelectorAll("button")].forEach((x, j) => x.setAttribute("aria-pressed", j === i)); rendu(v); });
    if (v.curseur) curseur(c, v.curseur[0], v.curseur[1], v.curseur[2], v.curseur[3], v.p, val => { v.p = val; rendu(v); }, fracTxt);
    if (v.type === "monty") [["Simuler 100 parties", 100], ["Simuler 1 000 parties", 1000]].forEach(([n, k]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.onclick = () => simulerMonty(k); c.appendChild(b); });
    rendu(v);
  }
  lancer(SCENES, "e3", dessiner);

})();

<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }

body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  etat(location.hash === "#plein");
})();
</script>
