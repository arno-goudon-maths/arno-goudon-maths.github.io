<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>TD3 en vidéo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Première spécialité, chapitre 3, TD3 : corrigés en vidéo (voix de M. Goudon).
   Une vidéo par exercice ; l'ancre #eN (QR code à côté de l'exercice) ouvre directement la bonne. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5;
  --bleu: #1a56db; --bleu-fond: #dbe6fb; --orange: #f07800;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844;
    --bleu: #6fa3f0; --bleu-fond: #1f3050; --orange: #ffa040; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844;
    --bleu: #6fa3f0; --bleu-fond: #1f3050; --orange: #ffa040; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); padding-right: 150px; }
h1 { font-size: 26px; margin: 0; line-height: 1.2; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.choix { display: flex; flex-wrap: wrap; gap: 6px; }
.choix button { border: 1px solid var(--filet); background: var(--carte); color: var(--encre); border-radius: 999px; padding: 6px 14px; font: 500 14px var(--ui); cursor: pointer; }
.choix button[aria-pressed="true"] { background: var(--bleu); border-color: var(--bleu); color: #fff; }
.cadre { background: #fff; border: 1px solid var(--filet); border-radius: 12px; overflow: hidden; }
video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #fff; }
.sous { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--discret); }
.sous b { color: var(--encre); font-weight: 600; }
.vitesse { display: inline-flex; gap: 6px; align-items: center; }
.vitesse select { font: 14px var(--ui); color: var(--encre); background: var(--carte); border: 1px solid var(--filet); border-radius: 8px; padding: 3px 6px; }
body.plein-ecran .page { max-width: none; padding-top: 48px; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran .chapeau { display: none; }
body.plein-ecran video { max-height: calc(100vh - 150px); }
</style>

<main class="page">
  <div class="niveau">Première spécialité · chapitre 3 · suites numériques</div>
  <h1>TD3 · corrigés en vidéo</h1>
  <p class="chapeau">M. Goudon déroule le corrigé à voix haute et rappelle les propriétés du cours. Quand il vous le propose, mettez la vidéo sur pause et cherchez avant de regarder la suite.</p>
  <div class="choix" role="group" aria-label="Exercice" id="choix"></div>
  <div class="cadre"><video id="video" controls playsinline preload="metadata"></video></div>
  <div class="sous">
    <span id="legende"></span>
    <label class="vitesse">Vitesse
      <select id="vitesse" aria-label="Vitesse de lecture">
        <option value="0.75">0,75 ×</option><option value="1" selected>1 ×</option><option value="1.25">1,25 ×</option><option value="1.5">1,5 ×</option>
      </select>
    </label>
  </div>
</main>

<script>
(() => {
  const EXOS = [
    { n: 2, fichier: "videos/td3-exo02.mp4", titre: "Exercice 2 ♠", sujet: "suite définie de façon explicite : termes, représentation graphique, fonction f" },
    { n: 8, fichier: "videos/td3-exo08.mp4", titre: "Exercice 8 ♠", sujet: "suites définies par récurrence : expliciter la relation, calculer u₁ et u₂" },
    { n: 19, fichier: "videos/td3-exo19.mp4", titre: "Exercice 19 ♠", sujet: "sens de variation par l'étude de la différence uₙ₊₁ − uₙ" },
  ];
  const v = document.getElementById("video"), choix = document.getElementById("choix"), leg = document.getElementById("legende"), vit = document.getElementById("vitesse");
  const boutons = EXOS.map(e => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Exercice " + e.n;
    b.onclick = () => { history.replaceState(null, "", "#e" + e.n); montre(e); };
    choix.appendChild(b); return b;
  });
  function montre(e) {
    boutons.forEach((b, i) => b.setAttribute("aria-pressed", String(EXOS[i] === e)));
    if (!v.src.endsWith(e.fichier)) { v.src = e.fichier; v.playbackRate = +vit.value; }
    leg.innerHTML = "<b>" + e.titre + "</b> — " + e.sujet;
  }
  vit.onchange = () => { v.playbackRate = +vit.value; };
  v.addEventListener("loadedmetadata", () => { v.playbackRate = +vit.value; });
  function depuisAncre() {
    const m = /^#e(\d+)$/.exec(location.hash || "");
    montre(EXOS.find(e => m && e.n === +m[1]) || EXOS[0]);
  }
  window.addEventListener("hashchange", depuisAncre);
  depuisAncre();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  etat(location.hash === "#plein");
})();
</script>

</body></html>
