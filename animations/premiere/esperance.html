<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Espérance d'un jeu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Le jeu du cours (dé tétraédrique). En haut, la loi de X posée sur une règle : elle s'équilibre
   exactement en E[X]. En bas, on joue : la moyenne des gains se rapproche de E[X]. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e7eaef;
  --barre: #1f5fbf; --barre-fond: rgba(31, 95, 191, 0.22); --esp: #d35400; --positif: #2e7d32; --negatif: #c62828; --moyenne: #6b4fa0;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --barre: #6fa3f0; --barre-fond: rgba(111, 163, 240, 0.25); --esp: #f0a35e; --positif: #6fcf7a; --negatif: #f07a7a; --moyenne: #c49be6; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --barre: #6fa3f0; --barre-fond: rgba(111, 163, 240, 0.25); --esp: #f0a35e; --positif: #6fcf7a; --negatif: #f07a7a; --moyenne: #c49be6; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; }
.chapeau { margin: 0; color: var(--discret); max-width: 72ch; }
.m { font-family: var(--math); font-style: italic; }
.gains { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 18px; }
.gains label { display: block; font-size: 14px; color: var(--discret); }
.gains b { font-family: var(--math); font-size: 18px; color: var(--encre); }
.gains input { display: block; width: 100%; accent-color: var(--barre); }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 8px; }
svg { display: block; width: 100%; height: auto; }
.esp { font-family: var(--math); font-size: 19px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--etat); background: var(--carte); margin: 0; overflow-wrap: anywhere; }
.esp strong { font-family: var(--ui); color: var(--etat); }
.jouer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.jouer button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
.jouer button.fort { background: var(--moyenne); border-color: var(--moyenne); color: #fff; }
.jouer span { color: var(--discret); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--esp); outline-offset: 2px; }
</style>

<div class="page">
  <span class="niveau">Première spécialité · Chapitre 11 · Variables aléatoires</span>
  <h1>Espérance d'un jeu</h1>
  <p class="chapeau">On lance un dé tétraédrique équilibré. Réglez les gains : la loi de <span class="m">X</span> posée sur la règle s'équilibre en <span class="m">E</span>[<span class="m">X</span>]. Puis jouez : la moyenne des gains se rapproche de <span class="m">E</span>[<span class="m">X</span>].</p>
  <div class="gains">
    <label>gain si l'on obtient 1 : <b id="v1"></b><input id="g1" type="range" min="-6" max="6" step="1" value="-2"></label>
    <label>gain si l'on obtient 2 ou 3 : <b id="v2"></b><input id="g2" type="range" min="-6" max="6" step="1" value="0"></label>
    <label>gain si l'on obtient 4 : <b id="v3"></b><input id="g3" type="range" min="-6" max="6" step="1" value="3"></label>
  </div>
  <div class="figure"><svg id="loi" viewBox="0 0 900 300" role="img" aria-label="Loi de X sur une règle en équilibre"></svg></div>
  <p class="esp" id="esp"></p>
  <div class="jouer">
    <button type="button" class="fort" data-n="1">Jouer 1 partie</button>
    <button type="button" data-n="10">10 parties</button>
    <button type="button" data-n="100">100 parties</button>
    <button type="button" data-n="1000">1 000 parties</button>
    <button type="button" id="raz">Recommencer</button>
    <span id="bilan"></span>
  </div>
  <div class="figure"><svg id="sim" viewBox="0 0 900 260" role="img" aria-label="Moyenne des gains au fil des parties"></svg></div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = (x, d = 2) => { const r = Math.round(x * 10 ** d) / 10 ** d; return (Object.is(r, -0) ? 0 : r).toLocaleString("fr-FR", { maximumFractionDigits: d }).replace("-", "−"); };
  const p = v => v < 0 ? "(" + fr(v) + ")" : fr(v);
  let moy = [], somme = 0;
  function loi() {
    // valeurs regroupées (deux issues peuvent donner le même gain)
    const g = [+$("g1").value, +$("g2").value, +$("g3").value], pr = [1 / 4, 1 / 2, 1 / 4], m = new Map();
    g.forEach((v, i) => m.set(v, (m.get(v) || 0) + pr[i]));
    return { g, pr, val: [...m.entries()].sort((a, b) => a[0] - b[0]) };
  }
  const frac = q => ({ 0.25: "1/4", 0.5: "1/2", 0.75: "3/4", 1: "1" })[q] || fr(q);
  function maj() {
    const L = loi(), E = L.val.reduce((s, [v, q]) => s + v * q, 0);
    $("v1").textContent = fr(L.g[0]) + " €"; $("v2").textContent = fr(L.g[1]) + " €"; $("v3").textContent = fr(L.g[2]) + " €";
    // règle et barres
    const s = $("loi"); s.textContent = "";
    const X0 = 70, X1 = 830, sx = v => X0 + (v + 6) / 12 * (X1 - X0), base = 210, H = 150;
    for (let v = -6; v <= 6; v++) { s.appendChild(el("line", { x1: sx(v), x2: sx(v), y1: base, y2: base + 8, stroke: "var(--encre)" })); s.appendChild(el("text", { x: sx(v), y: base + 58, "text-anchor": "middle", "font-size": 15, "font-family": "var(--ui)", fill: "var(--discret)" }, String(v).replace("-", "−"))); }
    s.appendChild(el("rect", { x: X0 - 10, y: base - 5, width: X1 - X0 + 20, height: 7, rx: 3, fill: "var(--encre)" }));
    L.val.forEach(([v, q]) => {
      const h = q * H * 1.6;
      s.appendChild(el("rect", { x: sx(v) - 22, y: base - 5 - h, width: 44, height: h, fill: "var(--barre-fond)", stroke: "var(--barre)", "stroke-width": 2 }));
      s.appendChild(el("text", { x: sx(v), y: base - 12 - h, "text-anchor": "middle", "font-size": 18, "font-family": "var(--math)", fill: "var(--barre)" }, frac(q)));
    });
    // pivot en E[X]
    const xe = sx(E);
    s.appendChild(el("path", { d: `M${xe},${base + 2} l-18,34 h36 z`, fill: "var(--esp)" }));
    s.appendChild(el("line", { x1: xe, x2: xe, y1: 20, y2: base - 5, stroke: "var(--esp)", "stroke-dasharray": "5 5", "stroke-width": 1.5 }));
    s.appendChild(el("text", { x: xe, y: 16, "text-anchor": "middle", "font-size": 18, "font-family": "var(--math)", "font-style": "italic", fill: "var(--esp)" }, `E[X] = ${fr(E)}`));
    s.appendChild(el("text", { x: X1 + 20, y: base - 16, "text-anchor": "end", "font-size": 14, "font-family": "var(--ui)", fill: "var(--discret)" }, "gain (€)"));
    // calcul
    const etat = Math.abs(E) < 1e-9 ? "esp" : E > 0 ? "positif" : "negatif";
    $("esp").style.setProperty("--etat", `var(--${etat})`);
    const terms = L.val.map(([v, q]) => `${frac(q)} × ${p(v)}`).join(" + ");
    $("esp").innerHTML = `<span class="m">E</span>[<span class="m">X</span>] = ${terms} = ${fr(E)} &nbsp; <strong>${etat === "esp" ? "le jeu est équitable" : etat === "positif" ? "le jeu est favorable au joueur" : "le jeu est défavorable au joueur"}</strong>`;
    dessineSim(E);
    return E;
  }
  function dessineSim(E) {
    const s = $("sim"); s.textContent = "";
    const L = loi(), n = moy.length, N = Math.max(10, n), X0 = 60, X1 = 880, Y0 = 20, Y1 = 230, lo = Math.min(...L.g, 0) - 0.5, hi = Math.max(...L.g, 0) + 0.5;
    const sx = i => X0 + (i / N) * (X1 - X0), sy = v => Y1 - (v - lo) / (hi - lo) * (Y1 - Y0);
    for (let v = Math.ceil(lo); v <= hi; v += 1) { s.appendChild(el("line", { x1: X0, x2: X1, y1: sy(v), y2: sy(v), stroke: "var(--grille)" })); s.appendChild(el("text", { x: X0 - 8, y: sy(v) + 5, "text-anchor": "end", "font-size": 13, "font-family": "var(--ui)", fill: "var(--discret)" }, String(v).replace("-", "−"))); }
    s.appendChild(el("line", { x1: X0, x2: X1, y1: sy(E), y2: sy(E), stroke: "var(--esp)", "stroke-width": 2.5, "stroke-dasharray": "8 6" }));
    s.appendChild(el("text", { x: X1, y: sy(E) - 8, "text-anchor": "end", "font-size": 16, "font-family": "var(--math)", "font-style": "italic", fill: "var(--esp)" }, "E[X]"));
    if (n) {
      const pas = Math.max(1, Math.floor(n / 600)); let d = "";
      for (let i = 0; i < n; i += pas) d += (i ? "L" : "M") + sx(i + 1).toFixed(1) + "," + sy(moy[i]).toFixed(1);
      d += "L" + sx(n).toFixed(1) + "," + sy(moy[n - 1]).toFixed(1);
      s.appendChild(el("path", { d, fill: "none", stroke: "var(--moyenne)", "stroke-width": 2.5 }));
      s.appendChild(el("circle", { cx: sx(n), cy: sy(moy[n - 1]), r: 6, fill: "var(--moyenne)" }));
    }
    s.appendChild(el("text", { x: X1, y: 252, "text-anchor": "end", "font-size": 13, "font-family": "var(--ui)", fill: "var(--discret)" }, `nombre de parties (${n.toLocaleString("fr-FR")})`));
    s.appendChild(el("text", { x: X0, y: 14, "font-size": 13, "font-family": "var(--ui)", fill: "var(--moyenne)" }, "moyenne des gains"));
    $("bilan").textContent = n ? `${n.toLocaleString("fr-FR")} parties : moyenne ≈ ${fr(moy[n - 1])} €` : "";
  }
  function jouer(k) {
    const L = loi();
    for (let i = 0; i < k; i++) { const r = Math.random(), gain = r < 0.25 ? L.g[0] : r < 0.75 ? L.g[1] : L.g[2]; somme += gain; moy.push(somme / (moy.length + 1)); }
    maj();
  }
  const raz = () => { moy = []; somme = 0; };
  ["g1", "g2", "g3"].forEach(id => $(id).addEventListener("input", () => { raz(); maj(); }));
  document.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => jouer(+b.dataset.n)));
  $("raz").addEventListener("click", () => { raz(); maj(); });
  maj();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
