<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Dérivation en images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Première spécialité, chapitre 6, TD6 : sécantes qui tendent vers la tangente, tangentes mobiles. Couleurs de la page « nombre dérivé » : sécante bleue, tangente orange. Ancre #eN pour les QR codes des exercices. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e7eaef;
  --courbe: #1b1f24; --plus: #1f5fbf; --moins: #7b4fa0; --zero: #d35400; --sol: #d35400; --vert: #0b8a3a; --secante: #1f5fbf; --tangente: #d35400; --attention: #9a5b00;
  --sel: #1f5fbf; --cond: #f07800; --cond-fond: #fde7cf; --fond1: #e4eaf3; --fond2: #f1f3f6; --fond3: #d9e6d2; --porte: #8a5a2b;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34;
    --courbe: #e8ebf0; --plus: #6fa3f0; --moins: #c49be6; --zero: #f0a35e; --sol: #f0a35e; --vert: #5fd38a; --secante: #6fa3f0; --tangente: #f0a35e; --attention: #e0a64a;
    --sel: #6fa3f0; --cond: #ffa040; --cond-fond: #3d2c1a; --fond1: #26303d; --fond2: #22262d; --fond3: #2a3a2a; --porte: #a87444; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34;
    --courbe: #e8ebf0; --plus: #6fa3f0; --moins: #c49be6; --zero: #f0a35e; --sol: #f0a35e; --vert: #5fd38a; --secante: #6fa3f0; --tangente: #f0a35e; --attention: #e0a64a;
    --sel: #6fa3f0; --cond: #ffa040; --cond-fond: #3d2c1a; --fond1: #26303d; --fond2: #22262d; --fond3: #2a3a2a; --porte: #a87444; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 12px; }
.tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-right: 140px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
select { font: 500 13px var(--ui); padding: 3px 8px; border-radius: 8px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); max-width: 100%; }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(24px, 3.6vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 70ch; }
.onglets, .commandes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.onglets button, .commandes button { font: 500 13px var(--ui); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
.onglets button[aria-pressed="true"], .commandes button[aria-pressed="true"] { background: var(--encre); color: var(--carte); border-color: var(--encre); }
.commandes label { font: 500 13px var(--ui); color: var(--discret); display: flex; align-items: center; gap: 8px; }
.commandes input[type=range] { width: min(320px, 60vw); accent-color: var(--plus); }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; overflow: hidden; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-family: var(--math); font-size: clamp(17px, 2.3vw, 21px); margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); text-align: center; }
.constat .petit { display: block; font-family: var(--ui); font-size: 14px; color: var(--discret); margin-top: 2px; }
.b { color: var(--plus); } .o { color: var(--zero); } .m { color: var(--moins); }
</style>

<div class="page">
  <div class="tete">
    <span class="niveau">Première spécialité · Chapitre 6 · TD6</span>
    <select id="choix" aria-label="Exercice"></select>
  </div>
  <h1 id="titre"></h1>
  <p class="chapeau" id="chapeau"></p>
  <div class="onglets" id="onglets"></div>
  <div class="figure"><svg id="g" viewBox="0 0 900 500" role="img" aria-label="Figure de l'exercice"></svg></div>
  <div class="commandes" id="commandes"></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const svg = $("g"); let W = 900, H = 500;
  const fr = (x, d = 2) => { const r = Number((+x).toFixed(d)); return (r < 0 ? "−" : "") + String(Math.abs(r)).replace(".", ","); };
  const frac = x => { for (const q of [1, 2, 3, 4, 5, 6, 8, 9, 12]) { const p = Math.round(x * q); if (Math.abs(p / q - x) < 1e-9) return q === 1 ? fr(p, 0) : (p < 0 ? "−" : "") + Math.abs(p) + "/" + q; } return fr(x, 2); };
  const texte = (x, y, t, o = {}) => svg.appendChild(el("text", Object.assign({ x, y, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 17, fill: "var(--encre)", "paint-order": "stroke", stroke: "var(--carte)", "stroke-width": 4 }, o), t));
  const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  const sup = d => String(d).split("").map(c => SUP[c] || c).join("");

  // repère : fenêtre [xmin, xmax, ymin, ymax], pas des graduations
  function repere(fen, pas = [1, 1], cadre = [55, 20, 20, 30]) {
    const [a, b, c, d] = fen, [gx, dx, hy, by] = cadre;
    const X = x => gx + (W - gx - dx) * (x - a) / (b - a), Y = y => H - by - (H - hy - by) * (y - c) / (d - c);
    const id = "clip" + Math.random().toString(36).slice(2, 7);
    const cp = el("clipPath", { id }); cp.appendChild(el("rect", { x: gx, y: hy, width: W - gx - dx, height: H - hy - by })); svg.appendChild(cp);
    const g = el("g", { "clip-path": `url(#${id})` }); svg.appendChild(g);
    const ax = Math.min(Math.max(Y(0), hy), H - by), ay = Math.min(Math.max(X(0), gx), W - dx);
    for (let x = Math.ceil(a / pas[0]) * pas[0]; x <= b + 1e-9; x += pas[0]) {
      g.appendChild(el("line", { x1: X(x), y1: hy, x2: X(x), y2: H - by, stroke: "var(--grille)" }));
      if (Math.abs(x) > 1e-9) texte(X(x), Math.min(ax + 18, H - by + 18), fr(x, 2), { "font-size": 13, fill: "var(--discret)" });
    }
    for (let y = Math.ceil(c / pas[1]) * pas[1]; y <= d + 1e-9; y += pas[1]) {
      g.appendChild(el("line", { x1: gx, y1: Y(y), x2: W - dx, y2: Y(y), stroke: "var(--grille)" }));
      if (Math.abs(y) > 1e-9) texte(Math.max(ay - 7, gx - 7), Y(y) + 5, fr(y, 2), { "font-size": 13, fill: "var(--discret)", "text-anchor": "end" });
    }
    g.appendChild(el("line", { x1: gx, y1: ax, x2: W - dx, y2: ax, stroke: "var(--encre)", "stroke-width": 1.2 }));
    g.appendChild(el("line", { x1: ay, y1: hy, x2: ay, y2: H - by, stroke: "var(--encre)", "stroke-width": 1.2 }));
    if (a < 0 && b > 0 && c < 0 && d > 0) texte(X(0) - 9, Y(0) + 17, "O", { "font-size": 14, fill: "var(--discret)", "font-style": "italic" });
    const R = { X, Y, g, fen, gx, dx, hy, by };
    // une courbe, éventuellement colorée selon le signe de la fonction
    R.courbe = (f, o = {}) => {
      const N = 600, [u, v] = o.dom || [a, b]; let d0 = "", coul = null;
      const vider = () => { if (d0) g.appendChild(el("path", { d: d0, fill: "none", stroke: coul, "stroke-width": o.ep || 3.2, "stroke-dasharray": o.tirets || "", "stroke-linejoin": "round", "stroke-linecap": "round" })); d0 = ""; };
      for (let i = 0; i <= N; i++) {
        const x = u + (v - u) * i / N, y = f(x);
        if (!isFinite(y) || Math.abs(y) > 1e6 || Math.abs(Y(y)) > 4000) { vider(); continue; }
        const cc = o.signe ? (y > 1e-9 ? "var(--plus)" : y < -1e-9 ? "var(--moins)" : coul || "var(--plus)") : (o.c || "var(--courbe)");
        if (cc !== coul && d0) { d0 += `L${X(x)},${Y(y)}`; vider(); }
        coul = cc; d0 += (d0 ? "L" : "M") + `${X(x)},${Y(y)}`;
      }
      vider();
      if (o.nom) { const xe = o.xNom ?? (u + (v - u) * 0.88), [n0, n1] = o.nom.split("_"); const t = texte(X(xe) + (o.dxNom || 8), Y(f(xe)) + (o.dyNom ?? -10), n0, { "text-anchor": "start", fill: o.c || "var(--courbe)", "font-style": "italic" }); if (n1) t.appendChild(el("tspan", { "baseline-shift": "sub", "font-size": 12 }, n1)); }
    };
    R.droite = (m, p, o = {}) => { R.courbe(x => m * x + p, Object.assign({ ep: 2.2 }, o)); };
    R.point = (x, y, nom, o = {}) => {
      g.appendChild(el("circle", { cx: X(x), cy: Y(y), r: o.r || 5.5, fill: o.c || "var(--encre)" }));
      if (nom) texte(X(x) + (o.dx ?? 10), Y(y) + (o.dy ?? -10), nom, { "text-anchor": o.ancre || "start", fill: o.c || "var(--encre)", "font-size": 16 });
    };
    R.seg = (x1, y1, x2, y2, o = {}) => g.appendChild(el("line", { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), stroke: o.c || "var(--encre)", "stroke-width": o.ep || 2, "stroke-dasharray": o.tirets || "" }));
    // ensemble de solutions sur l'axe des abscisses (intervalles)
    R.solution = (test, o = {}) => {
      const N = 900; let deb = null;
      const tr = (x1, x2) => g.appendChild(el("line", { x1: X(x1), y1: ax, x2: X(x2), y2: ax, stroke: o.c || "var(--sol)", "stroke-width": 7, "stroke-linecap": "butt", opacity: 0.85 }));
      for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, ok = test(x); if (ok && deb === null) deb = x; if ((!ok || i === N) && deb !== null) { tr(deb, ok ? x : x - (b - a) / N); deb = null; } }
    };
    return R;
  }
  const racines = (A, B, C) => { if (Math.abs(A) < 1e-12) return Math.abs(B) < 1e-12 ? [] : [-C / B]; const D = B * B - 4 * A * C; if (D < -1e-12) return []; if (Math.abs(D) < 1e-12) return [-B / (2 * A)]; return [(-B - Math.sqrt(D)) / (2 * A), (-B + Math.sqrt(D)) / (2 * A)].sort((p, q) => p - q); };
  // curseur générique
  function curseur(c, nom, min, max, pas, val, maj, fmt = frac) {
    const l = document.createElement("label"), b = document.createElement("b");
    b.style.cssText = "font-family:var(--math);font-size:17px;color:var(--encre);min-width:2.8em"; b.textContent = fmt(val);
    l.append(nom + " = ", b);
    const r = document.createElement("input"); r.type = "range"; r.min = min; r.max = max; r.step = pas; r.value = val;
    r.oninput = () => { let v = Math.round(+r.value / pas) * pas; if (Math.abs(v - Math.round(v)) < 1e-9) v = Math.round(v); v = Number(v.toFixed(6)); b.textContent = fmt(v); maj(v); };
    l.appendChild(r); c.appendChild(l);
  }
  function boutons(c, liste, actif, choisir) {
    liste.forEach((n, i) => { const b = document.createElement("button"); b.type = "button"; b.innerHTML = n; b.setAttribute("aria-pressed", i === actif); b.onclick = () => choisir(i); c.appendChild(b); });
  }
  // aiguillage par l'ancre #eN
  function lancer(SCENES, defaut, dessiner) {
    const etat = { scene: defaut, vue: 0 };
    function choisir(cle) {
      etat.scene = SCENES[cle] ? cle : defaut; etat.vue = 0;
      const S = SCENES[etat.scene];
      $("titre").innerHTML = S.titre; $("chapeau").innerHTML = S.chapeau; $("choix").value = etat.scene;
      const o = $("onglets"); o.textContent = "";
      if (S.vues.length > 1) boutons(o, S.vues.map(v => v.nom), 0, i => { etat.vue = i; [...o.children].forEach((x, j) => x.setAttribute("aria-pressed", j === i)); ouvrir(); });
      o.hidden = S.vues.length < 2;
      ouvrir();
    }
    function ouvrir() { const v = SCENES[etat.scene].vues[etat.vue]; v.p = v.curseur ? v.curseur[4] : v.p; v.ev = 0; dessiner(v, SCENES[etat.scene]); }
    for (const k in SCENES) { const op = document.createElement("option"); op.value = k; op.textContent = SCENES[k].titre.replace(/<[^>]+>/g, ""); $("choix").appendChild(op); }
    $("choix").onchange = () => { choisir($("choix").value); try { history.replaceState(null, "", "#" + $("choix").value); } catch (e) {} };
    const ancre = () => (location.hash.match(/e\d+/) || [defaut])[0];
    window.addEventListener("hashchange", () => choisir(ancre()));
    choisir(ancre());
  }

  // ---------- 1re spé, TD6 : dérivation ----------
  // sécante entre a et a + h (ou entre a et x), tangente, en couleurs de la page « nombre dérivé »
  const tracerDroite = (R, x0, y0, m, o = {}) => R.courbe(x => y0 + m * (x - x0), Object.assign({ ep: 2.2 }, o));
  const vueSecante = (f, a, fen, pas, txtTaux, limite, nomf = "f") => ({ curseur: ["h", -2, 2, 0.1, 1], fen, pas,
    trace: (R, h) => { R.courbe(f, { c: "var(--courbe)", nom: "𝒞" + nomf }); if (Math.abs(h) > 1e-9) { const m = (f(a + h) - f(a)) / h; tracerDroite(R, a, f(a), m, { c: "var(--secante)" }); R.point(a + h, f(a + h), "M", { c: "var(--secante)" }); } tracerDroite(R, a, f(a), limite, { c: "var(--tangente)", tirets: "8 6", ep: 1.6 }); R.point(a, f(a), "A", { c: "var(--encre)" }); },
    constat: h => Math.abs(h) < 1e-9 ? `h ne peut pas être nul : le taux de variation n'est pas défini.<span class="petit">Quand h se rapproche de 0, il se rapproche de ${frac(limite)} = ${nomf}′(${frac(a)}) (tangente en pointillés orange).</span>`
      : `h = ${fr(h, 1)} : taux de variation = ${txtTaux(h)} = <b class="b">${fr((f(a + h) - f(a)) / h, 3)}</b><span class="petit">C'est la pente de la sécante (AM). Quand h se rapproche de 0, elle se rapproche de ${frac(limite)} = ${nomf}′(${frac(a)}).</span>` });
  const vueSecanteX = (f, a, fen, pas, xs, txtTaux, limite) => ({ curseur: ["x", xs[0], xs[1], 0.1, xs[2]], fen, pas,
    trace: (R, x) => { R.courbe(f, { c: "var(--courbe)", nom: "𝒞f" }); if (Math.abs(x - a) > 1e-9) { tracerDroite(R, a, f(a), (f(x) - f(a)) / (x - a), { c: "var(--secante)" }); R.point(x, f(x), "M", { c: "var(--secante)" }); } tracerDroite(R, a, f(a), limite, { c: "var(--tangente)", tirets: "8 6", ep: 1.6 }); R.point(a, f(a), "A"); },
    constat: x => Math.abs(x - a) < 1e-9 ? `x = ${frac(a)} est exclu.<span class="petit">Quand x se rapproche de ${frac(a)}, le quotient se rapproche de ${frac(limite)}.</span>` : `x = ${fr(x, 1)} : (f(x) − f(${frac(a)})) / (x − ${frac(a)}) = ${txtTaux(x)} ≈ <b class="b">${fr((f(x) - f(a)) / (x - a), 3)}</b><span class="petit">Quand x se rapproche de ${frac(a)}, il se rapproche de ${frac(limite)} : c'est le nombre dérivé en ${frac(a)}.</span>` });
  const d1 = f => x => (f(x + 1e-5) - f(x - 1e-5)) / 2e-5;
  const eqTangente = (m, p) => `y = ${frac(m)}x ${p < 0 ? "− " + frac(-p) : "+ " + frac(p)}`.replace(/^y = 1x/, "y = x").replace(/^y = −1x/, "y = −x").replace(/ \+ 0$/, "");

  const SCENES = {
    e1: { titre: "Exercice 1 · f(x) = 3x + 4", chapeau: "Pour une fonction affine, toutes les sécantes sont confondues avec la droite elle-même : le taux de variation vaut toujours 3.",
      vues: [{ ...vueSecante(x => 3 * x + 4, 1, [-2, 4, -2, 14], [1, 2], h => `(3(1 + h) + 4 − 7) / h = 3h / h`, 3) }] },
    e2: { titre: "Exercice 2 · f(x) = x² − 6, en a = 2", chapeau: "Faites tendre h vers 0 : la sécante (AM) pivote autour de A et se rapproche de la tangente.",
      vues: [{ ...vueSecante(x => x * x - 6, 2, [-2, 5, -7, 12], [1, 2], h => `4 + h`, 4) }] },
    e3: { titre: "Exercice 3 · f(x) = 4x² − 2x + 6, en a = 1", chapeau: "Le taux de variation entre 1 et 1 + h vaut 6 + 4h : il tend vers 6 quand h tend vers 0.",
      vues: [{ ...vueSecante(x => 4 * x * x - 2 * x + 6, 1, [-1.5, 3.5, -1, 30], [0.5, 5], h => `6 + 4h`, 6) }] },
    e4: { titre: "Exercice 4 · f(x) = 1/x, en 3", chapeau: "Le quotient (f(x) − f(3)) / (x − 3) vaut −1/(3x) : il se rapproche de −1/9 quand x se rapproche de 3.",
      vues: [{ ...vueSecanteX(x => 1 / x, 3, [0, 7, -0.3, 1.6], [1, 0.2], [0.4, 6.5, 5], x => `−1/(3x)`, -1 / 9) }] },
    e5: { titre: "Exercice 5 · f(x) = 2x² − x + 1, en 1", chapeau: "Le quotient (f(x) − f(1)) / (x − 1) vaut 2x + 1 : il se rapproche de 3 quand x se rapproche de 1.",
      vues: [{ ...vueSecanteX(x => 2 * x * x - x + 1, 1, [-1.5, 3, -1, 14], [0.5, 2], [-1.2, 2.8, 2.5], x => `2x + 1`, 3) }] },
    e10: { titre: "Exercice 10 · Tangentes à l'hyperbole", chapeau: "f(x) = 1/x, f′(x) = −1/x². La tangente au point d'abscisse 1 a pour équation y = −x + 2. Déplacez le point de contact.",
      vues: [{ curseur: ["a", -3, 3, 0.25, 1], fen: [-4, 4, -4, 4], trace: (R, a) => { const f = x => 1 / x; R.courbe(f, { c: "var(--courbe)", nom: "𝒞f", xNom: 2.8 }); tracerDroite(R, 1, 1, -1, { c: "var(--discret)", tirets: "6 6", ep: 1.4 }); if (a !== 0) { tracerDroite(R, a, 1 / a, -1 / (a * a), { c: "var(--tangente)" }); R.point(a, 1 / a, null, { c: "var(--tangente)" }); } },
        constat: a => a === 0 ? "f n'est pas définie en 0." : `a = ${frac(a)} : f′(${frac(a)}) = ${frac(-1 / (a * a))}, tangente : ${eqTangente(-1 / (a * a), 2 / a)}<span class="petit">En pointillés gris : T₁, d'équation y = −x + 2.</span>` }] },
    e11: { titre: "Exercice 11 · Les tangentes T<sub>A</sub> et T<sub>B</sub>", chapeau: "f(x) = x² + 2x − 1 : tangentes aux points d'abscisses 1 et −2, et deux points à tester.",
      vues: [{ fen: [-5, 3, -16, 10], pas: [1, 2], trace: R => { const f = x => x * x + 2 * x - 1; R.courbe(f, { c: "var(--courbe)", nom: "𝒞f", xNom: 2.2 }); tracerDroite(R, 1, 2, 4, { c: "var(--tangente)", nom: "T_A", xNom: -3.6 }); tracerDroite(R, -2, -1, -2, { c: "var(--secante)", nom: "T_B", xNom: 1.6, dyNom: 18 }); R.point(1, 2, "A"); R.point(-2, -1, "B", { ancre: "end", dx: -10 }); R.point(-3, -14, "(−3 ; −14)", { c: "var(--vert)" }); R.point(0, 8, "(0 ; 8)", { c: "var(--attention)" }); },
        constat: () => `T<sub>A</sub> : y = 4x − 2 ; T<sub>B</sub> : y = −2x − 5<span class="petit">(−3 ; −14) est sur T<sub>A</sub>, (0 ; 8) ne l'est pas ; les coefficients directeurs 4 et −2 sont différents : T<sub>A</sub> et T<sub>B</sub> ne sont pas parallèles.</span>` }] },
    e13: { titre: "Exercice 13 · Ce que l'observateur ne voit pas", chapeau: "La colline f(x) = −¼(x² − 2x − 3) et l'observateur E(−2 ; 11/4). Le rayon rasant est la tangente qui passe par E.",
      vues: [{ curseur: ["a", -1, 3, 0.25, 0.5], fen: [-2.5, 4.5, -0.5, 3.2], pas: [0.5, 0.5], trace: (R, a) => {
          const f = x => -0.25 * (x * x - 2 * x - 3); R.courbe(f, { c: "var(--courbe)", dom: [-1, 3] });
          const m = 0.5 * (1 - a), p = 0.25 * a * a + 0.75; R.courbe(x => m * x + p, { c: a === 2 ? "var(--tangente)" : "var(--secante)", ep: 2, dom: [-2.5, 4.5] });
          R.point(a, f(a), null, { c: "var(--secante)" }); R.point(-2, 2.75, "E", { ancre: "end", dx: -10 });
          if (a === 2) { R.seg(2, 0.75, 3, 0, { c: "var(--attention)", ep: 6 }); R.seg(3, 0, 3.5, 0, { c: "var(--attention)", ep: 6 }); }
          ["A", "B", "C"].forEach((n, i) => R.point([-1, 1, 3][i], [0, 1, 0][i], n, { r: 4, dy: -10 })); },
        constat: a => { const ok = a === 2; return `a = ${frac(a)} : T<sub>a</sub> : y = ½(1 − a)x + ¼a² + ¾` + (ok ? ` passe par E : <b class="o">c'est le rayon rasant</b>.` : " ne passe pas par E.") + `<span class="petit">E ∈ T<sub>a</sub> ⟺ a² + 4a − 12 = 0 ⟺ a = 2 (dans [−1 ; 3]). Le rayon touche la colline en (2 ; ¾) et le sol en x = 3,5 : la partie en ${ok ? "orange" : "orange (pour a = 2)"} n'est pas visible.</span>`; } }] },
    e17: { titre: "Exercice 17 · Même dérivée", chapeau: "f(x) = (3x − 1)/(x − 2) = 3 + 5/(x − 2) = g(x) + 3 : les courbes se déduisent l'une de l'autre par une translation verticale.",
      vues: [{ curseur: ["x", -3, 7, 0.25, 4], fen: [-3, 7, -6, 9], trace: (R, x) => { const f = t => (3 * t - 1) / (t - 2), g = t => 5 / (t - 2); R.courbe(f, { c: "var(--courbe)", nom: "𝒞f", xNom: 6 }); R.courbe(g, { c: "var(--secante)", nom: "𝒞g", xNom: 6, tirets: "9 6" }); if (x !== 2) { const m = -5 / ((x - 2) ** 2); tracerDroite(R, x, f(x), m, { c: "var(--tangente)" }); tracerDroite(R, x, g(x), m, { c: "var(--tangente)" }); R.point(x, f(x), null, { c: "var(--tangente)" }); R.point(x, g(x), null, { c: "var(--tangente)" }); } },
        constat: x => x === 2 ? "2 est exclu." : `x = ${frac(x)} : f′(x) = g′(x) = −5/(x − 2)² = ${fr(-5 / ((x - 2) ** 2), 3)}<span class="petit">Les deux tangentes sont parallèles : f − g est constante (égale à 3). Toute fonction g + k (k réel) a la même dérivée.</span>` }] },
    e18: { titre: "Exercice 18 · Léane et le radar", chapeau: "d(t) = 480t / (t + 12) (en mètres). Vitesse moyenne entre 0,5 s et 3 s, puis vitesse instantanée à t = 0,5 s.",
      vues: [{ nom: "Vitesse moyenne", fen: [0, 4.2, 0, 140], pas: [0.5, 20], trace: R => { const d = t => 480 * t / (t + 12); R.courbe(d, { c: "var(--courbe)", dom: [0, 4], nom: "d" }); tracerDroite(R, 0.5, d(0.5), (d(3) - d(0.5)) / 2.5, { c: "var(--secante)" }); R.point(0.5, d(0.5), null); R.point(3, d(3), null); },
          constat: () => { const d = t => 480 * t / (t + 12), v = (d(3) - d(0.5)) / 2.5; return `(d(3) − d(0,5)) / 2,5 ≈ <b class="b">${fr(v, 2)} m/s</b> ≈ ${fr(v * 3.6, 1)} km/h<span class="petit">La vitesse moyenne est la pente de la sécante.</span>`; } },
        { nom: "Vitesse à t = 0,5", curseur: ["t", 0, 4, 0.1, 0.5], fen: [0, 4.2, 0, 140], pas: [0.5, 20], trace: (R, t) => { const d = x => 480 * x / (x + 12); R.courbe(d, { c: "var(--courbe)", dom: [0, 4], nom: "d" }); tracerDroite(R, t, d(t), 5760 / ((t + 12) ** 2), { c: "var(--tangente)" }); R.point(t, d(t), null, { c: "var(--tangente)" }); },
          constat: t => { const v = 5760 / ((t + 12) ** 2); return `d′(${fr(t, 1)}) = 5760 / (t + 12)² ≈ <b class="${v * 3.6 > 130 ? "o" : "b"}">${fr(v, 2)} m/s ≈ ${fr(v * 3.6, 1)} km/h</b>` + `<span class="petit">${v * 3.6 > 130 ? "Plus de 130 km/h : à cet instant, le radar flashe." : "Moins de 130 km/h : pas d'excès de vitesse à cet instant."}</span>`; } }] },
    e19: { titre: "Exercice 19 · Une tangente passant par (−2 ; −1) ?", chapeau: "f(x) = 2x / (1 − x). Déplacez le point de contact : aucune tangente ne passe par le point P(−2 ; −1).",
      vues: [{ curseur: ["a", -5, 5, 0.25, -1], fen: [-6, 6, -8, 6], trace: (R, a) => { const f = x => 2 * x / (1 - x); R.courbe(f, { c: "var(--courbe)", nom: "𝒞f", xNom: 4.5 }); R.point(-2, -1, "P(−2 ; −1)", { c: "var(--vert)", ancre: "end", dx: -8, dy: 22 }); if (a !== 1) { const m = 2 / ((1 - a) ** 2); tracerDroite(R, a, f(a), m, { c: "var(--tangente)" }); R.point(a, f(a), null, { c: "var(--tangente)" }); } },
        constat: a => { if (a === 1) return "1 est exclu."; const m = 2 / ((1 - a) ** 2), yP = 2 * a / (1 - a) + m * (-2 - a); return `a = ${frac(a)} : au point d'abscisse −2, la tangente passe par l'ordonnée ${fr(yP, 3)} ≠ −1<span class="petit">P ∈ T<sub>a</sub> ⟺ a² + 2a + 3 = 0, équation sans solution (Δ = −8) : aucune tangente ne passe par P.</span>`; } }] },
    e21: { titre: "Exercice 21 · La fonction inverse est dérivable", chapeau: "En a ≠ 0, le taux d'accroissement de 1/x vaut −1/(a(a + h)) et tend vers −1/a².",
      vues: [{ ...vueSecante(x => 1 / x, 1, [-0.5, 4, -0.5, 3], [0.5, 0.5], h => `−1/(1 × (1 + h))`, -1), curseur: ["h", -0.9, 2, 0.1, 1] }] },
    e22: { titre: "Exercice 22 · La racine carrée n'est pas dérivable en 0", chapeau: "Le taux d'accroissement entre 0 et h vaut 1/√h : quand h tend vers 0, il devient aussi grand qu'on veut, la sécante se redresse.",
      vues: [{ curseur: ["h", 0.01, 4, 0.01, 1], fen: [-0.5, 4.5, -0.5, 2.5], pas: [0.5, 0.5], trace: (R, h) => { R.courbe(Math.sqrt, { c: "var(--courbe)", dom: [0, 4.5], nom: "𝒞f" }); tracerDroite(R, 0, 0, 1 / Math.sqrt(h), { c: "var(--secante)" }); R.point(h, Math.sqrt(h), "M", { c: "var(--secante)" }); R.point(0, 0, null); },
        constat: h => `h = ${fr(h, 2)} : (√h − √0) / h = 1/√h ≈ <b class="b">${fr(1 / Math.sqrt(h), 2)}</b><span class="petit">Ce taux n'a pas de limite finie : la fonction racine carrée n'est pas dérivable en 0 (tangente verticale).</span>` }] },
  };
  const fmtP = x => fr(x, 2);
  function rendu(v) {
    svg.textContent = ""; svg.setAttribute("viewBox", `0 0 900 ${H}`);
    const R = repere(v.fen, v.pas || [1, 1]); v.trace(R, v.p);
    $("constat").innerHTML = v.constat(v.p);
  }
  function dessiner(v) {
    const c = $("commandes"); c.textContent = "";
    if (v.curseur) curseur(c, v.curseur[0], v.curseur[1], v.curseur[2], v.curseur[3], v.p, val => { v.p = val; rendu(v); }, fmtP);
    rendu(v);
  }
  lancer(SCENES, "e2", dessiner);

})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 66vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  etat(location.hash === "#plein");
})();
</script>
