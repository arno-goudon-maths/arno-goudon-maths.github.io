<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>La température du lac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* TD2 de 1re spécifique, exercice 19 : en hiver, 1 °C à la surface du lac, 4 °C au fond (15 m).
   Modèle affine f(x) = 0,2x + 1, x profondeur en mètres. On descend une sonde, le thermomètre suit. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5;
  --ciel: #e9f1fa; --glace: #f4fbff; --glace-bord: #a9c7de; --eau-haut: #9fd0ef; --eau-bas: #1d5f9e; --rive: #b9a27c; --rive-fonce: #8d7653;
  --mercure: #e0202a; --sonde: #f07800; --lecture: #e0202a;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --ciel: #1a2230; --glace: #d6e6f2; --glace-bord: #7d9bb3; --eau-haut: #3f86b8; --eau-bas: #0d2f52; --rive: #6e5f47; --rive-fonce: #4f4332; --mercure: #ff5a5f; --sonde: #ff9a3c; --lecture: #ff5a5f; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --ciel: #1a2230; --glace: #d6e6f2; --glace-bord: #7d9bb3; --eau-haut: #3f86b8; --eau-bas: #0d2f52; --rive: #6e5f47; --rive-fonce: #4f4332; --mercure: #ff5a5f; --sonde: #ff9a3c; --lecture: #ff5a5f; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 70ch; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.prise { cursor: grab; } .prise:active { cursor: grabbing; }
.constat { font-size: clamp(16px, 2.2vw, 21px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); }
.constat i { font-family: var(--math); font-size: 1.1em; }
.constat b { color: var(--mercure); }
</style>

<div class="page">
  <span class="niveau">Première spécifique · Chapitre 2 · TD2, exercice 19</span>
  <h1>La température du lac</h1>
  <p class="chapeau">En hiver, l'eau est à 1 °C juste sous la glace et à 4 °C au fond du lac, à 15 m. Faites descendre ou remonter la sonde orange : le thermomètre indique la température de l'eau à cette profondeur.</p>
  <div class="figure"><svg id="lac" viewBox="0 0 900 560" role="img" aria-label="Coupe d'un lac gelé avec une sonde de température"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, at, txt) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; return e; };
  const nb = v => String(Math.round(v * 100) / 100).replace(".", ",");
  const f = x => 0.2 * x + 1;
  const SURF = 100, K = 27, yP = x => SURF + x * K, PMAX = 15;      // profondeur -> pixels
  const XS = 370;                                                    // abscisse de la sonde (trou dans la glace)
  const svg = $("lac");
  let p = 3.5;

  // ---- décor ----
  const defs = el("defs", {});
  const lg = el("linearGradient", { id: "eau", x1: 0, y1: 0, x2: 0, y2: 1 });
  lg.appendChild(el("stop", { offset: "0", "stop-color": "var(--eau-haut)" })); lg.appendChild(el("stop", { offset: "1", "stop-color": "var(--eau-bas)" }));
  defs.appendChild(lg);
  const tg = el("linearGradient", { id: "tube", x1: 0, y1: 0, x2: 1, y2: 0 });
  tg.appendChild(el("stop", { offset: "0", "stop-color": "var(--carte)" })); tg.appendChild(el("stop", { offset: "1", "stop-color": "var(--filet)" }));
  defs.appendChild(tg);
  const clip = el("clipPath", { id: "cuvette" });
  const forme = `M70,${SURF} C120,${SURF + 200} 210,${yP(15)} 300,${yP(15)} L440,${yP(15)} C540,${yP(15)} 600,${SURF + 160} 650,${SURF} Z`;
  clip.appendChild(el("path", { d: forme })); defs.appendChild(clip);
  svg.appendChild(defs);
  svg.appendChild(el("rect", { x: 0, y: 0, width: 900, height: SURF, fill: "var(--ciel)" }));
  svg.appendChild(el("rect", { x: 0, y: SURF, width: 690, height: 460, fill: "var(--rive)" }));
  svg.appendChild(el("path", { d: forme, fill: "url(#eau)", stroke: "var(--rive-fonce)", "stroke-width": 3 }));
  // glace, avec un trou pour la sonde
  svg.appendChild(el("rect", { x: 60, y: SURF - 12, width: XS - 18 - 60, height: 14, rx: 3, fill: "var(--glace)", stroke: "var(--glace-bord)", "stroke-width": 1.5 }));
  svg.appendChild(el("rect", { x: XS + 18, y: SURF - 12, width: 660 - XS - 18, height: 14, rx: 3, fill: "var(--glace)", stroke: "var(--glace-bord)", "stroke-width": 1.5 }));
  svg.appendChild(el("text", { x: 120, y: SURF - 22, "font-size": 13, fill: "var(--discret)" }, "glace"));
  // deux poissons, pour l'ambiance
  const poisson = (x, y, s, sens) => {
    const g = el("g", { transform: `translate(${x},${y}) scale(${s * sens},${s})`, opacity: .55 });
    g.appendChild(el("ellipse", { cx: 0, cy: 0, rx: 14, ry: 6, fill: "var(--glace)" }));
    g.appendChild(el("path", { d: "M-12,0 L-22,-7 L-22,7 Z", fill: "var(--glace)" }));
    svg.appendChild(g);
  };
  poisson(200, yP(6), 1, 1); poisson(520, yP(11), 0.9, -1);
  // échelle des profondeurs
  svg.appendChild(el("line", { x1: 40, y1: SURF, x2: 40, y2: yP(PMAX), stroke: "var(--encre)", "stroke-width": 1.6 }));
  for (let x = 0; x <= PMAX; x++) {
    svg.appendChild(el("line", { x1: 34, y1: yP(x), x2: 46, y2: yP(x), stroke: "var(--encre)", "stroke-width": x % 5 ? 1 : 1.6 }));
    svg.appendChild(el("text", { x: 28, y: yP(x) + 4, "text-anchor": "end", "font-size": 12, fill: "var(--discret)" }, x));
  }
  svg.appendChild(el("text", { x: 12, y: yP(PMAX) + 30, "font-size": 12, fill: "var(--discret)" }, "profondeur (m)"));
  // données de l'énoncé
  svg.appendChild(el("text", { x: 470, y: SURF + 22, "font-size": 14, "font-weight": 600, fill: "var(--encre)" }, "1 °C sous la glace"));
  svg.appendChild(el("text", { x: XS + 30, y: yP(15) - 10, "font-size": 14, "font-weight": 600, fill: "var(--glace)" }, "4 °C au fond, à 15 m"));

  // ---- thermomètre ----
  const TX = 790, TH = 140, TB = 470, tY = v => TB - v * (TB - TH) / 5;  // 0 à 5 °C
  svg.appendChild(el("rect", { x: 700, y: 60, width: 180, height: 480, rx: 12, fill: "var(--carte)", stroke: "var(--filet)" }));
  svg.appendChild(el("rect", { x: TX - 13, y: TH - 20, width: 26, height: TB - TH + 30, rx: 13, fill: "url(#tube)", stroke: "var(--discret)", "stroke-width": 1.5 }));
  svg.appendChild(el("circle", { cx: TX, cy: TB + 26, r: 22, fill: "var(--mercure)", stroke: "var(--discret)", "stroke-width": 1.5 }));
  for (let v = 0; v <= 5; v += 0.5) {
    const e = Number.isInteger(v);
    svg.appendChild(el("line", { x1: TX + 14, y1: tY(v), x2: TX + (e ? 30 : 22), y2: tY(v), stroke: "var(--encre)", "stroke-width": e ? 1.6 : 1 }));
    if (e) svg.appendChild(el("text", { x: TX + 36, y: tY(v) + 5, "font-size": 14, fill: "var(--encre)" }, v + " °C"));
  }
  const dyn = el("g", {}); svg.appendChild(dyn);

  function dessin() {
    dyn.textContent = "";
    const T = f(p), y = yP(p);
    // mercure
    dyn.appendChild(el("rect", { x: TX - 7, y: tY(T), width: 14, height: TB + 10 - tY(T), fill: "var(--mercure)" }));
    dyn.appendChild(el("text", { x: TX, y: 100, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 26, "font-weight": 600, fill: "var(--mercure)" }, nb(T) + " °C"));
    // corde et sonde
    dyn.appendChild(el("line", { x1: XS, y1: SURF - 40, x2: XS, y2: y, stroke: "var(--encre)", "stroke-width": 2 }));
    dyn.appendChild(el("rect", { x: XS - 30, y: SURF - 48, width: 60, height: 10, rx: 4, fill: "var(--rive-fonce)" }));
    // lecture de la profondeur sur l'échelle
    dyn.appendChild(el("line", { x1: 46, y1: y, x2: XS - 16, y2: y, stroke: "var(--lecture)", "stroke-width": 1.6, "stroke-dasharray": "4 4" }));
    dyn.appendChild(el("circle", { cx: 40, cy: y, r: 5, fill: "var(--lecture)" }));
    const g = el("g", { class: "prise" });
    g.appendChild(el("rect", { x: XS - 40, y: y - 34, width: 80, height: 68, fill: "transparent" }));
    g.appendChild(el("rect", { x: XS - 9, y: y - 20, width: 18, height: 34, rx: 9, fill: "var(--sonde)", stroke: "var(--carte)", "stroke-width": 2.5 }));
    g.appendChild(el("circle", { cx: XS, cy: y + 14, r: 5, fill: "var(--mercure)" }));
    dyn.appendChild(g); prise(g);
    dyn.appendChild(el("text", { x: XS - 22, y: y - 26, "text-anchor": "end", "font-size": 14, "font-weight": 600, fill: "var(--carte)", stroke: "var(--eau-bas)", "stroke-width": 3, "paint-order": "stroke" }, `x = ${nb(p)} m`));
    $("constat").innerHTML = p === 0
      ? `Juste sous la glace (<i>x</i> = 0), l'eau est à <b>1 °C</b>.`
      : `À <i>x</i> = ${nb(p)} m de profondeur, l'eau est à <b>${nb(T)} °C</b>.`;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return (evt.clientY - r.top) * 560 / r.height; }
  function prise(g) {
    g.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { const v = (point(ev) - SURF) / K; const n = Math.max(0, Math.min(PMAX, Math.round(v * 2) / 2)); if (n !== p) { p = n; dessin(); } };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  // un clic dans l'eau, au niveau de la sonde, la déplace aussi
  svg.addEventListener("pointerdown", e => {
    if (e.target.closest(".prise")) return;
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * 900 / r.width, y = (e.clientY - r.top) * 560 / r.height;
    if (x > 70 && x < 650 && y >= SURF) { p = Math.max(0, Math.min(PMAX, Math.round((y - SURF) / K * 2) / 2)); dessin(); }
  });
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
