<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Signe d'une fonction affine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Cours de 1re spécifique, chapitre 2 : f(x) = ax + b, a coefficient directeur, b ordonnée à l'origine.
   Positif en bleu, négatif en orange ; le tableau de signes se construit sous la droite. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --pos: #1a56db; --neg: #f07800; --zero: #7c3aed;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --pos: #6fa3f0; --neg: #ff9a3c; --zero: #b48cff; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --pos: #6fa3f0; --neg: #ff9a3c; --zero: #b48cff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.poignee { cursor: grab; } .poignee:active { cursor: grabbing; }
.constat { font-size: clamp(16px, 2.2vw, 20px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); }
.constat i { font-family: var(--math); font-size: 1.1em; }
.pos { color: var(--pos); font-weight: 600; } .neg { color: var(--neg); font-weight: 600; }
</style>

<div class="page">
  <span class="niveau">Première spécifique · Chapitre 2 · Fonctions affines</span>
  <h1>Signe d'une fonction affine</h1>
  <p class="chapeau">Faites glisser les deux points de la droite : le point de l'axe des ordonnées règle <i>b</i>, l'autre règle le coefficient directeur <i>a</i>. Le tableau de signes se construit en dessous.</p>
  <div class="figure"><svg id="g" viewBox="0 0 900 620" role="img" aria-label="Droite représentant une fonction affine et son tableau de signes"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const XMIN = -8, XMAX = 8, YMIN = -4, YMAX = 4, U = 52, OX = 450, OY = 230;
  const px = x => OX + x * U, py = y => OY - y * U;
  const svg = $("g");
  let a = 2, b = -3;
  const pgcd = (m, n) => n ? pgcd(n, m % n) : Math.abs(m);
  const s = n => (n < 0 ? "−" : "") + Math.abs(n);
  function frac(num, den) {           // num/den simplifié, en texte
    if (den < 0) { num = -num; den = -den; }
    const g = pgcd(num, den) || 1; num /= g; den /= g;
    return den === 1 ? s(num) : (num < 0 ? "−" : "") + Math.abs(num) + "/" + den;
  }
  const expr = () => {
    const ta = a === 1 ? "x" : a === -1 ? "−x" : s(a) + "x";
    return "f(x) = " + ta + (b > 0 ? " + " + b : b < 0 ? " − " + (-b) : "");
  };

  function dessin() {
    svg.textContent = "";
    for (let x = XMIN; x <= XMAX; x++) svg.appendChild(el("line", { x1: px(x), y1: py(YMIN), x2: px(x), y2: py(YMAX), stroke: "var(--grille)" }));
    for (let y = YMIN; y <= YMAX; y++) svg.appendChild(el("line", { x1: px(XMIN), y1: py(y), x2: px(XMAX), y2: py(y), stroke: "var(--grille)" }));
    svg.appendChild(el("line", { x1: px(XMIN), y1: OY, x2: px(XMAX), y2: OY, stroke: "var(--encre)", "stroke-width": 1.6 }));
    svg.appendChild(el("line", { x1: OX, y1: py(YMIN), x2: OX, y2: py(YMAX), stroke: "var(--encre)", "stroke-width": 1.6 }));
    for (let x = XMIN; x <= XMAX; x += 2) if (x) svg.appendChild(el("text", { x: px(x), y: OY + 18, "text-anchor": "middle", "font-size": 12, fill: "var(--discret)" }, s(x)));
    for (let y = YMIN; y <= YMAX; y += 2) if (y) svg.appendChild(el("text", { x: OX - 8, y: py(y) + 4, "text-anchor": "end", "font-size": 12, fill: "var(--discret)" }, s(y)));
    const x0 = -b / a;
    // droite, coupée en x0 : partie positive en bleu, négative en orange
    const clipX = y => (y - b) / a;
    let xa = Math.max(XMIN, Math.min(clipX(YMIN), clipX(YMAX))), xb = Math.min(XMAX, Math.max(clipX(YMIN), clipX(YMAX)));
    const seg = (u, v, c) => { if (v > u) svg.appendChild(el("line", { x1: px(u), y1: py(a * u + b), x2: px(v), y2: py(a * v + b), stroke: c, "stroke-width": 5, "stroke-linecap": "round" })); };
    const xm = Math.max(xa, Math.min(xb, x0));
    if (a > 0) { seg(xa, xm, "var(--neg)"); seg(xm, xb, "var(--pos)"); } else { seg(xa, xm, "var(--pos)"); seg(xm, xb, "var(--neg)"); }
    // racine
    if (x0 >= XMIN && x0 <= XMAX) {
      svg.appendChild(el("circle", { cx: px(x0), cy: OY, r: 6, fill: "var(--zero)" }));
      svg.appendChild(el("text", { x: px(x0) + (a > 0 ? -12 : 12), y: OY - 12, "text-anchor": a > 0 ? "end" : "start", "font-family": "var(--math)", "font-size": 19, fill: "var(--zero)" }, frac(-b, a)));
    }
    // poignées : (0 ; b) et (1 ; a + b)
    const hb = el("circle", { cx: OX, cy: py(b), r: 11, fill: "var(--encre)", stroke: "var(--carte)", "stroke-width": 3, class: "poignee" });
    const ha = el("circle", { cx: px(1), cy: py(a + b), r: 11, fill: "var(--encre)", stroke: "var(--carte)", "stroke-width": 3, class: "poignee" });
    svg.appendChild(hb); svg.appendChild(ha);
    glisse(hb, p => { const nb = Math.max(YMIN, Math.min(YMAX, Math.round((OY - p.y) / U))); if (Math.abs(a + nb) <= YMAX) b = nb; });
    glisse(ha, p => { const y1 = Math.max(YMIN, Math.min(YMAX, Math.round((OY - p.y) / U))); const na = y1 - b; if (na !== 0) a = na; });
    svg.appendChild(el("text", { x: px(XMAX) - 6, y: py(YMAX) + 22, "text-anchor": "end", "font-family": "var(--math)", "font-style": "italic", "font-size": 22, fill: "var(--encre)" }, expr()));
    // tableau de signes
    const T = 470, H = 44, L0 = 150, L1 = 750;
    const ligne = (x1, y1, x2, y2, w) => svg.appendChild(el("line", { x1, y1, x2, y2, stroke: "var(--encre)", "stroke-width": w || 1.5 }));
    ligne(L0 - 90, T, L1, T); ligne(L0 - 90, T + H, L1, T + H); ligne(L0 - 90, T + 2 * H, L1, T + 2 * H);
    ligne(L0 - 90, T, L0 - 90, T + 2 * H); ligne(L0, T, L0, T + 2 * H); ligne(L1, T, L1, T + 2 * H);
    const txt = (x, y, t, c, it) => svg.appendChild(el("text", { x, y, "text-anchor": "middle", "font-family": "var(--math)", "font-style": it ? "italic" : "normal", "font-size": 21, fill: c || "var(--encre)" }, t));
    txt(L0 - 45, T + 29, "x", null, true); txt(L0 - 45, T + H + 29, "f(x)", null, true);
    const xm2 = (L0 + L1) / 2;
    txt(L0 + 26, T + 29, "−∞"); txt(L1 - 26, T + 29, "+∞"); txt(xm2, T + 29, frac(-b, a), "var(--zero)");
    svg.appendChild(el("line", { x1: xm2, y1: T + H, x2: xm2, y2: T + 2 * H, stroke: "var(--encre)", "stroke-width": 1.2, "stroke-dasharray": "3 3" }));
    txt(xm2, T + H + 29, "0", "var(--zero)");
    const gauche = a > 0 ? ["−", "var(--neg)"] : ["+", "var(--pos)"], droite = a > 0 ? ["+", "var(--pos)"] : ["−", "var(--neg)"];
    txt((L0 + xm2) / 2, T + H + 30, gauche[0], gauche[1]); txt((xm2 + L1) / 2, T + H + 30, droite[0], droite[1]);
    $("constat").innerHTML = `<i>f</i> s'annule en <i>x</i> = ${frac(-b, a)} et son coefficient directeur <i>a</i> = ${s(a)} est ${a > 0 ? "positif" : "négatif"} : <i>f</i> est d'abord ${a > 0 ? '<span class="neg">négative</span>' : '<span class="pos">positive</span>'}, s'annule, puis est ${a > 0 ? '<span class="pos">positive</span>' : '<span class="neg">négative</span>'}.`;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return { x: (evt.clientX - r.left) * 900 / r.width, y: (evt.clientY - r.top) * 620 / r.height }; }
  function glisse(node, maj) {
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { maj(point(ev)); dessin(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
