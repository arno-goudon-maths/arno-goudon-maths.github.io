<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Sens de variation d'une fonction affine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Cours de 1re spécifique, chapitre 2, « Sens de variation d'une fonction affine » : f(x) = ax + b.
   Un seul réglage, le coefficient directeur a. Croissante en bleu, décroissante en orange, constante en violet. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --crois: #1a56db; --decr: #f07800; --const: #7c3aed;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --crois: #6fa3f0; --decr: #ff9a3c; --const: #b48cff; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --crois: #6fa3f0; --decr: #ff9a3c; --const: #b48cff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.reglage { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.reglage label { font-family: var(--math); font-style: italic; font-size: 22px; }
.reglage input { flex: 1 1 260px; max-width: 520px; accent-color: var(--coul, var(--crois)); height: 28px; }
.reglage output { font-family: var(--math); font-size: 22px; min-width: 4.5ch; font-variant-numeric: tabular-nums; color: var(--coul, var(--crois)); font-weight: 600; }
.constat { font-size: clamp(16px, 2.2vw, 21px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--coul, var(--filet)); background: var(--carte); }
.constat i { font-family: var(--math); font-size: 1.1em; }
.constat b { color: var(--coul); }
</style>

<div class="page" id="page">
  <span class="niveau">Première spécifique · Chapitre 2 · Fonctions affines</span>
  <h1>Sens de variation d'une fonction affine</h1>
  <p class="chapeau">Faites varier le coefficient directeur <i>a</i> de la fonction <i>f</i> définie sur ℝ par <i>f</i>(<i>x</i>) = <i>ax</i> + 1, et regardez la droite.</p>
  <div class="figure"><svg id="g" viewBox="0 0 900 500" role="img" aria-label="Droite représentant la fonction affine f"></svg></div>
  <div class="reglage">
    <label for="curseurA">a =</label>
    <input type="range" id="curseurA" min="-40" max="40" step="1" value="15" aria-label="Coefficient directeur a">
    <output id="valA" for="curseurA"></output>
  </div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, at, txt) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; return e; };
  const XMIN = -8, XMAX = 8, YMIN = -5, YMAX = 5, U = 46, OX = 450, OY = 250, B = 1;
  const px = x => OX + x * U, py = y => OY - y * U;
  const svg = $("g"), curseur = $("curseurA");
  // nombre à la française : virgule décimale, vrai signe moins
  const nb = v => (v < 0 ? "−" : "") + String(Math.abs(Math.round(v * 10) / 10)).replace(".", ",");
  const expr = a => {
    if (a === 0) return "f(x) = 1";
    const ta = a === 1 ? "x" : a === -1 ? "−x" : nb(a) + "x";
    return "f(x) = " + ta + " + 1";
  };

  function dessin() {
    const a = Number(curseur.value) / 10;
    const coul = a > 0 ? "var(--crois)" : a < 0 ? "var(--decr)" : "var(--const)";
    $("page").style.setProperty("--coul", coul);
    svg.textContent = "";
    // grille et axes
    for (let x = XMIN; x <= XMAX; x++) svg.appendChild(el("line", { x1: px(x), y1: py(YMIN), x2: px(x), y2: py(YMAX), stroke: "var(--grille)" }));
    for (let y = YMIN; y <= YMAX; y++) svg.appendChild(el("line", { x1: px(XMIN), y1: py(y), x2: px(XMAX), y2: py(y), stroke: "var(--grille)" }));
    svg.appendChild(el("line", { x1: px(XMIN), y1: OY, x2: px(XMAX), y2: OY, stroke: "var(--encre)", "stroke-width": 1.6 }));
    svg.appendChild(el("line", { x1: OX, y1: py(YMIN), x2: OX, y2: py(YMAX), stroke: "var(--encre)", "stroke-width": 1.6 }));
    for (let x = XMIN + 1; x < XMAX; x++) if (x) svg.appendChild(el("text", { x: px(x), y: OY + 18, "text-anchor": "middle", "font-size": 12, fill: "var(--discret)" }, nb(x)));
    for (let y = YMIN + 1; y < YMAX; y++) if (y) svg.appendChild(el("text", { x: OX - 8, y: py(y) + 4, "text-anchor": "end", "font-size": 12, fill: "var(--discret)" }, nb(y)));
    svg.appendChild(el("text", { x: OX - 8, y: OY + 18, "text-anchor": "end", "font-size": 12, fill: "var(--discret)" }, "0"));
    // droite, limitée au repère
    let x1 = XMIN, x2 = XMAX;
    if (a !== 0) {
      const xa = (YMIN - B) / a, xb = (YMAX - B) / a;
      x1 = Math.max(XMIN, Math.min(xa, xb)); x2 = Math.min(XMAX, Math.max(xa, xb));
    }
    svg.appendChild(el("line", { x1: px(x1), y1: py(a * x1 + B), x2: px(x2), y2: py(a * x2 + B), stroke: coul, "stroke-width": 5, "stroke-linecap": "round" }));
    // flèche de parcours, de gauche à droite, le long de la droite (décalée au-dessus)
    const n = Math.hypot(1, a), dx = 1 / n, dy = a / n;           // direction unitaire (repère)
    const L = Math.min(2.6, (x2 - x1) * n * 0.45);                  // longueur de la flèche
    const xc = Math.max(x1, Math.min(x2, (x1 + x2) / 2));
    const ox = -dy * 0.55, oy = dx * 0.55;                          // décalage perpendiculaire
    const sx = xc - dx * L / 2 + ox, sy = a * xc + B - dy * L / 2 + oy;
    const ex = xc + dx * L / 2 + ox, ey = a * xc + B + dy * L / 2 + oy;
    svg.appendChild(el("line", { x1: px(sx), y1: py(sy), x2: px(ex), y2: py(ey), stroke: coul, "stroke-width": 3, "stroke-linecap": "round", opacity: .55, "marker-end": "url(#pointe)" }));
    const defs = el("defs", {}); const m = el("marker", { id: "pointe", viewBox: "0 0 10 10", refX: 6, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse" });
    m.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z", fill: coul })); defs.appendChild(m); svg.appendChild(defs);
    // point (0 ; 1) et expression
    svg.appendChild(el("circle", { cx: OX, cy: py(B), r: 6, fill: "var(--encre)" }));
    const etiq = el("text", { x: px(XMIN) + 14, y: py(YMAX) + 30, "font-family": "var(--math)", "font-style": "italic", "font-size": 24, fill: coul }, expr(a));
    svg.appendChild(el("rect", { x: px(XMIN) + 6, y: py(YMAX) + 8, width: 210, height: 32, rx: 6, fill: "var(--carte)", opacity: .92 }));
    svg.appendChild(etiq);
    // valeur et constat
    $("valA").textContent = nb(a);
    $("constat").innerHTML = a > 0
      ? `<i>a</i> = ${nb(a)} &gt; 0 : la droite monte, donc <i>f</i> est <b>strictement croissante</b> sur ℝ.`
      : a < 0
      ? `<i>a</i> = ${nb(a)} &lt; 0 : la droite descend, donc <i>f</i> est <b>strictement décroissante</b> sur ℝ.`
      : `<i>a</i> = 0 : la droite est horizontale, donc <i>f</i> est <b>constante</b> sur ℝ.`;
  }
  curseur.addEventListener("input", dessin);
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
