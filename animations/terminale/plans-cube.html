<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Plans dans un cube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Cours 4 de terminale, 1.3 « Positions relatives de deux plans » : le cube ABCDEFGH de l'exemple,
   P ∈ [HE], M ∈ [AB], N ∈ [GC]. Sur la figure du cours, un plan n'est qu'un triangle ou une face ;
   ici on le prolonge en un grand carré transparent qui déborde du cube. Premier plan en bleu, second
   en orange (comme 𝒫 et 𝒫′ dans les tableaux du cours), droite d'intersection en rouge.
   Ancres : sans ancre ou #npm-ghd (question 3), #ghd-hea, #cda-dae (sécants), #ghd-fea, #cda-ghe (parallèles). */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --arete: #3b424c;
  --bleu: #1a56db; --orange: #f07800; --rouge: #c8102e;
  --bleu-fond: rgba(26, 86, 219, 0.065); --orange-fond: rgba(240, 120, 0, 0.075);
  --bleu-fort: rgba(26, 86, 219, 0.30); --orange-fort: rgba(240, 120, 0, 0.32);
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --arete: #c9d0da;
    --bleu: #6b9bff; --orange: #ff9a3d; --rouge: #ff6b6b;
    --bleu-fond: rgba(107, 155, 255, 0.075); --orange-fond: rgba(255, 154, 61, 0.08);
    --bleu-fort: rgba(107, 155, 255, 0.30); --orange-fort: rgba(255, 154, 61, 0.30); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --arete: #c9d0da;
  --bleu: #6b9bff; --orange: #ff9a3d; --rouge: #ff6b6b;
  --bleu-fond: rgba(107, 155, 255, 0.075); --orange-fond: rgba(255, 154, 61, 0.08);
  --bleu-fort: rgba(107, 155, 255, 0.30); --orange-fort: rgba(255, 154, 61, 0.30); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 12px; }
header { display: grid; gap: 4px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 0; }
.chapeau { margin: 0; color: var(--discret); max-width: 75ch; }
.barre { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.groupe { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.groupe > span { font-size: 12px; color: var(--discret); }
button { font: inherit; font-size: 14px; color: var(--encre); background: var(--carte); border: 1px solid var(--filet); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--bleu); }
button[aria-pressed="true"] { background: var(--encre); color: var(--carte); border-color: var(--encre); }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
.segments { display: inline-flex; border: 1px solid var(--filet); border-radius: 8px; overflow: hidden; }
.segments button { border: 0; border-radius: 0; }
.segments button + button { border-left: 1px solid var(--filet); }
.scene { position: relative; background: var(--carte); border: 1px solid var(--filet); border-radius: 12px; overflow: hidden; }
canvas { display: block; width: 100%; height: min(64vh, 580px); min-height: 340px; touch-action: none; cursor: grab; }
canvas.prise { cursor: grabbing; }
.legende { position: absolute; left: 12px; top: 10px; display: grid; gap: 2px; font-family: var(--math); font-size: 20px; pointer-events: none; }
.legende > span { display: flex; align-items: center; gap: 8px; }
.legende i.pastille { width: 18px; height: 14px; border-radius: 3px; display: inline-block; border: 2px solid currentColor; }
.astuce { position: absolute; right: 12px; bottom: 8px; font-size: 12px; color: var(--discret); pointer-events: none; }
.constat { font-size: 18px; text-align: center; min-height: 1.6em; margin: 0; }
.m { font-family: var(--math); }
.bleu { color: var(--bleu); } .orange { color: var(--orange); } .rouge { color: var(--rouge); }
body.plein-ecran canvas { height: calc(100vh - 190px); }
</style>

<div class="page">
  <header>
    <span class="niveau">Terminale spécialité · Chapitre 4 · Géométrie dans l'espace</span>
    <h1>Plans dans un cube</h1>
    <p class="chapeau">Sur la figure, un plan ressemble à un triangle ou à une face. Mais un plan ne s'arrête pas : prolongez-le, puis faites tourner le cube.</p>
  </header>

  <div class="barre">
    <div class="groupe" role="group" aria-label="Couple de plans">
      <span>Question 3</span><button type="button" data-scene="npm-ghd">(<i>NPM</i>) et (<i>GHD</i>)</button>
      <span>Sécants</span><button type="button" data-scene="ghd-hea">(<i>GHD</i>) et (<i>HEA</i>)</button><button type="button" data-scene="cda-dae">(<i>CDA</i>) et (<i>DAE</i>)</button>
      <span>Parallèles</span><button type="button" data-scene="ghd-fea">(<i>GHD</i>) et (<i>FEA</i>)</button><button type="button" data-scene="cda-ghe">(<i>CDA</i>) et (<i>GHE</i>)</button>
    </div>
  </div>
  <div class="barre">
    <div class="segments" role="group" aria-label="Affichage des plans">
      <button type="button" id="mode-figure">Comme sur la figure</button><button type="button" id="mode-plans">Plans prolongés</button>
    </div>
    <button type="button" id="tranche">Vue par la tranche</button>
    <button type="button" id="vue">Vue de départ</button>
  </div>

  <div class="scene">
    <canvas id="toile" role="img" aria-label="Cube ABCDEFGH en trois dimensions et deux plans, que l'on fait tourner en faisant glisser"></canvas>
    <div class="legende" id="legende"></div>
    <span class="astuce">Faites glisser pour tourner</span>
  </div>

  <p class="constat" id="constat" role="status" aria-live="polite"></p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const toile = $("toile"), ctx = toile.getContext("2d");
  const MATH = "STIX Two Text, Cambria Math, Times New Roman, serif";
  const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------------------------------------------------------
  // Vecteurs
  // ---------------------------------------------------------------
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norme = a => Math.sqrt(dot(a, a));
  const unit = a => mul(a, 1 / (norme(a) || 1));
  const lerp = (P, Q, t) => add(P, mul(sub(Q, P), t));
  function baseDuPlan(n) {   // deux vecteurs unitaires orthogonaux du plan de normale n
    const aide = Math.abs(n[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
    const e1 = unit(cross(n, aide)), e2 = unit(cross(n, e1));
    return [e1, e2];
  }

  // ---------------------------------------------------------------
  // Le cube du cours (figure de 1.3, \pavepoints{3}{3}{3} puis \nommer{C}{D}{A}{B}{G}{H}{E}{F}) :
  // C devant en bas à gauche, D devant en bas à droite, B caché ; face avant CDHG.
  // Côté 4 ; x vers la droite, y en fuyante, z vers le haut.
  // ---------------------------------------------------------------
  const S = {
    C: [0, 0, 0], D: [4, 0, 0], A: [4, 4, 0], B: [0, 4, 0],
    G: [0, 0, 4], H: [4, 0, 4], E: [4, 4, 4], F: [0, 4, 4],
  };
  S.N = lerp(S.C, S.G, 0.6);    // ($(C)!0.6!(G)$)
  S.P = lerp(S.H, S.E, 0.45);   // ($(H)!0.45!(E)$)
  S.M = lerp(S.A, S.B, 0.3);    // ($(A)!0.3!(B)$)
  const CENTRE = [2, 2, 2];
  const ARETES = ["CD", "DA", "AB", "BC", "GH", "HE", "EF", "FG", "CG", "DH", "AE", "BF"];

  // un plan défini par trois points, et le polygone qui le représente sur la figure du cours
  function plan(nom, poly, coul, bordure = false) {
    const [P, Q, R] = [...nom].map(l => S[l]);
    const n = unit(cross(sub(Q, P), sub(R, P))), d = dot(n, P);
    const c = sub(CENTRE, mul(n, dot(n, CENTRE) - d));   // centre du grand carré : projeté du centre du cube
    const [e1, e2] = baseDuPlan(n);
    return { nom, n, d, c, e1, e2, poly: [...poly].map(l => S[l]), coul, bordure };
  }
  const SCENES = {
    "npm-ghd": { plans: () => [plan("NPM", "NPM", "bleu", true), plan("GHD", "CDHG", "orange")], ligne: null, points: "NPM" },
    "ghd-hea": { plans: () => [plan("GHD", "CDHG", "bleu"), plan("HEA", "DAEH", "orange")], ligne: "HD" },
    "cda-dae": { plans: () => [plan("CDA", "ABCD", "bleu"), plan("DAE", "DAEH", "orange")], ligne: "DA" },
    "ghd-fea": { plans: () => [plan("GHD", "CDHG", "bleu"), plan("FEA", "ABFE", "orange")] },
    "cda-ghe": { plans: () => [plan("CDA", "ABCD", "bleu"), plan("GHE", "EFGH", "orange")] },
  };
  const nomPlan = (p, cls) => `<span class="${cls || p.coul}">(<i>${p.nom}</i>)</span>`;

  // intersection de deux plans : null s'ils sont parallèles, sinon { P0, dir }
  function intersection(p1, p2) {
    const dir = cross(p1.n, p2.n);
    if (norme(dir) < 1e-9) return null;
    const c = dot(p1.n, p2.n), a = (p1.d - p2.d * c) / (1 - c * c), b = (p2.d - p1.d * c) / (1 - c * c);
    return { P0: add(mul(p1.n, a), mul(p2.n, b)), dir: unit(dir) };
  }

  // ---------------------------------------------------------------
  // Caméra : projection orthographique, azimut et élévation (comme espace.html)
  // ---------------------------------------------------------------
  const VUE = { az: -Math.PI / 2 + 0.45, el: 0.36 };
  const cam = { az: VUE.az, el: VUE.el, echelle: 40, cx: 0, cy: 0 };
  let AX;
  function axesCamera() {
    const { az, el } = cam;
    return {
      e: [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)],   // vers l'observateur
      r: [-Math.sin(az), Math.cos(az), 0],
      u: [-Math.sin(el) * Math.cos(az), -Math.sin(el) * Math.sin(az), Math.cos(el)],
    };
  }
  const proj = P => { const q = sub(P, CENTRE); return [cam.cx + cam.echelle * dot(q, AX.r), cam.cy - cam.echelle * dot(q, AX.u)]; };

  // ---------------------------------------------------------------
  // État
  // ---------------------------------------------------------------
  const etat = { scene: "npm-ghd", prolonges: true, ouverture: 1 };
  const DEMI = 6.5;   // demi-côté du grand carré qui représente un plan (le cube a pour côté 4)
  let couleurs = {};
  function lireCouleurs() {
    const s = getComputedStyle(document.documentElement);
    for (const k of ["encre", "discret", "arete", "carte", "bleu", "orange", "rouge", "bleu-fond", "orange-fond", "bleu-fort", "orange-fort"]) couleurs[k] = s.getPropertyValue(`--${k}`).trim();
  }

  // ---------------------------------------------------------------
  // Dessin, du plus loin au plus près : chaque plan coupe l'espace en deux, on peint d'abord ce qui est
  // derrière lui, puis le plan (transparent), puis ce qui est devant (arbre BSP à deux plans).
  // ---------------------------------------------------------------
  function decouper(poly, p, cote) {   // garde la partie du polygone du côté « cote » du plan p
    const f = X => cote * (dot(p.n, X) - p.d), res = [];
    for (let i = 0; i < poly.length; i++) {
      const X = poly[i], Y = poly[(i + 1) % poly.length], fx = f(X), fy = f(Y);
      if (fx >= -1e-9) res.push(X);
      if ((fx > 1e-9 && fy < -1e-9) || (fx < -1e-9 && fy > 1e-9)) res.push(lerp(X, Y, fx / (fx - fy)));
    }
    return res;
  }
  function remplir(poly, fond, bord, larg = 1.6) {
    if (poly.length < 3) return;
    ctx.beginPath();
    poly.forEach((P, i) => { const a = proj(P); i ? ctx.lineTo(a[0], a[1]) : ctx.moveTo(a[0], a[1]); });
    ctx.closePath(); ctx.fillStyle = fond; ctx.fill();
    if (bord) { ctx.strokeStyle = bord; ctx.lineWidth = larg; ctx.setLineDash([]); ctx.stroke(); }
  }
  function carre(p, h) {
    return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([i, j]) => add(p.c, add(mul(p.e1, i * h), mul(p.e2, j * h))));
  }
  function dessinerPlan(p, contraintes) {
    const clip = poly => contraintes.reduce((q, [pl, cote]) => decouper(q, pl, cote), poly);
    if (etat.prolonges && etat.ouverture > 0) {
      // quatre carrés emboîtés : le plan pâlit vers ses bords, il ne s'arrête pas net
      const h = DEMI * etat.ouverture;
      for (const k of [0.5, 0.67, 0.84, 1]) remplir(clip(carre(p, h * k)), couleurs[p.coul + "-fond"]);
    }
    remplir(clip(p.poly), couleurs[p.coul + "-fort"]);   // bord éventuel : tracé avec les arêtes, pas ici (le découpage le couperait)
  }
  function trait(P, Q, coul, larg, tirets) {
    const a = proj(P), b = proj(Q);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.strokeStyle = coul; ctx.lineWidth = larg; ctx.lineCap = "round"; ctx.setLineDash(tirets || []); ctx.stroke(); ctx.setLineDash([]);
  }
  function rond(P, coul, r) {
    const a = proj(P);
    ctx.beginPath(); ctx.arc(a[0], a[1], r, 0, 2 * Math.PI); ctx.fillStyle = coul; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = couleurs.carte; ctx.stroke();
  }
  function texte(t, x, y, coul, taille = 21, italique = true) {
    ctx.font = `${italique ? "italic " : ""}${taille}px ${MATH}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.strokeStyle = couleurs.carte; ctx.strokeText(t, x, y);
    ctx.fillStyle = coul; ctx.fillText(t, x, y);
  }
  // une arête est cachée quand ses deux faces tournent le dos à l'observateur
  function arreteCachee(P, Q) {
    let vues = 0;
    for (let i = 0; i < 3; i++) if (P[i] === Q[i]) vues += (P[i] === 0 ? -AX.e[i] : AX.e[i]) > 1e-9 ? 1 : 0;
    return vues === 0;
  }

  function dessiner() {
    lireCouleurs();
    const dpr = window.devicePixelRatio || 1, W = toile.clientWidth, H = toile.clientHeight;
    if (toile.width !== Math.round(W * dpr) || toile.height !== Math.round(H * dpr)) { toile.width = Math.round(W * dpr); toile.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    cam.cx = W / 2; cam.cy = H / 2 + 6;
    cam.echelle = Math.min(W * 0.8, H) * 0.34 / Math.sqrt(12);
    AX = axesCamera();

    const sc = SCENES[etat.scene], plans = sc.plans(), I = intersection(plans[0], plans[1]);
    const vus = plans.map(p => (dot(p.n, AX.e) >= 0 ? 1 : -1));   // côté de chaque plan où se trouve l'observateur

    // les morceaux à peindre : arêtes (coupées par les plans), droite d'intersection, points
    const morceaux = [];
    const cote = (X, k) => { const s = dot(plans[k].n, X) - plans[k].d; return Math.abs(s) < 1e-7 ? vus[k] : Math.sign(s); };
    function ajouterSegment(P, Q, peindre) {
      const ts = [0, 1];
      for (const p of plans) {
        const fp = dot(p.n, P) - p.d, fq = dot(p.n, Q) - p.d;
        if ((fp > 1e-7 && fq < -1e-7) || (fp < -1e-7 && fq > 1e-7)) ts.push(fp / (fp - fq));
      }
      ts.sort((a, b) => a - b);
      for (let i = 0; i + 1 < ts.length; i++) {
        const X = lerp(P, Q, ts[i]), Y = lerp(P, Q, ts[i + 1]), Mi = lerp(X, Y, 0.5);
        morceaux.push({ cotes: plans.map((_, k) => cote(Mi, k)), peindre: () => peindre(X, Y) });
      }
    }
    for (const a of ARETES) {
      const P = S[a[0]], Q = S[a[1]], cache = arreteCachee(P, Q);
      ajouterSegment(P, Q, (X, Y) => trait(X, Y, couleurs.arete, cache ? 1.4 : 2, cache ? [7, 6] : null));
    }
    // bord du triangle NPM (comme sur la figure du cours) ; les faces n'ont pas de bord coloré
    for (const p of plans) if (p.bordure) p.poly.forEach((P, i) => ajouterSegment(P, p.poly[(i + 1) % p.poly.length], (X, Y) => trait(X, Y, couleurs[p.coul], 2)));
    if (I && etat.prolonges && etat.ouverture > 0) {
      // la droite d'intersection, limitée aux deux grands carrés
      let t0 = -1e9, t1 = 1e9;
      const h = DEMI * etat.ouverture;
      for (const p of plans) for (const e of [p.e1, p.e2]) {
        const a = dot(sub(I.P0, p.c), e), b = dot(I.dir, e);
        if (Math.abs(b) < 1e-9) continue;
        const u0 = (-h - a) / b, u1 = (h - a) / b;
        t0 = Math.max(t0, Math.min(u0, u1)); t1 = Math.min(t1, Math.max(u0, u1));
      }
      if (t1 > t0) {
        const X = add(I.P0, mul(I.dir, t0)), Y = add(I.P0, mul(I.dir, t1));
        morceaux.push({ cotes: vus.slice(), peindre: () => trait(X, Y, couleurs.rouge, 4) });
      }
    }
    // points qui définissent les plans : couleur de leur plan
    const definis = {};
    plans.forEach(p => [...p.nom].forEach(l => (definis[l] = definis[l] || []).push(p.coul)));
    for (const [l, cs] of Object.entries(definis)) {
      morceaux.push({ cotes: plans.map((_, k) => cote(S[l], k)), peindre: () => { rond(S[l], couleurs[cs[0]], 7.5); if (cs[1]) rond(S[l], couleurs[cs[1]], 4); } });
    }

    // peinture BSP
    const accepte = (m, contraintes) => contraintes.every(([pl, c]) => m.cotes[plans.indexOf(pl)] === c);
    function noeud(k, contraintes) {
      if (k === plans.length) { morceaux.filter(m => accepte(m, contraintes)).forEach(m => m.peindre()); return; }
      for (const c of [-vus[k], vus[k]]) {
        if (c === vus[k]) dessinerPlan(plans[k], contraintes);
        noeud(k + 1, contraintes.concat([[plans[k], c]]));
      }
    }
    noeud(0, []);

    // noms des sommets, écartés du centre du cube
    for (const l of "ABCDEFGH") {
      const a = proj(S[l]), q = sub(S[l], CENTRE);
      const dx = dot(q, AX.r), dy = -dot(q, AX.u), L = Math.hypot(dx, dy) || 1;
      texte(l, a[0] + 17 * dx / L, a[1] + 17 * dy / L, definis[l] ? couleurs[definis[l][0]] : couleurs.encre, 22);
    }
    if (sc.points) {
      // N sur [GC], P sur [HE], M sur [AB] : nom placé du côté extérieur de la face
      const dec = { N: [-1, -0.4, 0], P: [0.3, 0, 1], M: [0, 0.4, -1] };
      for (const l of sc.points) {
        const a = proj(S[l]), q = add(dec[l], mul(sub(S[l], CENTRE), 0.15));
        const dx = dot(q, AX.r), dy = -dot(q, AX.u), L = Math.hypot(dx, dy) || 1;
        texte(l, a[0] + 19 * dx / L, a[1] + 19 * dy / L, couleurs.bleu, 22);
      }
    }
    // nom de la droite d'intersection, quand le cours la nomme
    if (I && sc.ligne && etat.prolonges && etat.ouverture > 0.6) {
      const X = lerp(S[sc.ligne[0]], S[sc.ligne[1]], -0.55), a = proj(X), b = proj(S[sc.ligne[0]]);
      const nx = -(b[1] - a[1]), ny = b[0] - a[0], L = Math.hypot(nx, ny) || 1;
      texte(`(${sc.ligne})`, a[0] + 26 * nx / L, a[1] + 26 * ny / L, couleurs.rouge, 22);
    }

    // légende et constat
    $("legende").innerHTML = plans.map(p => `<span class="${p.coul}"><i class="pastille" style="background:${couleurs[p.coul + "-fort"]}"></i><span>(<i>${p.nom}</i>)</span></span>`).join("");
    const [p1, p2] = plans;
    let s;
    if (etat.scene === "npm-ghd") {
      s = etat.prolonges
        ? `${nomPlan(p1)} et ${nomPlan(p2)} sont <b>sécants</b> : <i>N</i> est un point commun et <i>P</i> ∉ ${nomPlan(p2)}. Leur intersection est <span class="rouge">une droite</span>, qui passe par <i>N</i>.`
        : `Sur la figure, le triangle <i>NPM</i> et la face <i>CDHG</i> n'ont que le point <i>N</i> en commun… Prolongez les plans.`;
    } else if (I) {
      s = `${nomPlan(p1)} et ${nomPlan(p2)} sont <b>sécants</b> selon la droite <span class="rouge">(<i>${sc.ligne}</i>)</span>.`;
    } else {
      s = `${nomPlan(p1)} et ${nomPlan(p2)} sont <b>strictement parallèles</b> : ${nomPlan(p1)} ∩ ${nomPlan(p2)} = ∅, même prolongés.`;
    }
    $("constat").innerHTML = s;
  }

  // ---------------------------------------------------------------
  // Animations : ouverture des plans, mouvements de caméra
  // ---------------------------------------------------------------
  let animOuv = null, animCam = null;
  const doux = s => (s < 0.5 ? 2 * s * s : 1 - Math.pow(-2 * s + 2, 2) / 2);
  function ouvrir() {
    if (animOuv) cancelAnimationFrame(animOuv);
    if (reduit) { etat.ouverture = 1; dessiner(); return; }
    const t0 = performance.now(), D = 1400;
    etat.ouverture = 0;
    const pas = t => { const s = Math.min(1, (t - t0) / D); etat.ouverture = doux(s); dessiner(); animOuv = s < 1 ? requestAnimationFrame(pas) : null; };
    animOuv = requestAnimationFrame(pas);
  }
  function allerVers(az, el) {
    if (animCam) cancelAnimationFrame(animCam);
    let daz = az - cam.az; daz = Math.atan2(Math.sin(daz), Math.cos(daz));
    const a0 = cam.az, e0 = cam.el;
    if (reduit) { cam.az = a0 + daz; cam.el = el; dessiner(); return; }
    const t0 = performance.now(), D = 1300;
    const pas = t => { const s = Math.min(1, (t - t0) / D), k = doux(s); cam.az = a0 + daz * k; cam.el = e0 + (el - e0) * k; dessiner(); animCam = s < 1 ? requestAnimationFrame(pas) : null; };
    animCam = requestAnimationFrame(pas);
  }
  // vue par la tranche : on regarde le long de la droite d'intersection (plans sécants),
  // ou parallèlement aux deux plans (plans parallèles) ; chaque plan se réduit alors à un trait
  function tranche() {
    const plans = SCENES[etat.scene].plans(), I = intersection(plans[0], plans[1]), e = axesCamera().e;
    let v;
    if (I) v = dot(I.dir, e) >= 0 ? I.dir : mul(I.dir, -1);
    else {
      const n = plans[0].n;
      v = sub(e, mul(n, dot(e, n)));
      if (norme(v) < 0.2) v = plans[0].e1;
      v = unit(v);
      if (Math.abs(n[2]) < 0.9) { v = unit([v[0], v[1], v[2] * 0.4]); v = unit(sub(v, mul(n, dot(v, n)))); }   // plans verticaux : vue plutôt de côté
    }
    allerVers(Math.atan2(v[1], v[0]), Math.asin(Math.max(-1, Math.min(1, v[2]))));
  }

  // ---------------------------------------------------------------
  // Souris et doigt : tourner le cube
  // ---------------------------------------------------------------
  let geste = null;
  toile.addEventListener("pointerdown", ev => {
    if (animCam) { cancelAnimationFrame(animCam); animCam = null; }
    toile.setPointerCapture(ev.pointerId);
    geste = { x: ev.clientX, y: ev.clientY, az: cam.az, el: cam.el };
    toile.classList.add("prise");
  });
  toile.addEventListener("pointermove", ev => {
    if (!geste) return;
    cam.az = geste.az - (ev.clientX - geste.x) * 0.008;
    cam.el = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, geste.el + (ev.clientY - geste.y) * 0.008));
    dessiner();
  });
  const fin = () => { geste = null; toile.classList.remove("prise"); };
  toile.addEventListener("pointerup", fin);
  toile.addEventListener("pointercancel", fin);

  // ---------------------------------------------------------------
  // Commandes
  // ---------------------------------------------------------------
  const boutonsScene = document.querySelectorAll("[data-scene]");
  function majBoutons() {
    boutonsScene.forEach(b => b.setAttribute("aria-pressed", b.dataset.scene === etat.scene));
    $("mode-figure").setAttribute("aria-pressed", !etat.prolonges);
    $("mode-plans").setAttribute("aria-pressed", etat.prolonges);
  }
  function choisir(scene) {
    etat.scene = SCENES[scene] ? scene : "npm-ghd";
    majBoutons();
    if (etat.prolonges) ouvrir(); else dessiner();
  }
  boutonsScene.forEach(b => b.addEventListener("click", () => {
    if (location.hash !== "#plein") history.replaceState(null, "", "#" + b.dataset.scene);
    choisir(b.dataset.scene);
  }));
  $("mode-figure").addEventListener("click", () => { etat.prolonges = false; majBoutons(); dessiner(); });
  $("mode-plans").addEventListener("click", () => { if (!etat.prolonges) { etat.prolonges = true; majBoutons(); ouvrir(); } });
  $("tranche").addEventListener("click", tranche);
  $("vue").addEventListener("click", () => allerVers(VUE.az, VUE.el));
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (SCENES[h]) choisir(h); });
  new ResizeObserver(() => dessiner()).observe(toile);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", dessiner);
  new MutationObserver(dessiner).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(dessiner);

  choisir(location.hash.slice(1));
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>
