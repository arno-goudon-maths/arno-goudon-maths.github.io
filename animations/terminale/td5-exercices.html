<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>TD5 en images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Terminale, chapitre 5, TD5 : une scène par exercice, choisie par l'ancre de l'adresse
   (#e11 = exercice 11), pour les QR codes placés à côté des exercices.
   Couleurs du chapitre : arc convexe en vert, arc concave en rouge, point d'inflexion en violet. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e7eaef;
  --courbe: #1f5fbf; --convexe: #1e8a2e; --concave: #d42020; --tangente: #1b1f24; --violet: #7c3aed; --seuil: #f07800;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --courbe: #6fa3f0; --convexe: #55d36a; --concave: #ff6b6b; --tangente: #e8ebf0; --violet: #b48cff; --seuil: #ff9a3c; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --courbe: #6fa3f0; --convexe: #55d36a; --concave: #ff6b6b; --tangente: #e8ebf0; --violet: #b48cff; --seuil: #ff9a3c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 12px; }
.tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-right: 140px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
select { font: 500 13px var(--ui); padding: 3px 8px; border-radius: 8px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); max-width: 100%; }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(24px, 3.6vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 70ch; }
.onglets, .commandes { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
.onglets button, .commandes button { font: 500 13px var(--ui); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
.onglets button[aria-pressed="true"], .commandes button[aria-pressed="true"] { background: var(--encre); color: var(--carte); border-color: var(--encre); }
.commandes label { font: 500 13px var(--ui); color: var(--discret); display: flex; align-items: center; gap: 8px; }
.commandes input[type=range] { width: min(320px, 60vw); accent-color: var(--courbe); }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; overflow: hidden; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-family: var(--math); font-size: clamp(17px, 2.3vw, 21px); margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); text-align: center; }
.constat .petit { display: block; font-family: var(--ui); font-size: 14px; color: var(--discret); margin-top: 2px; }
.vx { color: var(--convexe); } .cc { color: var(--concave); } .vi { color: var(--violet); }
</style>

<div class="page">
  <div class="tete">
    <span class="niveau">Terminale · Chapitre 5 · TD5</span>
    <select id="choix" aria-label="Exercice"></select>
  </div>
  <h1 id="titre"></h1>
  <p class="chapeau" id="chapeau"></p>
  <div class="onglets" id="onglets"></div>
  <div class="figure"><svg id="g" viewBox="0 0 900 480" role="img" aria-label="Courbes de l'exercice"></svg></div>
  <div class="commandes" id="commandes"></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const svg = $("g"), W = 900;
  const fr = (x, d = 2) => { const r = Number(x.toFixed(d)); return (r < 0 ? "−" : "") + String(Math.abs(r)).replace(".", ","); };
  const texte = (x, y, t, o = {}) => svg.appendChild(el("text", Object.assign({ x, y, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 16, fill: "var(--encre)", "paint-order": "stroke", stroke: "var(--carte)", "stroke-width": 4 }, o), t));
  const h = 1e-4;
  const d1 = f => x => (f(x + h) - f(x - h)) / (2 * h);
  const d2 = f => x => (f(x + h) - 2 * f(x) + f(x - h)) / (h * h);
  const E = Math.exp;

  // pendant qu'on fait glisser un curseur, les commandes ne sont pas reconstruites (sinon le glissement s'interrompt) :
  // on les construit dans un élément jetable et on ne recopie que la valeur affichée
  let curseurActif = false;
  const zoneCommandes = () => { const c = $("commandes"); if (!curseurActif) { c.textContent = ""; return c; } const t = document.createElement("div"); t._vraie = c; return t; };
  const finCommandes = t => { if (t._vraie) { const b = t.querySelector("label b"), v = t._vraie.querySelector("label b"); if (b && v) v.textContent = b.textContent; } };
  let etat = { scene: "e11", vue: 0, x0: 0, n: 3, opt: {} };

  // un panneau = un repère : courbe d'une fonction, colorée selon la convexité, le sens de variation ou le signe
  function panneau(P, v, y0p, hp, a, b) {
    const x0 = 60, x1 = W - 20, ya = y0p + 14, yb = y0p + hp - 26;
    const X = x => x0 + (x1 - x0) * (x - a) / (b - a), Y = y => yb - (yb - ya) * (y - P.ymin) / (P.ymax - P.ymin);
    const id = "clip" + y0p;
    const cp = el("clipPath", { id }); cp.appendChild(el("rect", { x: x0, y: ya, width: x1 - x0, height: yb - ya })); svg.appendChild(cp);
    const g = el("g", { "clip-path": `url(#${id})` }); svg.appendChild(g);
    // quadrillage et axes
    const pasx = P.pasx || v.pasx || 1, pasy = P.pasy || 1;
    for (let x = Math.ceil(a / pasx) * pasx; x <= b + 1e-9; x += pasx) {
      g.appendChild(el("line", { x1: X(x), y1: ya, x2: X(x), y2: yb, stroke: "var(--grille)" }));
      if (Math.abs(x) > 1e-9) texte(X(x), Math.min(yb, Math.max(ya + 12, Y(0) + 17)), fr(x, 2), { "font-size": 13, fill: "var(--discret)" });
    }
    for (let y = Math.ceil(P.ymin / pasy) * pasy; y <= P.ymax + 1e-9; y += pasy) {
      g.appendChild(el("line", { x1: x0, y1: Y(y), x2: x1, y2: Y(y), stroke: "var(--grille)" }));
      if (Math.abs(y) > 1e-9) texte(Math.max(x0 + 12, Math.min(x1 - 12, X(0) - 6)), Y(y) + 5, fr(y, 2), { "font-size": 13, fill: "var(--discret)", "text-anchor": "end" });
    }
    if (P.ymin <= 0 && P.ymax >= 0) g.appendChild(el("line", { x1: x0, y1: Y(0), x2: x1, y2: Y(0), stroke: "var(--encre)", "stroke-width": 1.2 }));
    if (a <= 0 && b >= 0) g.appendChild(el("line", { x1: X(0), y1: ya, x2: X(0), y2: yb, stroke: "var(--encre)", "stroke-width": 1.2 }));
    // la courbe, par petits morceaux colorés
    const f = P.f, crit = P.couleur === "convexite" ? d2(f) : P.couleur === "variation" ? d1(f) : P.couleur === "signe" ? f : null;
    const N = 500, pts = [];
    for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, y = f(x); pts.push([x, y]); }
    let d = "", coul = null;
    const vider = () => { if (d) g.appendChild(el("path", { d, fill: "none", stroke: coul, "stroke-width": 3.2, "stroke-linejoin": "round", "stroke-linecap": "round" })); d = ""; };
    pts.forEach(([x, y], i) => {
      if (!isFinite(y) || Math.abs(Y(y)) > 5000) { vider(); return; }
      const c = crit ? (crit(x) > 1e-7 ? "var(--convexe)" : crit(x) < -1e-7 ? "var(--concave)" : coul || "var(--courbe)") : "var(--courbe)";
      if (c !== coul && d) { d += `L${X(x)},${Y(y)}`; vider(); }
      coul = c; d += (d ? "L" : "M") + `${X(x)},${Y(y)}`;
    });
    vider();
    texte(x1 - 8, ya + 18, P.nom, { "text-anchor": "end", "font-size": 18, fill: "var(--courbe)" });
    // points d'inflexion (changement de signe du critère)
    const infl = [];
    if (crit && P.inflexions !== false) for (let i = 1; i <= N; i++) {
      const xa = a + (b - a) * (i - 0.63) / N, xb = a + (b - a) * (i + 0.37) / N, ca = crit(xa), cb = crit(xb);
      if (isFinite(ca) && isFinite(cb) && ca * cb < 0 && Math.abs(ca) > 1e-6 && Math.abs(cb) > 1e-6) {
        let l = xa, r = xb; for (let k = 0; k < 40; k++) { const m = (l + r) / 2; (crit(l) * crit(m) <= 0) ? r = m : l = m; }
        infl.push(l);
      }
    }
    if (P.couleur === "convexite") infl.forEach(x => g.appendChild(el("circle", { cx: X(x), cy: Y(f(x)), r: 6, fill: "var(--violet)" })));
    return { X, Y, g, ya, yb, x0, x1, infl };
  }

  function dessiner() {
    const S = SCENES[etat.scene], v = S.vues[etat.vue];
    svg.textContent = "";
    const [a, b] = typeof v.domaine === "function" ? v.domaine(etat.n) : v.domaine;
    const panneaux = v.panneaux.filter(P => !P.option || etat.opt[P.option]);
    const H = panneaux.length === 1 ? 480 : panneaux.length === 2 ? 560 : 660;
    svg.setAttribute("viewBox", `0 0 900 ${H}`);
    const hp = H / panneaux.length;
    const R = panneaux.map((P0, i) => { const P = typeof P0.f === "function" && P0.f.length === 2 ? Object.assign({}, P0, { f: x => P0.f(x, etat.n) }) : Object.assign({}, P0); if (P0.yfen) Object.assign(P, P0.yfen(etat.n)); return [P, panneau(P, v, i * hp, hp, a, b)]; });
    const [P1, r1] = R[0], f = P1.f, x0 = Math.max(a, Math.min(b, etat.x0));
    // tangente fixe (inégalités de convexité)
    if (v.tangenteFixe) {
      const t = v.tangenteFixe, ta = t.a, m = d1(f)(ta), p = f(ta);
      r1.g.appendChild(el("line", { x1: r1.X(a), y1: r1.Y(p + m * (a - ta)), x2: r1.X(b), y2: r1.Y(p + m * (b - ta)), stroke: "var(--seuil)", "stroke-width": 2.4 }));
      r1.g.appendChild(el("circle", { cx: r1.X(ta), cy: r1.Y(p), r: 5, fill: "var(--seuil)" }));
      const xe = typeof t.xEtiq === "function" ? t.xEtiq(b) : (t.xEtiq ?? b);
      texte(r1.X(xe) + (t.ancre === "start" ? 8 : -8), r1.Y(p + m * (xe - ta)) + (t.dy ?? -10), typeof t.nom === "function" ? t.nom(etat.n) : t.nom, { "text-anchor": t.ancre || "end", fill: "var(--seuil)", "font-size": 17 });
    }
    if (v.droite) {   // une droite d'équation donnée
      const D = v.droite; r1.g.appendChild(el("line", { x1: r1.X(a), y1: r1.Y(D.f(a)), x2: r1.X(b), y2: r1.Y(D.f(b)), stroke: "var(--seuil)", "stroke-width": 2.2 }));
      texte(r1.X(D.xEtiq) + 6, r1.Y(D.f(D.xEtiq)) - 10, D.nom, { "text-anchor": "start", fill: "var(--seuil)", "font-size": 17 });
    }
    // tangente mobile et repère vertical commun à tous les panneaux
    if (v.mobile !== false) {
      const m = d1(f)(x0), p = f(x0), L = (b - a) * 0.22;
      R.forEach(([P, r], i) => r.g.appendChild(el("line", { x1: r.X(x0), y1: r.ya, x2: r.X(x0), y2: r.yb, stroke: "var(--discret)", "stroke-dasharray": "3 5" })));
      const dx = L / Math.sqrt(1 + (m * (r1.Y(0) - r1.Y(1)) / (r1.X(1) - r1.X(0))) ** 2);
      r1.g.appendChild(el("line", { x1: r1.X(x0 - dx), y1: r1.Y(p - m * dx), x2: r1.X(x0 + dx), y2: r1.Y(p + m * dx), stroke: "var(--tangente)", "stroke-width": 2 }));
      R.forEach(([P, r]) => r.g.appendChild(el("circle", { cx: r.X(x0), cy: r.Y(P.f(x0)), r: 6.5, fill: "var(--carte)", stroke: "var(--tangente)", "stroke-width": 2.4 })));
      const poignee = el("rect", { x: 60, y: 0, width: W - 80, height: H, fill: "transparent", style: "cursor: ew-resize" });
      svg.appendChild(poignee);
      poignee.addEventListener("pointerdown", e => {
        const bouge = ev => { const rc = svg.getBoundingClientRect(), xs = (ev.clientX - rc.left) * W / rc.width; etat.x0 = a + (b - a) * (xs - 60) / (W - 80); etat.x0 = Math.max(a, Math.min(b, etat.x0)); dessiner(); };
        bouge(e); const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
        window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
      });
    }
    // commandes
    const c = zoneCommandes();
    (v.options || []).forEach(o => { const bt = document.createElement("button"); bt.type = "button"; bt.textContent = o.nom; bt.setAttribute("aria-pressed", !!etat.opt[o.cle]); bt.onclick = () => { etat.opt[o.cle] = !etat.opt[o.cle]; dessiner(); }; c.appendChild(bt); });
    if (v.curseurN) {
      const l = document.createElement("label"); l.innerHTML = `n = <b style="font-family:var(--math);font-size:17px;color:var(--encre)">${etat.n}</b>`;
      const r = document.createElement("input"); r.type = "range"; r.min = v.curseurN[0]; r.max = v.curseurN[1]; r.value = etat.n; r.oninput = () => { etat.n = +r.value; curseurActif = true; dessiner(); curseurActif = false; };
      l.appendChild(r); c.appendChild(l);
    }
    finCommandes(c);
    if (v.mobile !== false) { const s = document.createElement("span"); s.style.cssText = "font-size:13px;color:var(--discret)"; s.textContent = "Faites glisser sur la figure pour déplacer le point."; if (!c._vraie) c.appendChild(s); }
    // constat
    const k2 = d2(f)(x0), forme = k2 > 1e-6 ? "convexe" : k2 < -1e-6 ? "concave" : null;
    let html = v.constat ? v.constat(x0, f, etat.n, r1.infl) : (v.mobile === false ? "" :
      `${v.var || "x"} = ${fr(x0, 2)} : ` + (forme === "convexe" ? `<b class="vx">${v.nomf || "f"} est convexe</b> au voisinage de ce point, la courbe est au-dessus de sa tangente.`
        : forme === "concave" ? `<b class="cc">${v.nomf || "f"} est concave</b> au voisinage de ce point, la courbe est en dessous de sa tangente.` : `<b class="vi">point d'inflexion</b> : la tangente traverse la courbe.`));
    if (v.note) html += `<span class="petit">${typeof v.note === "function" ? v.note(etat.n, r1.infl) : v.note}</span>`;
    $("constat").innerHTML = html;
  }

  // ---------- les exercices (numéros du TD5) ----------
  const fp = f => d1(f);
  const SCENES = {
    e4: { titre: "Exercice 4 · Convexe ou concave ?", chapeau: "Faites glisser le point le long de chaque courbe : la courbe est-elle au-dessus ou en dessous de sa tangente ?",
      vues: [{ nom: "Courbe 1", domaine: [-4, 4], x0: -2, panneaux: [{ f: x => 4 / (1 + E(-1.5 * x)), nom: "𝒞₁", ymin: -1, ymax: 5, couleur: "convexite" }], note: "Vert : arc convexe ; rouge : arc concave ; violet : point d'inflexion." },
        { nom: "Courbe 2", domaine: [-4, 4], x0: -3, panneaux: [{ f: x => 2 * Math.sin(Math.PI * x / 2) + 2, nom: "𝒞₂", ymin: -1, ymax: 5, couleur: "convexite" }], note: "Vert : arc convexe ; rouge : arc concave ; violet : points d'inflexion." }] },
    e5: { titre: "Exercice 5 · Lire la convexité sur f′", chapeau: "En bas, la courbe de f′ donnée dans l'énoncé ; en haut, une fonction f qui l'admet pour dérivée. Quand f′ croît, f est convexe.",
      vues: [{ domaine: [-3, 5], x0: -2, panneaux: [
        { f: x => (x ** 4 / 4 - x ** 3 - 4.5 * x * x + 11 * x) / 8 - 1, nom: "𝒞f", ymin: -6, ymax: 3, pasy: 1, couleur: "convexite" },
        { f: x => (x ** 3 - 3 * x * x - 9 * x + 11) / 8, nom: "𝒞f′", ymin: -3, ymax: 3, couleur: "variation", inflexions: false }],
        note: "Sur 𝒞f′, en vert les parties où f′ est croissante, en rouge celles où elle est décroissante : ce sont exactement les arcs convexes et concaves de f." }] },
    e9: { titre: "Exercice 9 · Les courbes de f, f′ et f″", chapeau: "La courbe de f de l'énoncé, puis celles de f′ et de f″ à afficher : comparez-les aux courbes a, b, c et d.",
      vues: [{ domaine: [-2, 4], x0: -1, options: [{ cle: "d1", nom: "Afficher f′" }, { cle: "d2", nom: "Afficher f″" }], panneaux: [
        { f: x => 0.13 * x ** 3 - 0.39 * x * x + 1, nom: "𝒞f", ymin: -2, ymax: 3, couleur: "convexite" },
        { option: "d1", f: x => 0.39 * x * x - 0.78 * x, nom: "𝒞f′", ymin: -2, ymax: 3, couleur: "variation", inflexions: false },
        { option: "d2", f: x => 0.78 * x - 0.78, nom: "𝒞f″", ymin: -3, ymax: 3, couleur: "signe", inflexions: false }],
        note: "f est concave puis convexe : f′ est décroissante puis croissante, et f″ est négative puis positive." }] },
    e11: { titre: "Exercice 11 · f(x) = (x − 1)e<sup>x</sup> + 2", chapeau: "La conjecture de la question 1 : la courbe change de convexité au point d'abscisse −1.",
      vues: [{ domaine: [-6, 1.5], x0: -3, options: [{ cle: "d1", nom: "Afficher f′" }], panneaux: [
        { f: x => (x - 1) * E(x) + 2, nom: "𝒞f", ymin: 0, ymax: 4.5, couleur: "convexite" },
        { option: "d1", f: x => x * E(x), nom: "𝒞f′", ymin: -1, ymax: 4, couleur: "variation", inflexions: false }],
        note: "f″(x) = (x + 1)e<sup>x</sup> change de signe en −1 : 𝒞f a un point d'inflexion d'abscisse −1." }] },
    e12: { titre: "Exercice 12 · f(x) = 5x²e<sup>x</sup>", chapeau: "Deux points d'inflexion, aux racines du trinôme x² + 4x + 2, et la tangente en 0.",
      vues: [{ domaine: [-7, 0.6], x0: 0, panneaux: [{ f: x => 5 * x * x * E(x), nom: "𝒞f", ymin: -0.5, ymax: 3.5, pasy: 0.5, couleur: "convexite" }],
        note: "Points d'inflexion d'abscisses −2 − √2 ≈ −3,41 et −2 + √2 ≈ −0,59. Au point d'abscisse 0, la tangente est l'axe des abscisses et la courbe est au-dessus." }] },
    e13: { titre: "Exercice 13 · Satisfaction et envie", chapeau: "La satisfaction f atteint 100 (saturation) au 8e jour ; l'envie f′ se remet à croître après le point d'inflexion.",
      vues: [{ domaine: [0, 30], x0: 8, var: "x", pasx: 2, options: [{ cle: "d1", nom: "Afficher l'envie f′" }], panneaux: [
        { f: x => 12.5 * x * E(-0.125 * x + 1), nom: "𝒞f", ymin: 0, ymax: 110, pasy: 10, couleur: "convexite" },
        { option: "d1", f: x => 12.5 * (1 - 0.125 * x) * E(-0.125 * x + 1), nom: "𝒞f′", ymin: -15, ymax: 35, pasy: 5, couleur: "variation", inflexions: false }],
        note: "Saturation au 8e jour, rejet ensuite (f′ < 0) ; point d'inflexion au 16e jour : à partir de là, l'envie f′ croît de nouveau." }] },
    e14: { titre: "Exercice 14 · Le frelon asiatique", chapeau: "f(t) = (2t + 3,6)e<sup>−0,53t</sup> : le nombre d'abeilles (en dizaines de milliers) ; la vitesse d'extermination est f′.",
      vues: [{ domaine: [0, 12], x0: 1, var: "t", options: [{ cle: "d1", nom: "Afficher la vitesse f′" }], panneaux: [
        { f: t => (2 * t + 3.6) * E(-0.53 * t), nom: "𝒞f", ymin: 0, ymax: 4.5, pasy: 0.5, couleur: "convexite" },
        { option: "d1", f: t => (2 - 0.53 * (2 * t + 3.6)) * E(-0.53 * t), nom: "𝒞f′", ymin: -0.8, ymax: 0.4, pasy: 0.2, couleur: "variation", inflexions: false }],
        note: "f″(t) = (0,5618t − 1,10876)e<sup>−0,53t</sup> s'annule en t ≈ 1,974 minute : la vitesse f′ est minimale (l'extermination la plus rapide), puis augmente." }] },
    e15: { titre: "Exercice 15 · Coût total et coût marginal", chapeau: "C(x) = 10 + 0,5x² − e<sup>−x+3</sup> : le coût marginal C′ est minimal au point d'inflexion de la courbe de C.",
      vues: [{ domaine: [0, 10], x0: 1.5, options: [{ cle: "d1", nom: "Afficher C′" }], nomf: "C", panneaux: [
        { f: x => 10 + 0.5 * x * x - E(-x + 3), nom: "𝒞C", ymin: -12, ymax: 60, pasy: 10, couleur: "convexite" },
        { option: "d1", f: x => x + E(-x + 3), nom: "𝒞C′", ymin: 0, ymax: 22, pasy: 2, couleur: "variation", inflexions: false }],
        note: "C″(x) = 1 − e<sup>−x+3</sup> s'annule en x = 3 : C est concave puis convexe, et le coût marginal C′ est minimal pour 3 centaines de litres." }] },
    e17: { titre: "Exercice 17 · √(1 + x) ≤ 1 + x/2", chapeau: "f est concave : sa courbe est en dessous de chacune de ses tangentes, en particulier de celle au point d'abscisse 0.",
      vues: [{ domaine: [-1, 6], x0: 3, tangenteFixe: { a: 0, nom: "y = 1 + x/2", xEtiq: 4.2, dy: -14 }, panneaux: [{ f: x => Math.sqrt(1 + x), nom: "𝒞f", ymin: -0.5, ymax: 4, pasy: 0.5, couleur: "convexite" }],
        constat: (x, f) => `x = ${fr(x, 2)} : √(1 + x) ≈ ${fr(f(x), 3)} ≤ 1 + x/2 = ${fr(1 + x / 2, 3)}`, note: "La tangente en 0 (en orange) reste au-dessus de la courbe sur tout l'intervalle : c'est l'inégalité à démontrer." }] },
    e18: { titre: "Exercice 18 · f(x) = e<sup>x</sup> / (x − 1)", chapeau: "f est concave sur ]−∞ ; 1[ : sa courbe est en dessous de sa tangente au point d'abscisse 0, d'équation y = −2x − 1.",
      vues: [{ domaine: [-3.5, 0.95], x0: -2, tangenteFixe: { a: 0, nom: "T : y = −2x − 1", xEtiq: -1.3, dy: -10, ancre: "start" }, panneaux: [{ f: x => E(x) / (x - 1), nom: "𝒞f", ymin: -4, ymax: 4, pasy: 1, couleur: "convexite" }],
        constat: (x, f) => `x = ${fr(x, 2)} : f(x) ≈ ${fr(f(x), 3)} ≤ −2x − 1 = ${fr(-2 * x - 1, 3)}`, note: "En multipliant par x − 1 < 0, l'inégalité change de sens : e<sup>x</sup> ≥ (−2x − 1)(x − 1)." }] },
    e19: { titre: "Exercice 19 · f(x) = x e<sup>x² − 1</sup>", chapeau: "Le point d'inflexion à l'origine, et la position de la courbe par rapport à la droite d'équation y = x.",
      vues: [{ domaine: [-1.6, 1.6], x0: -0.8, pasx: 0.5, droite: { f: x => x, nom: "y = x", xEtiq: -1.5 }, panneaux: [{ f: x => x * E(x * x - 1), nom: "𝒞f", ymin: -3, ymax: 3, pasy: 1, couleur: "convexite" }],
        note: "Sur [−1 ; 1], la courbe est au-dessus de la droite pour x ≤ 0 et en dessous pour x ≥ 0 : la droite d'équation y = x traverse la courbe en son point d'inflexion O." }] },
    e20: { titre: "Exercice 20 · L'inégalité de Bernoulli", chapeau: "g(x) = (1 + x)ⁿ est convexe sur [0 ; +∞[ : sa courbe est au-dessus de sa tangente en 0, d'équation y = 1 + nx.",
      vues: [{ domaine: n => [0, 3 / n], x0: 0.5, curseurN: [2, 10], nomf: "g",
        tangenteFixe: { a: 0, nom: n => `y = 1 + ${n}x`, xEtiq: b => b * 0.8, dy: 26, ancre: "start" },
        panneaux: [{ f: (x, n) => (1 + x) ** n, nom: "𝒞g", ymin: 0, ymax: 20, pasy: 2, couleur: "convexite", inflexions: false, yfen: n => ({ ymin: 0, ymax: Math.ceil((1 + 3 / n) ** n) + 1, pasy: (1 + 3 / n) ** n > 12 ? 2 : 1, pasx: 0.1 }) }],
        constat: (x, f, n) => `x = ${fr(x, 2)} : (1 + x)${sup(n)} ≈ ${fr(f(x), 3)} ≥ 1 + ${n}x = ${fr(1 + n * x, 3)}`, note: "Pour tout n, la tangente en 0 (en orange) reste sous la courbe : (1 + a)ⁿ ≥ 1 + na pour tout réel a ≥ 0." }] },
    e22: { titre: "Exercice 22 · Dérivable, mais pas deux fois", chapeau: "f(x) = x√x a une tangente horizontale en 0 ; la courbe de f′(x) = (3/2)√x y a une tangente verticale.",
      vues: [{ domaine: [0, 4], x0: 1, pasx: 0.5, options: [{ cle: "d1", nom: "Afficher f′" }], panneaux: [
        { f: x => x * Math.sqrt(x), nom: "𝒞f", ymin: -0.5, ymax: 8, pasy: 1, couleur: "convexite", inflexions: false },
        { option: "d1", f: x => 1.5 * Math.sqrt(x), nom: "𝒞f′", ymin: -0.5, ymax: 3.5, pasy: 0.5, couleur: "variation", inflexions: false }],
        note: "Rapprochez le point de 0 : la pente de f′ devient infinie, f′ n'est pas dérivable en 0." }] },
  };
  const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  const sup = d => String(d).split("").map(c => SUP[c]).join("");

  function choisir(cle) {
    etat.scene = SCENES[cle] ? cle : "e11"; etat.vue = 0; etat.opt = {}; etat.n = 3;
    const S = SCENES[etat.scene];
    $("titre").innerHTML = S.titre; $("chapeau").innerHTML = S.chapeau; $("choix").value = etat.scene;
    const o = $("onglets"); o.textContent = "";
    S.vues.forEach((v, i) => { if (S.vues.length < 2) return; const bt = document.createElement("button"); bt.type = "button"; bt.textContent = v.nom; bt.setAttribute("aria-pressed", i === 0); bt.onclick = () => { etat.vue = i; etat.x0 = v.x0; [...o.children].forEach((x, j) => x.setAttribute("aria-pressed", j === i)); dessiner(); }; o.appendChild(bt); });
    o.hidden = S.vues.length < 2;
    etat.x0 = S.vues[0].x0;
    dessiner();
  }
  for (const k in SCENES) { const op = document.createElement("option"); op.value = k; op.textContent = SCENES[k].titre.replace(/<[^>]+>/g, ""); $("choix").appendChild(op); }
  $("choix").onchange = () => { choisir($("choix").value); try { history.replaceState(null, "", "#" + $("choix").value); } catch (e) {} };
  const ancre = () => (location.hash.match(/e\d+/) || ["e11"])[0];
  window.addEventListener("hashchange", () => choisir(ancre()));
  choisir(ancre());
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 66vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  etat(location.hash === "#plein");
})();
</script>
