<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>ln(ab) = ln(a) + ln(b)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Terminale, chapitre 3 : la relation fonctionnelle ln(ab) = ln(a) + ln(b).
   ln(a) en bleu, ln(b) en orange, ln(ab) en violet. À droite, les deux hauteurs empilées
   ont toujours exactement la hauteur de ln(ab). */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e8ebf0;
  --a: #1a56db; --b: #f07800; --ab: #7c3aed; --courbe: #1b1f24;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --a: #6fa3f0; --b: #ff9a3c; --ab: #b48cff; --courbe: #e8ebf0; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #252b34; --a: #6fa3f0; --b: #ff9a3c; --ab: #b48cff; --courbe: #e8ebf0; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; }
h1 .a { color: var(--a); } h1 .b { color: var(--b); } h1 .ab { color: var(--ab); }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.poignee { cursor: ew-resize; }
.constat { font-family: var(--math); font-size: clamp(18px, 2.6vw, 24px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); }
.constat .a { color: var(--a); } .constat .b { color: var(--b); } .constat .ab { color: var(--ab); font-weight: 600; }
</style>

<div class="page">
  <span class="niveau">Terminale spécialité · Chapitre 3 · Logarithme népérien</span>
  <h1>ln(<span class="a">a</span><span class="b">b</span>) = ln(<span class="a">a</span>) + ln(<span class="b">b</span>)</h1>
  <p class="chapeau">Faites glisser <i>a</i> et <i>b</i> sur l'axe des abscisses. Multiplier les nombres revient à additionner leurs logarithmes : les deux colonnes de droite ont toujours la même hauteur.</p>
  <div class="figure"><svg id="g" viewBox="0 0 900 540" role="img" aria-label="Courbe de ln, hauteurs ln(a), ln(b) et ln(ab)"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const X0 = 60, KX = 72, Y0 = 300, KY = 100, XM = 9;          // repère : 0 ≤ x ≤ 9, −2,4 ≤ y ≤ 2,4
  const px = x => X0 + x * KX, py = y => Y0 - y * KY;
  const svg = $("g");
  let a = 2, b = 3;
  const nb = (v, d) => (Math.round(v * 10 ** d) / 10 ** d).toString().replace(".", ",").replace("-", "−");
  const fl = v => nb(v, 3);

  function seg(x, y1, y2, c, ep, extra) { svg.appendChild(el("line", Object.assign({ x1: x, y1, x2: x, y2, stroke: c, "stroke-width": ep, "stroke-linecap": "butt" }, extra || {}))); }

  function dessin() {
    svg.textContent = "";
    // quadrillage léger et axes
    for (let k = 1; k <= XM; k++) svg.appendChild(el("line", { x1: px(k), y1: py(2.4), x2: px(k), y2: py(-2.4), stroke: "var(--grille)" }));
    for (let k = -2; k <= 2; k++) svg.appendChild(el("line", { x1: px(0), y1: py(k), x2: px(XM), y2: py(k), stroke: "var(--grille)" }));
    svg.appendChild(el("line", { x1: px(0), y1: Y0, x2: px(XM) + 10, y2: Y0, stroke: "var(--encre)", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: px(0), y1: py(2.5), x2: px(0), y2: py(-2.5), stroke: "var(--encre)", "stroke-width": 1.5 }));
    for (let k = 1; k <= XM; k++) svg.appendChild(el("text", { x: px(k), y: Y0 + 18, "text-anchor": "middle", "font-size": 12, fill: "var(--discret)" }, k));
    for (let k = -2; k <= 2; k++) if (k) svg.appendChild(el("text", { x: px(0) - 8, y: py(k) + 4, "text-anchor": "end", "font-size": 12, fill: "var(--discret)" }, k < 0 ? "−" + (-k) : k));
    // courbe de ln
    let d = "";
    for (let i = 0; i <= 400; i++) { const x = Math.exp(-2.45 + i * (Math.log(XM) + 2.45) / 400); d += (i ? "L" : "M") + px(x).toFixed(1) + "," + py(Math.log(x)).toFixed(1); }
    svg.appendChild(el("path", { d, fill: "none", stroke: "var(--courbe)", "stroke-width": 2.2 }));
    svg.appendChild(el("text", { x: px(8.7), y: py(Math.log(8.7)) - 12, "text-anchor": "end", "font-family": "var(--math)", "font-size": 18, fill: "var(--courbe)" }, "y = ln(x)"));
    const la = Math.log(a), lb = Math.log(b), p = a * b, lp = Math.log(p);
    // hauteurs sous la courbe
    [[a, la, "var(--a)"], [b, lb, "var(--b)"], [p, lp, "var(--ab)"]].forEach(([x, l, c]) => {
      seg(px(x), Y0, py(l), c, 4);
      svg.appendChild(el("circle", { cx: px(x), cy: py(l), r: 5, fill: c }));
    });
    // poignées a et b sur l'axe
    [["a", a, "var(--a)"], ["b", b, "var(--b)"]].forEach(([nom, x, c]) => {
      const h = el("g", { class: "poignee" });
      h.appendChild(el("circle", { cx: px(x), cy: Y0, r: 14, fill: c }));
      h.appendChild(el("text", { x: px(x), y: Y0 + 6, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-size": 18, fill: "var(--carte)" }, nom));
      svg.appendChild(h);
      glisse(h, q => {
        const v = Math.max(0.25, Math.min(XM, Math.round((q.x - X0) / KX * 4) / 4));
        const autre = nom === "a" ? b : a;
        if (v * autre <= XM && v * autre >= 0.1) { if (nom === "a") a = v; else b = v; }
      });
    });
    svg.appendChild(el("text", { x: px(p), y: Y0 + (lp >= 0 ? 38 : -10), "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-weight": 600, "font-size": 17, fill: "var(--ab)" }, "ab"));
    // colonnes de droite : ln(a) + ln(b) empilés, à côté de ln(ab)
    const C1 = 790, C2 = 850, L = 26;
    svg.appendChild(el("line", { x1: C1 - 30, y1: Y0, x2: C2 + 30, y2: Y0, stroke: "var(--encre)", "stroke-width": 1.5 }));
    svg.appendChild(el("rect", { x: C1 - L / 2, y: Math.min(Y0, py(la)), width: L, height: Math.abs(la) * KY, fill: "var(--a)" }));
    svg.appendChild(el("rect", { x: C1 - L / 2, y: Math.min(py(la), py(la + lb)), width: L, height: Math.abs(lb) * KY, fill: "var(--b)", opacity: 0.9 }));
    svg.appendChild(el("rect", { x: C2 - L / 2, y: Math.min(Y0, py(lp)), width: L, height: Math.abs(lp) * KY, fill: "var(--ab)" }));
    svg.appendChild(el("line", { x1: C1 - L / 2 - 6, y1: py(lp), x2: C2 + L / 2 + 6, y2: py(lp), stroke: "var(--ab)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }));
    svg.appendChild(el("text", { x: C1, y: Y0 + (lp >= 0 ? 22 : -10), "text-anchor": "middle", "font-size": 12, fill: "var(--discret)" }, "ln a + ln b"));
    svg.appendChild(el("text", { x: C2, y: Y0 + (lp >= 0 ? 22 : -10), "text-anchor": "middle", "font-size": 12, fill: "var(--discret)" }, "ln(ab)"));
    $("constat").innerHTML = `ln(<span class="a">${nb(a, 2)}</span>) + ln(<span class="b">${nb(b, 2)}</span>) = ln(${nb(a, 2)} × ${nb(b, 2)}) = <span class="ab">ln(${nb(p, 4)})</span> ≈ <span class="a">${fl(la)}</span> + <span class="b">${fl(lb)}</span> ≈ <span class="ab">${fl(lp)}</span>`;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return { x: (evt.clientX - r.left) * 900 / r.width, y: (evt.clientY - r.top) * 540 / r.height }; }
  function glisse(node, maj) {
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { maj(point(ev)); dessin(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
