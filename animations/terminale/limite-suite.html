<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Limite d'une suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Page épurée : une barre de commandes, la grande figure au centre, une ligne de verdict ; le reste replié.
   Couleurs de la figure du cours (chapitre 7) : ℓ et la bande ]ℓ − ε ; ℓ + ε[ en rouge, le rang N en bleu,
   la zone « n ≥ N et u_n dans la bande » en jaune, les repères sur les axes en vert, les termes en ×. */
:root {
  --papier: #f7f8fa;
  --carte: #ffffff;
  --encre: #1b1f24;
  --discret: #5d6672;
  --filet: #d9dee5;
  --grille: #eceff3;
  --rouge: #c62828;
  --bleu: #1f5fbf;
  --vert: #2e7d32;
  --jaune: #fbf0b4;
  --succes: #2e7d32;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1;
    --filet: #313844; --grille: #252b34; --rouge: #f07a7a; --bleu: #6fa3f0; --vert: #7cc983;
    --jaune: #4a4320; --succes: #7cc983; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1;
  --filet: #313844; --grille: #252b34; --rouge: #f07a7a; --bleu: #6fa3f0; --vert: #7cc983;
  --jaune: #4a4320; --succes: #7cc983; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
.page { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 14px; }
header { display: grid; gap: 4px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 0; }
.chapeau { margin: 0; color: var(--discret); max-width: 75ch; }
.barre { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.reglage { display: flex; align-items: center; gap: 10px; min-width: 0; }
.reglage.large { flex: 1 1 260px; }
.reglage label { font-family: var(--math); font-style: italic; font-size: 20px; }
.reglage output { font-family: var(--math); font-size: 20px; min-width: 3.5ch; font-variant-numeric: tabular-nums; }
select, button { font: inherit; color: var(--encre); background: var(--carte); border: 1px solid var(--filet); border-radius: 7px; padding: 6px 10px; }
select { font-family: var(--math); font-size: 17px; max-width: 100%; }
button { cursor: pointer; }
button:hover { border-color: var(--bleu); }
button.principal { background: var(--bleu); border-color: var(--bleu); color: var(--carte); font-weight: 600; }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
input[type="range"] { width: 100%; accent-color: var(--rouge); }
.scene { background: var(--carte); border: 1px solid var(--filet); border-radius: 12px; padding: 8px; }
.scene svg { display: block; width: 100%; height: auto; touch-action: none; }
.verdict { font-size: 18px; text-align: center; min-height: 1.6em; }
.verdict.ok { color: var(--succes); }
.verdict.ko { color: var(--rouge); }
.verdict b { font-family: var(--math); font-weight: 600; }
.definition { font-family: var(--math); font-size: 19px; text-align: center; color: var(--discret); overflow-x: auto; white-space: nowrap; }
.definition .on { color: var(--encre); background: var(--jaune); border-radius: 5px; padding: 0 4px; }
details { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 10px 16px; }
summary { cursor: pointer; color: var(--discret); font-weight: 500; }
.plus { display: grid; gap: 14px; padding-top: 12px; }
.plus p { margin: 0; }
.note { font-size: 13px; color: var(--discret); }
.case { display: inline-flex; align-items: center; gap: 6px; }
.tableau { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-family: var(--math); font-size: 16px; }
th, td { padding: 3px 10px; text-align: center; border-bottom: 1px solid var(--filet); white-space: nowrap; }
th { font-family: var(--ui); font-size: 12px; color: var(--discret); font-weight: 600; text-align: left; }
td.actif { background: var(--jaune); font-weight: 600; }
</style>

<div class="page">
  <header>
    <span class="niveau">Terminale spécialité · Chapitre 7 · Limites de suites</span>
    <h1>Limite d'une suite</h1>
    <p class="chapeau" id="chapeau"></p>
  </header>

  <div class="barre">
    <select id="suite" aria-label="Choix de la suite">
      <option value="frac">uₙ = (3n + 1) / (n + 2)</option>
      <option value="alt">uₙ = 2 + (−1)ⁿ / n</option>
      <option value="geo">uₙ = 5 − 4 × 0,8ⁿ</option>
      <option value="sin">uₙ = 1 + sin(n) / n</option>
      <option value="div">uₙ = (−1)ⁿ</option>
      <option value="rac">uₙ = √n</option>
      <option value="poly">uₙ = n² / 10 − 3n</option>
    </select>
    <div class="reglage large" id="zone-eps">
      <label for="eps">ε</label>
      <input type="range" id="eps" min="0" max="10" step="1" value="3">
      <output id="eps-sortie" for="eps"></output>
    </div>
    <div class="reglage large" id="zone-A">
      <label for="AA">A</label>
      <input type="range" id="AA" min="0" max="9" step="1" value="3">
      <output id="AA-sortie" for="AA"></output>
    </div>
    <button type="button" id="minimal">Montrer le plus petit N</button>
  </div>

  <div class="scene">
    <svg id="graphe" viewBox="0 0 1000 500" role="img" aria-label="Termes de la suite, bande autour de la limite et rang N, que l'on fait glisser"></svg>
  </div>

  <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
  <div class="definition" id="definition"></div>

  <details>
    <summary>Pour aller plus loin</summary>
    <div class="plus">
      <div>
        <p><b id="tab-titre"></b></p>
        <div class="tableau"><table id="tableau"></table></div>
      </div>
      <div id="zone-l">
        <p><b>Et si on visait une autre valeur que la limite ?</b> <span class="note">Choisissez ℓ, puis réduisez <i>ε</i> : bientôt, aucun rang ne convient.</span></p>
        <div class="reglage">
          <label for="ll">ℓ</label>
          <input type="range" id="ll" min="0" max="1" step="0.05" value="0">
          <output id="ll-sortie" for="ll"></output>
          <button type="button" id="vraie-l">Vraie limite</button>
        </div>
        <label class="case"><input type="checkbox" id="zoom"> Zoomer sur la bande</label>
      </div>
    </div>
  </details>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $("graphe");
  const NS = "http://www.w3.org/2000/svg";
  const W = 1000, H = 500, G = 70, D = 24, HAUT = 26, BAS = 54;
  const NVERIF = 100000;   // rang jusqu'auquel on vérifie « tous les termes à partir de N »
  const UI = "IBM Plex Sans, Segoe UI, system-ui, sans-serif", MATH = "STIX Two Text, Cambria Math, Times New Roman, serif";

  function fr(x, d = 3) {
    if (Math.abs(x) < 1e-12) x = 0;
    let s = x.toFixed(d);
    if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s.replace(".", ",").replace("-", "−");
  }
  const entier = n => n.toLocaleString("fr-FR");

  // ---------------------------------------------------------------
  // Les suites
  // ---------------------------------------------------------------
  const SUITES = {
    frac: { n0: 0, u: n => (3 * n + 1) / (n + 2), type: "finie", l: 3 },
    alt:  { n0: 1, u: n => 2 + (n % 2 ? -1 : 1) / n, type: "finie", l: 2 },
    geo:  { n0: 0, u: n => 5 - 4 * Math.pow(0.8, n), type: "finie", l: 5 },
    sin:  { n0: 1, u: n => 1 + Math.sin(n) / n, type: "finie", l: 1 },
    div:  { n0: 0, u: n => (n % 2 ? -1 : 1), type: "finie", l: null },
    rac:  { n0: 0, u: n => Math.sqrt(n), type: "infinie" },
    poly: { n0: 0, u: n => n * n / 10 - 3 * n, type: "infinie" },
  };
  const EPS = [2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005, 0.002, 0.001];
  const AS = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];

  const etat = { cle: "frac", l: 3, iEps: 3, iA: 3, N: 2, zoom: false };
  const suite = () => SUITES[etat.cle];
  const eps = () => EPS[etat.iEps];
  const seuil = () => AS[etat.iA];

  function horsZone(v, l, e, A) {
    return suite().type === "finie" ? Math.abs(v - l) >= e - 1e-12 : v < A;
  }
  // plus petit rang qui convient, ou null si des termes sortent indéfiniment
  function rangMinimal(l = etat.l, e = eps(), A = seuil()) {
    const s = suite();
    let dernier = -1;
    for (let n = s.n0; n <= NVERIF; n++) if (horsZone(s.u(n), l, e, A)) dernier = n;
    if (dernier > NVERIF / 2) return null;
    return Math.max(s.n0, dernier + 1);
  }
  function premierDehors(N) {
    const s = suite();
    for (let n = Math.max(N, s.n0); n <= NVERIF; n++) if (horsZone(s.u(n), etat.l, eps(), seuil())) return n;
    return null;
  }

  // ---------------------------------------------------------------
  // Commandes
  // ---------------------------------------------------------------
  function choisirSuite(cle) {
    etat.cle = cle;
    const s = suite();
    if (s.type === "finie") {
      etat.l = s.l === null ? 1 : s.l;
      const centre = s.l === null ? 0 : s.l, c = $("ll");
      c.min = centre - 1.5; c.max = centre + 1.5; c.value = etat.l;
    }
    etat.N = s.n0 + 2;
    tout();
  }
  $("suite").addEventListener("change", e => choisirSuite(e.target.value));
  $("eps").addEventListener("input", e => { etat.iEps = +e.target.value; tout(); });
  $("AA").addEventListener("input", e => { etat.iA = +e.target.value; tout(); });
  $("ll").addEventListener("input", e => { etat.l = Math.round(parseFloat(e.target.value) * 100) / 100; tout(); });
  $("vraie-l").addEventListener("click", () => { etat.l = suite().l; $("ll").value = etat.l; tout(); });
  $("zoom").addEventListener("change", e => { etat.zoom = e.target.checked; tout(); });
  $("minimal").addEventListener("click", () => {
    const m = rangMinimal();
    if (m === null) {
      $("verdict").className = "verdict ko";
      $("verdict").innerHTML = "Aucun rang <i>N</i> ne convient : quel que soit <i>N</i>, des termes plus loin sortent de la bande.";
    } else { etat.N = m; tout(); }
  });

  // ---------------------------------------------------------------
  // La figure
  // ---------------------------------------------------------------
  function el(nom, attrs, texte, parent = svg) {
    const e = document.createElementNS(NS, nom);
    for (const [c, v] of Object.entries(attrs)) e.setAttribute(c, v);
    if (texte !== undefined) e.textContent = texte;
    parent.appendChild(e);
    return e;
  }
  function pasJoli(etendue, cible) {
    const brut = etendue / cible, p = Math.pow(10, Math.floor(Math.log10(brut))), r = brut / p;
    return (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10) * p;
  }
  let echelle = null;
  let nFinFixe = null;   // la fenêtre ne bouge pas pendant qu'on fait glisser N

  function dessiner(nmin) {
    svg.replaceChildren();
    const s = suite(), finie = s.type === "finie";
    const e = eps(), A = seuil(), l = etat.l, N = etat.N, n0 = s.n0;
    const nFin = nFinFixe ?? Math.max(n0 + 20, Math.ceil(1.4 * Math.max(nmin ?? 30, N, 14)));
    const X = n => G + (n - n0 + 0.5) / (nFin - n0 + 1) * (W - G - D);
    let ymin = Infinity, ymax = -Infinity;
    for (let n = n0; n <= nFin; n++) { const v = s.u(n); ymin = Math.min(ymin, v); ymax = Math.max(ymax, v); }
    if (finie) { ymin = Math.min(ymin, l - e); ymax = Math.max(ymax, l + e); }
    else { ymin = Math.min(ymin, 0); ymax = Math.max(ymax, A * 1.15); }
    if (finie && etat.zoom) { ymin = l - 4 * e; ymax = l + 4 * e; }
    const marge = (ymax - ymin) * 0.07 || 1;
    ymin -= marge; ymax += marge;
    const yb = H - BAS;
    const Y = v => yb - (v - ymin) / (ymax - ymin) * (yb - HAUT);
    echelle = { X, n0, nFin };

    const pu = pasJoli(ymax - ymin, 6), decU = Math.max(0, -Math.floor(Math.log10(pu)));
    for (let v = Math.ceil(ymin / pu) * pu; v <= ymax; v += pu) {
      el("line", { x1: G, x2: W - D, y1: Y(v), y2: Y(v), stroke: "var(--grille)", "stroke-width": 1 });
      el("text", { x: G - 10, y: Y(v) + 5, "text-anchor": "end", "font-size": 14, fill: "var(--discret)", "font-family": UI }, fr(v, decU));
    }
    // zone jaune
    const demi = 0.5 * (X(1) - X(0)), xN = X(N) - demi;
    if (finie) el("rect", { x: xN, y: Y(l + e), width: Math.max(0, W - D - xN), height: Math.max(0, Y(l - e) - Y(l + e)), fill: "var(--jaune)" });
    else el("rect", { x: xN, y: HAUT, width: Math.max(0, W - D - xN), height: Math.max(0, Y(A) - HAUT), fill: "var(--jaune)" });

    // axes
    const y0 = ymin <= 0 && ymax >= 0 ? Y(0) : yb;
    el("line", { x1: G, x2: W - D + 8, y1: y0, y2: y0, stroke: "var(--encre)", "stroke-width": 1.5 });
    el("path", { d: `M ${W - D + 8} ${y0} l -9 -4.5 v 9 z`, fill: "var(--encre)" });
    el("line", { x1: G, x2: G, y1: yb, y2: HAUT - 8, stroke: "var(--encre)", "stroke-width": 1.5 });
    el("path", { d: `M ${G} ${HAUT - 12} l -4.5 9 h 9 z`, fill: "var(--encre)" });
    el("text", { x: G - 12, y: HAUT - 2, "text-anchor": "end", "font-size": 18, fill: "var(--encre)", "font-family": MATH, "font-style": "italic" }, "uₙ");
    el("text", { x: W - D, y: y0 + 22, "text-anchor": "end", "font-size": 18, fill: "var(--encre)", "font-family": MATH, "font-style": "italic" }, "n");
    const pn = Math.max(1, pasJoli(nFin - n0, 10));
    for (let n = Math.ceil(n0 / pn) * pn; n <= nFin; n += pn) {
      el("line", { x1: X(n), x2: X(n), y1: y0 - 4, y2: y0 + 4, stroke: "var(--encre)", "stroke-width": 1 });
      if (Math.abs(X(n) - X(N)) > 40 && X(n) < W - D - 30) el("text", { x: X(n), y: yb + 22, "text-anchor": "middle", "font-size": 14, fill: "var(--discret)", "font-family": UI }, entier(n));
    }

    // bande ou seuil, repères verts sur l'axe des ordonnées
    if (finie) {
      for (const v of [l + e, l - e]) el("line", { x1: G, x2: W - D, y1: Y(v), y2: Y(v), stroke: "var(--rouge)", "stroke-width": 1.8, "stroke-dasharray": "8 6" });
      el("line", { x1: G, x2: W - D, y1: Y(l), y2: Y(l), stroke: "var(--rouge)", "stroke-width": 2.4 });
      el("line", { x1: G, x2: G, y1: Y(l + e), y2: Y(l - e), stroke: "var(--vert)", "stroke-width": 6 });
      const serre = Y(l - e) - Y(l + e) < 34;
      el("text", { x: W - D - 6, y: Y(l + e) - 7, "text-anchor": "end", "font-size": 17, fill: "var(--rouge)", "font-family": MATH }, "ℓ + ε");
      el("text", { x: W - D - 6, y: Y(l - e) + 20, "text-anchor": "end", "font-size": 17, fill: "var(--rouge)", "font-family": MATH }, "ℓ − ε");
      if (!serre) el("text", { x: W - D - 6, y: Y(l) - 7, "text-anchor": "end", "font-size": 18, fill: "var(--rouge)", "font-family": MATH, "font-style": "italic" }, "ℓ");
    } else {
      el("line", { x1: G, x2: W - D, y1: Y(A), y2: Y(A), stroke: "var(--rouge)", "stroke-width": 2.2, "stroke-dasharray": "8 6" });
      el("line", { x1: G, x2: G, y1: Y(A), y2: HAUT, stroke: "var(--vert)", "stroke-width": 6 });
      el("text", { x: W - D - 6, y: Y(A) - 8, "text-anchor": "end", "font-size": 17, fill: "var(--rouge)", "font-family": MATH }, `A = ${entier(A)}`);
    }

    // le rang N : droite bleue qu'on fait glisser
    el("line", { x1: X(N), x2: W - D, y1: yb + 1, y2: yb + 1, stroke: "var(--vert)", "stroke-width": 6 });
    el("line", { x1: X(N), x2: X(N), y1: HAUT - 6, y2: yb, stroke: "var(--bleu)", "stroke-width": 2.4, "stroke-dasharray": "7 5" });
    el("text", { x: X(N), y: yb + 44, "text-anchor": "middle", "font-size": 19, fill: "var(--rouge)", "font-family": MATH, "font-weight": 600 }, `N = ${entier(N)}`);
    const p = el("g", { tabindex: 0, role: "slider", "aria-label": "Rang N", "aria-valuenow": N, style: "cursor: ew-resize", id: "poignee" });
    el("circle", { cx: X(N), cy: HAUT + 8, r: 13, fill: "var(--bleu)" }, undefined, p);
    el("path", { d: `M ${X(N) - 7} ${HAUT + 8} l 5 -5 v 10 z M ${X(N) + 7} ${HAUT + 8} l -5 -5 v 10 z`, fill: "var(--carte)" }, undefined, p);

    // les termes
    const nb = nFin - n0 + 1, croix = nb <= 120;
    const t = croix ? Math.max(3.5, Math.min(8, 220 / nb)) : 0;
    for (let n = n0; n <= nFin; n++) {
      const v = s.u(n), x = X(n), y = Y(v);
      if (y < HAUT - 12 || y > yb + 4) continue;
      const fautif = n >= N && horsZone(v, l, e, A);
      const coul = fautif ? "var(--rouge)" : n >= N ? "var(--encre)" : "var(--discret)";
      if (croix) el("path", { d: `M ${x - t} ${y - t} L ${x + t} ${y + t} M ${x - t} ${y + t} L ${x + t} ${y - t}`, stroke: coul, "stroke-width": fautif ? 2.6 : 1.8 });
      else el("circle", { cx: x, cy: y, r: fautif ? 3 : 1.8, fill: coul });
    }
  }

  // faire glisser N
  let glisse = false;
  function versN(ev) {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    const { X, n0, nFin } = echelle;
    etat.N = Math.min(Math.max(Math.round(n0 + (x - X(n0)) / (X(n0 + 1) - X(n0))), n0), nFin);
    tout();
  }
  svg.addEventListener("pointerdown", ev => { glisse = true; nFinFixe = echelle.nFin; svg.setPointerCapture(ev.pointerId); versN(ev); });
  svg.addEventListener("pointermove", ev => { if (glisse) versN(ev); });
  const lacher = () => { if (glisse) { glisse = false; nFinFixe = null; tout(); } };
  svg.addEventListener("pointerup", lacher);
  svg.addEventListener("pointercancel", lacher);
  svg.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight" || ev.key === "ArrowUp") { etat.N++; ev.preventDefault(); tout(); $("poignee")?.focus(); }
    if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") { etat.N = Math.max(suite().n0, etat.N - 1); ev.preventDefault(); tout(); $("poignee")?.focus(); }
  });

  // ---------------------------------------------------------------
  // Mise à jour
  // ---------------------------------------------------------------
  function tout() {
    const s = suite(), finie = s.type === "finie";
    const e = eps(), A = seuil(), l = etat.l;
    const nmin = rangMinimal();

    $("zone-eps").hidden = !finie; $("zone-A").hidden = finie; $("zone-l").hidden = !finie;
    $("eps-sortie").textContent = fr(e, 3);
    $("AA-sortie").textContent = entier(A);
    $("chapeau").innerHTML = finie
      ? "Choisissez l'écart <i>ε</i>, puis faites glisser la droite bleue : à partir du rang <i>N</i>, <b>tous</b> les termes doivent rester dans la bande jaune."
      : "Choisissez le seuil <i>A</i>, puis faites glisser la droite bleue : à partir du rang <i>N</i>, <b>tous</b> les termes doivent dépasser <i>A</i>.";
    if (finie) { $("ll-sortie").textContent = fr(l, 2); $("vraie-l").hidden = s.l === null || Math.abs(l - s.l) < 1e-9; }

    const p = premierDehors(etat.N), v = $("verdict");
    if (p === null) {
      v.className = "verdict ok";
      v.innerHTML = `Réussi : à partir du rang ${entier(etat.N)}, tous les termes sont ${finie ? "dans la bande" : "au-dessus de <i>A</i>"}.`;
    } else {
      v.className = "verdict ko";
      v.innerHTML = nmin === null
        ? `Impossible : des termes sortent de la bande indéfiniment${s.l === null ? ", la suite n'a pas de limite" : ", ℓ n'est pas la limite"}.`
        : `Raté : <b><i>u</i><sub>${entier(p)}</sub> ≈ ${fr(s.u(p), 4)}</b> ${finie ? "sort de la bande" : "est sous <i>A</i>"}. Décalez la droite bleue vers la droite.`;
    }

    const on = (t, b) => b ? `<span class="on">${t}</span>` : t;
    $("definition").innerHTML = finie
      ? `${on("∀ <i>ε</i> &gt; 0", true)}, ${on("∃ <i>N</i> ∈ ℕ", p === null)}, ∀ <i>n</i> ≥ <i>N</i>, <i>u</i><sub>n</sub> ∈ ]ℓ − <i>ε</i> ; ℓ + <i>ε</i>[`
      : `${on("∀ <i>A</i> ∈ ℝ<sup>+</sup>", true)}, ${on("∃ <i>N</i> ∈ ℕ", p === null)}, ∀ <i>n</i> ≥ <i>N</i>, <i>u</i><sub>n</sub> ≥ <i>A</i>`;

    // pour aller plus loin : le plus petit N pour chaque écart, ou chaque seuil
    const valeurs = finie ? EPS : AS, actif = finie ? etat.iEps : etat.iA;
    const cases = valeurs.map((x, i) => {
      const m = finie ? rangMinimal(l, x, 0) : rangMinimal(0, 0, x);
      return { tete: finie ? fr(x, 3) : entier(x), N: m === null ? "aucun" : entier(m), actif: i === actif };
    });
    $("tab-titre").innerHTML = finie ? "Plus <i>ε</i> est petit, plus il faut aller loin" : "Plus <i>A</i> est grand, plus il faut aller loin";
    $("tableau").innerHTML = `<tr><th>${finie ? "<i>ε</i>" : "<i>A</i>"}</th>${cases.map(c => `<td class="${c.actif ? "actif" : ""}">${c.tete}</td>`).join("")}</tr>`
      + `<tr><th>plus petit <i>N</i></th>${cases.map(c => `<td class="${c.actif ? "actif" : ""}">${c.N}</td>`).join("")}</tr>`;

    dessiner(nmin);
  }

  choisirSuite("frac");
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>
