<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>TD7 en images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Une scène par exercice de calcul du TD7 : on choisit une suite, ses termes s'ajoutent un à un
   sur le nuage de points ; les suites qui encadrent (comparaison, gendarmes) sont en traits pâles. */
:root {
  --papier: #f7f8fa;
  --carte: #ffffff;
  --encre: #1b1f24;
  --discret: #5d6672;
  --filet: #d9dee5;
  --grille: #eceff3;
  --bleu: #1a56db;
  --orange: #f07800;
  --rouge: #d32f2f;
  --vert: #2e7d32;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1;
    --filet: #313844; --grille: #252b34; --bleu: #6f9bf5; --orange: #ff9a3c; --rouge: #f07a7a; --vert: #7cc983; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1;
  --filet: #313844; --grille: #252b34; --bleu: #6f9bf5; --orange: #ff9a3c; --rouge: #f07a7a; --vert: #7cc983; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
.page { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 12px; }
header { display: grid; gap: 4px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 0; }
.chapeau { margin: 0; color: var(--discret); max-width: 75ch; }
.onglets, .suites { display: flex; flex-wrap: wrap; gap: 6px; }
.onglets button { font-weight: 500; }
button { font: inherit; font-size: 14px; color: var(--encre); background: var(--carte); border: 1px solid var(--filet); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--bleu); }
button[aria-pressed="true"] { background: var(--bleu); border-color: var(--bleu); color: var(--carte); }
.suites button { font-family: var(--math); font-size: 16px; }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
.barre { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.reglage { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 200px; }
.reglage label { font-size: 14px; color: var(--discret); white-space: nowrap; }
.reglage output { font-family: var(--math); font-size: 17px; min-width: 3ch; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--bleu); }
.formule { text-align: center; font-family: var(--math); font-size: clamp(20px, 3vw, 26px); }
.scene { background: var(--carte); border: 1px solid var(--filet); border-radius: 12px; padding: 8px; }
.scene svg { display: block; width: 100%; height: auto; }
.constat { text-align: center; font-family: var(--math); font-size: clamp(16px, 2.2vw, 20px); min-height: 1.6em; font-variant-numeric: tabular-nums; }
.constat .lim { color: var(--rouge); font-weight: 600; }
</style>

<div class="page">
  <header>
    <div class="niveau">Terminale spécialité · Chapitre 7 · TD7</div>
    <h1>TD7 en images</h1>
    <p class="chapeau">Choisis un exercice et une suite : ses termes s'ajoutent un à un. Le nuage se rapproche-t-il d'une droite horizontale, ou part-il vers +∞ ou −∞ ?</p>
  </header>

  <div class="onglets" id="onglets"></div>
  <div class="suites" id="suites"></div>

  <div class="formule" id="formule"></div>
  <div class="scene"><svg id="fig" viewBox="0 0 900 430" role="img" aria-label="Nuage de points de la suite"></svg></div>

  <div class="barre">
    <div class="reglage"><label for="N">nombre de termes</label><input type="range" id="N" min="10" max="200" value="60"><output id="Nval">60</output></div>
    <div class="reglage"><label for="vitesse">vitesse</label><input type="range" id="vitesse" min="1" max="10" value="6"></div>
    <button id="jouer" type="button">Animer</button>
    <button id="voir" type="button" aria-pressed="false">Voir la limite</button>
  </div>
  <div class="constat" id="constat"></div>
</div>

<script>
(function () {
  const S = Math.sqrt, L = Math.log, C = Math.cos, Sn = Math.sin, P = Math.pow;
  const alt = n => (n % 2 ? -1 : 1);
  // [nom, formule affichée, fonction, rang initial, limite (nombre, "+∞" ou "−∞"), encadrants éventuels]
  const EX = {
    4: { titre: "Exercice 4", suites: [
      ["u", "uₙ = √n − 10 + n²", n => S(n) - 10 + n * n, 1, "+∞"],
      ["w", "wₙ = 1/n³ − (2 − n²)", n => 1 / P(n, 3) - (2 - n * n), 1, "+∞"],
      ["u", "uₙ = 5(−2n² + 4)", n => 5 * (-2 * n * n + 4), 1, "−∞"],
      ["w", "wₙ = (5n − 1)(4 − 2n)", n => (5 * n - 1) * (4 - 2 * n), 1, "−∞"],
      ["u", "uₙ = (5 + 2n)/3", n => (5 + 2 * n) / 3, 1, "+∞"],
      ["w", "wₙ = 3 + (1 − 1/n)/(2 + √n)", n => 3 + (1 - 1 / n) / (2 + S(n)), 1, 3],
      ["u", "uₙ = n² + ln(n)", n => n * n + L(n), 1, "+∞"],
      ["v", "vₙ = −n⁴ + n² + 3", n => -P(n, 4) + n * n + 3, 1, "−∞"],
      ["z", "zₙ = 1/√n − n³ − n² + 4", n => 1 / S(n) - P(n, 3) - n * n + 4, 1, "−∞"],
      ["v", "vₙ = n/4 + n²(−n + 5)", n => n / 4 + n * n * (-n + 5), 1, "−∞"],
      ["z", "zₙ = (1 − 1/n)(2 + 1/n²)(4 − 1/n³)", n => (1 - 1 / n) * (2 + 1 / (n * n)) * (4 - 1 / P(n, 3)), 1, 8],
      ["v", "vₙ = (−n² + 3)/(2n + 8)", n => (-n * n + 3) / (2 * n + 8), 1, "−∞"],
      ["z", "zₙ = (n² + 1)/(1 − n²)  (n ≥ 2)", n => (n * n + 1) / (1 - n * n), 2, -1],
      ["v", "vₙ = 3 − 2/ln(n)  (n ≥ 2)", n => 3 - 2 / L(n), 2, 3]] },
    5: { titre: "Exercice 5", suites: [
      ["u", "uₙ = 5n² − 3n + 10", n => 5 * n * n - 3 * n + 10, 1, "+∞"],
      ["v", "vₙ = (4n² + 3n + 1)/(13n + 10)", n => (4 * n * n + 3 * n + 1) / (13 * n + 10), 1, "+∞"],
      ["w", "wₙ = 3n²/(n³ + 10)", n => 3 * n * n / (P(n, 3) + 10), 1, 0],
      ["z", "zₙ = (1/√n)(−n − √n)", n => (-n - S(n)) / S(n), 1, "−∞"],
      ["a", "aₙ = √(3n + 1)/(3 + √n)", n => S(3 * n + 1) / (3 + S(n)), 1, "√3"],
      ["b", "bₙ = √(n + 1) − √n", n => S(n + 1) - S(n), 1, 0],
      ["c", "cₙ = (2n² − 5n)/(3n² + 1)", n => (2 * n * n - 5 * n) / (3 * n * n + 1), 1, "2/3"],
      ["d", "dₙ = −4n³ + n² − 7", n => -4 * P(n, 3) + n * n - 7, 1, "−∞"],
      ["e", "eₙ = (n + 1)/(n² − 3)  (n ≥ 2)", n => (n + 1) / (n * n - 3), 2, 0],
      ["f", "fₙ = (1 − n³)/(2n + 5)", n => (1 - P(n, 3)) / (2 * n + 5), 1, "−∞"],
      ["g", "gₙ = n − √n", n => n - S(n), 1, "+∞"],
      ["h", "hₙ = √(n² + n) − n", n => S(n * n + n) - n, 1, "1/2"]] },
    6: { titre: "Exercice 6", suites: [
      ["u", "uₙ = 7n² − 4n + 1", n => 7 * n * n - 4 * n + 1, 1, "+∞"],
      ["v", "vₙ = (5n + 2)/(n² + 1)", n => (5 * n + 2) / (n * n + 1), 1, 0],
      ["w", "wₙ = (3 + 1/n)(n² + 1)", n => (3 + 1 / n) * (n * n + 1), 1, "+∞"],
      ["x", "xₙ = √(4n + 1)/n", n => S(4 * n + 1) / n, 1, 0],
      ["y", "yₙ = (2n − 5)/(n + 1)", n => (2 * n - 5) / (n + 1), 1, 2],
      ["z", "zₙ = −3/(√n + 2)", n => -3 / (S(n) + 2), 1, 0],
      ["a", "aₙ = −3n³ + 5n", n => -3 * P(n, 3) + 5 * n, 1, "−∞"],
      ["b", "bₙ = (2 + 1/n)/(1/n²)", n => (2 + 1 / n) * n * n, 1, "+∞"],
      ["c", "cₙ = 2 − 1/√n + ln(n)", n => 2 - 1 / S(n) + L(n), 1, "+∞"],
      ["d", "dₙ = n²/(n² + 1)", n => n * n / (n * n + 1), 1, 1],
      ["e", "eₙ = (n − 1)/√n", n => (n - 1) / S(n), 1, "+∞"],
      ["f", "fₙ = (1 − n)(√n + 3)", n => (1 - n) * (S(n) + 3), 1, "−∞"],
      ["g", "gₙ = 4/ln(n) − n²  (n ≥ 2)", n => 4 / L(n) - n * n, 2, "−∞"],
      ["h", "hₙ = (3n + 1)/n", n => (3 * n + 1) / n, 1, 3],
      ["k", "kₙ = √n (1/n − 5)", n => S(n) * (1 / n - 5), 1, "−∞"]] },
    12: { titre: "Exercice 12 (comparaison)", suites: [
      ["u", "uₙ = (−1)ⁿ + n²", n => alt(n) + n * n, 1, "+∞", [n => n * n - 1]],
      ["v", "vₙ = −2n² + (−1)ⁿ", n => -2 * n * n + alt(n), 1, "−∞", [n => -2 * n * n + 1]],
      ["w", "wₙ = n² − 5 × (−1)ⁿ", n => n * n - 5 * alt(n), 1, "+∞", [n => n * n - 5]],
      ["z", "zₙ = 5n + 3 − cos(n)", n => 5 * n + 3 - C(n), 1, "+∞", [n => 5 * n + 2]],
      ["a", "aₙ = ln(n) + (−1)ⁿ", n => L(n) + alt(n), 1, "+∞", [n => L(n) - 1]],
      ["b", "bₙ = −√n + sin(n)", n => -S(n) + Sn(n), 1, "−∞", [n => -S(n) + 1]]] },
    17: { titre: "Exercice 17 (gendarmes)", suites: [
      ["u", "uₙ = cos(n)/n²", n => C(n) / (n * n), 1, 0, [n => -1 / (n * n), n => 1 / (n * n)]],
      ["v", "vₙ = (−1)ⁿ/n", n => alt(n) / n, 1, 0, [n => -1 / n, n => 1 / n]],
      ["w", "wₙ = sin(n² + 1)/√(n − 2)  (n ≥ 3)", n => Sn(n * n + 1) / S(n - 2), 3, 0, [n => -1 / S(n - 2), n => 1 / S(n - 2)]],
      ["z", "zₙ = 1 + cos(3n)/n", n => 1 + C(3 * n) / n, 1, 1, [n => 1 - 1 / n, n => 1 + 1 / n]],
      ["a", "aₙ = cos(n)/ln(n)  (n ≥ 2)", n => C(n) / L(n), 2, 0, [n => -1 / L(n), n => 1 / L(n)]],
      ["b", "bₙ = 2 + sin(n)/(n + 1)", n => 2 + Sn(n) / (n + 1), 1, 2, [n => 2 - 1 / (n + 1), n => 2 + 1 / (n + 1)]]] },
    18: { titre: "Exercice 18 (gendarmes)", suites: [
      ["u", "uₙ = (3n² + n cos(n))/(n² + 1)", n => (3 * n * n + n * C(n)) / (n * n + 1), 1, 3, [n => (3 * n * n - n) / (n * n + 1), n => (3 * n * n + n) / (n * n + 1)]],
      ["v", "vₙ = (2ⁿ + (−1)ⁿ)/3ⁿ", n => (P(2, n) + alt(n)) / P(3, n), 1, 0, [n => (P(2, n) - 1) / P(3, n), n => (P(2, n) + 1) / P(3, n)]],
      ["w", "wₙ = (5n − cos(n²))/(2n + 3)", n => (5 * n - C(n * n)) / (2 * n + 3), 1, "5/2", [n => (5 * n - 1) / (2 * n + 3), n => (5 * n + 1) / (2 * n + 3)]],
      ["z", "zₙ = (n + (−1)ⁿ)/(n + √n)", n => (n + alt(n)) / (n + S(n)), 1, 1, [n => (n - 1) / (n + S(n)), n => (n + 1) / (n + S(n))]]] }
  };
  const VAL = { "√3": Math.sqrt(3), "2/3": 2 / 3, "1/2": 0.5, "5/2": 2.5 };

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig"), onglets = document.getElementById("onglets"), suites = document.getElementById("suites");
  const formule = document.getElementById("formule"), constat = document.getElementById("constat");
  const curN = document.getElementById("N"), Nval = document.getElementById("Nval"), vitesse = document.getElementById("vitesse");
  const jouer = document.getElementById("jouer"), voir = document.getElementById("voir");
  let ex = 4, idx = 0, montre = 0, minuteur = null, limiteVisible = false;

  function el(nom, a, t) { const e = document.createElementNS(NS, nom); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; return e; }
  const fr = (x, k) => x.toLocaleString("fr-FR", { maximumFractionDigits: k });

  function nice(span) { const p = Math.pow(10, Math.floor(Math.log10(span))); const f = span / p; return (f < 2 ? 0.2 : f < 5 ? 0.5 : 1) * p * 2; }

  function dessiner() {
    const [nom, txt, f, n0, lim, enc] = EX[ex].suites[idx];
    const N = +curN.value, k = Math.min(montre, N - n0 + 1);
    svg.textContent = "";
    const W = 900, H = 430, g = 70, d = 20, h = 20, b = 40;
    const pts = []; for (let n = n0; n <= N; n++) pts.push([n, f(n)]);
    let ys = pts.map(p => p[1]);
    const limv = typeof lim === "number" ? lim : VAL[lim];
    if (limv !== undefined) ys.push(limv);
    if (enc) for (const e of enc) for (let n = n0; n <= N; n++) ys.push(e(n));
    let ymin = Math.min(...ys), ymax = Math.max(...ys);
    if (limv !== undefined && Math.abs(ymax - ymin) > 0) {
      // borne les encadrants qui s'envolent au début
      const sorted = ys.slice().sort((a, b) => a - b), q = i => sorted[Math.floor(i * (sorted.length - 1))];
      ymin = Math.min(q(0.03), limv); ymax = Math.max(q(0.97), limv);
    }
    if (ymax - ymin < 1e-9) { ymax += 1; ymin -= 1; }
    const marge = (ymax - ymin) * 0.08; ymin -= marge; ymax += marge;
    const X = x => g + (x - 0) / (N + 1) * (W - g - d), Y = y => H - b - (y - ymin) / (ymax - ymin) * (H - b - h);
    // grille
    const pasY = nice(ymax - ymin) / 2;
    for (let y = Math.ceil(ymin / pasY) * pasY; y <= ymax; y += pasY) {
      svg.appendChild(el("line", { x1: g, x2: W - d, y1: Y(y), y2: Y(y), stroke: "var(--grille)" }));
      svg.appendChild(el("text", { x: g - 8, y: Y(y) + 5, "text-anchor": "end", "font-size": 13, fill: "var(--discret)", "font-family": "var(--ui)" }, fr(+y.toPrecision(6), 3)));
    }
    const pasX = N <= 20 ? 2 : N <= 60 ? 10 : N <= 120 ? 20 : 40;
    for (let x = pasX; x <= N; x += pasX) svg.appendChild(el("text", { x: X(x), y: H - b + 20, "text-anchor": "middle", "font-size": 13, fill: "var(--discret)", "font-family": "var(--ui)" }, x));
    // axes
    const y0 = (ymin <= 0 && ymax >= 0) ? Y(0) : H - b;
    svg.appendChild(el("line", { x1: g, x2: W - d, y1: y0, y2: y0, stroke: "var(--encre)", "stroke-width": 1.4 }));
    svg.appendChild(el("line", { x1: g, x2: g, y1: h, y2: H - b, stroke: "var(--encre)", "stroke-width": 1.4 }));
    svg.appendChild(el("text", { x: W - d, y: H - b + 20, "text-anchor": "end", "font-size": 15, fill: "var(--discret)", "font-family": "var(--math)", "font-style": "italic" }, "n"));
    const clip = v => Math.max(h, Math.min(H - b, v));
    // encadrants
    if (enc) enc.forEach(e => {
      let p = ""; for (let n = n0; n <= N; n++) p += (n === n0 ? "M" : " L") + X(n) + " " + clip(Y(e(n)));
      svg.appendChild(el("path", { d: p, fill: "none", stroke: "var(--vert)", "stroke-width": 1.6, opacity: .55 }));
    });
    // limite
    if (limiteVisible && limv !== undefined) {
      svg.appendChild(el("line", { x1: g, x2: W - d, y1: Y(limv), y2: Y(limv), stroke: "var(--rouge)", "stroke-width": 2, "stroke-dasharray": "8 6" }));
    }
    // points
    const r = N > 120 ? 2.6 : N > 60 ? 3.2 : 4;
    for (let i = 0; i < k; i++) {
      const [n, y] = pts[i]; const cy = Y(y); if (cy < h - 2 || cy > H - b + 2) continue;
      svg.appendChild(el("circle", { cx: X(n), cy, r, fill: "var(--bleu)" }));
    }
    formule.textContent = txt;
    const dernier = k > 0 ? pts[k - 1] : null;
    let t = dernier ? `${nom}<sub>${dernier[0]}</sub> ≈ ${fr(dernier[1], 4)}` : "";
    if (limiteVisible) t += `${t ? " · " : ""}limite : <span class="lim">${typeof lim === "number" ? fr(lim, 4) : lim}</span>`;
    constat.innerHTML = t;
  }

  function choisirEx(e) {
    ex = e; idx = 0;
    onglets.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.ex == e));
    suites.textContent = "";
    EX[e].suites.forEach((s, i) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = (i + 1) + ". " + s[0] + "ₙ";
      b.title = s[1]; b.setAttribute("aria-pressed", i === 0);
      b.addEventListener("click", () => { idx = i; suites.querySelectorAll("button").forEach((x, j) => x.setAttribute("aria-pressed", j === i)); relancer(); });
      suites.appendChild(b);
    });
    relancer();
  }
  function stop() { if (minuteur) { clearTimeout(minuteur); minuteur = null; } jouer.textContent = "Animer"; }
  function relancer() { stop(); montre = +curN.value; dessiner(); }

  Object.keys(EX).forEach(e => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.ex = e; b.textContent = EX[e].titre;
    b.addEventListener("click", () => choisirEx(+e)); onglets.appendChild(b);
  });
  curN.addEventListener("input", () => { Nval.value = curN.value; stop(); montre = +curN.value; dessiner(); });
  voir.addEventListener("click", () => { limiteVisible = !limiteVisible; voir.setAttribute("aria-pressed", limiteVisible); voir.textContent = limiteVisible ? "Cacher la limite" : "Voir la limite"; dessiner(); });
  jouer.addEventListener("click", () => {
    if (minuteur) { stop(); return; }
    montre = 0; jouer.textContent = "Pause";
    const pas = () => {
      montre++; dessiner();
      if (montre >= +curN.value) { stop(); return; }
      minuteur = setTimeout(pas, 900 / Math.pow(+vitesse.value, 1.4));
    };
    pas();
  });

  function depuisAncre() { const h = (location.hash.match(/^#e(\d+)$/) || [])[1]; choisirEx(EX[h] ? +h : 4); }
  window.addEventListener("hashchange", depuisAncre);
  depuisAncre();
})();
</script>
<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
