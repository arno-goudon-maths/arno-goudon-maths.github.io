<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Proportions échelonnées</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Comme dans le cours (chapitre 2, 3.1) : A ⊂ B ⊂ C et p_AC = p_AB × p_BC.
   Le grand carré est C (100 %), la bande est B, le pavé est A : son aire est le produit. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --b: #1a56db; --b-fond: rgba(26, 86, 219, 0.14); --a: #f07800; --a-fond: rgba(240, 120, 0, 0.55);
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #2a313b; --b: #6fa3f0; --b-fond: rgba(111, 163, 240, 0.18); --a: #ff9a3c; --a-fond: rgba(255, 154, 60, 0.55); color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #2a313b; --b: #6fa3f0; --b-fond: rgba(111, 163, 240, 0.18); --a: #ff9a3c; --a-fond: rgba(255, 154, 60, 0.55); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.m { font-family: var(--math); font-style: italic; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.poignee { cursor: grab; }
.poignee:active { cursor: grabbing; }
.constat { font-family: var(--math); font-size: clamp(17px, 2.4vw, 22px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); }
.constat .b { color: var(--b); } .constat .a { color: var(--a); font-weight: 600; }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 2 · Proportions et évolutions</span>
  <h1>Proportions échelonnées</h1>
  <p class="chapeau">Le grand carré représente l'ensemble <span class="m">C</span> (100 %). Faites glisser les deux poignées : la bande bleue est la sous-population <span class="m">B</span>, le pavé orange est <span class="m">A</span>, une partie de <span class="m">B</span>.</p>
  <div class="figure"><svg id="g" viewBox="0 0 900 600" role="img" aria-label="Carré C, bande B et pavé A dont l'aire est le produit des proportions"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const X0 = 250, Y0 = 50, S = 460;           // carré C : 460 px de côté, 10 × 10 cases de 1 %
  let pBC = 0.6, pAB = 0.3;                   // proportions de B dans C et de A dans B (pas de 5 %)
  const svg = $("g");
  const pc = x => (Math.round(x * 100)).toString().replace(".", ",") + " %";
  const dec = x => (Math.round(x * 10000) / 10000).toString().replace(".", ",");

  function dessin() {
    svg.textContent = "";
    // C
    svg.appendChild(el("rect", { x: X0, y: Y0, width: S, height: S, fill: "var(--carte)", stroke: "var(--encre)", "stroke-width": 2 }));
    for (let i = 1; i < 10; i++) {
      svg.appendChild(el("line", { x1: X0 + i * S / 10, y1: Y0, x2: X0 + i * S / 10, y2: Y0 + S, stroke: "var(--grille)", "stroke-width": 1 }));
      svg.appendChild(el("line", { x1: X0, y1: Y0 + i * S / 10, x2: X0 + S, y2: Y0 + i * S / 10, stroke: "var(--grille)", "stroke-width": 1 }));
    }
    const wB = pBC * S, hA = pAB * S;
    // B : bande verticale à gauche
    svg.appendChild(el("rect", { x: X0, y: Y0, width: wB, height: S, fill: "var(--b-fond)", stroke: "var(--b)", "stroke-width": 2.5 }));
    // A : bas de la bande
    svg.appendChild(el("rect", { x: X0, y: Y0 + S - hA, width: wB, height: hA, fill: "var(--a-fond)", stroke: "var(--a)", "stroke-width": 2.5 }));
    // noms
    svg.appendChild(el("text", { x: X0 + S + 14, y: Y0 + 26, "font-family": "var(--math)", "font-style": "italic", "font-size": 26, fill: "var(--encre)" }, "C"));
    if (wB > 40) svg.appendChild(el("text", { x: X0 + wB / 2, y: Y0 + 34, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-size": 26, fill: "var(--b)" }, "B"));
    if (hA > 34 && wB > 40) svg.appendChild(el("text", { x: X0 + wB / 2, y: Y0 + S - hA / 2 + 9, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-weight": 600, "font-size": 26, fill: "var(--encre)" }, "A"));
    // cote horizontale : p_BC
    const yc = Y0 + S + 30;
    svg.appendChild(el("line", { x1: X0, y1: yc, x2: X0 + wB, y2: yc, stroke: "var(--b)", "stroke-width": 2 }));
    [X0, X0 + wB].forEach(x => svg.appendChild(el("line", { x1: x, y1: yc - 7, x2: x, y2: yc + 7, stroke: "var(--b)", "stroke-width": 2 })));
    svg.appendChild(el("text", { x: X0 + wB / 2, y: yc + 26, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 20, fill: "var(--b)" }, "B : " + pc(pBC) + " de C"));
    // cote verticale : p_AB
    const xc = X0 - 30;
    svg.appendChild(el("line", { x1: xc, y1: Y0 + S, x2: xc, y2: Y0 + S - hA, stroke: "var(--a)", "stroke-width": 2 }));
    [Y0 + S, Y0 + S - hA].forEach(y => svg.appendChild(el("line", { x1: xc - 7, y1: y, x2: xc + 7, y2: y, stroke: "var(--a)", "stroke-width": 2 })));
    svg.appendChild(el("text", { x: xc - 12, y: Y0 + S - hA / 2 + 7, "text-anchor": "end", "font-family": "var(--math)", "font-size": 20, fill: "var(--a)" }, "A : " + pc(pAB) + " de B"));
    // poignées
    const hB = el("circle", { cx: X0 + wB, cy: Y0 + S / 2, r: 13, fill: "var(--b)", stroke: "var(--carte)", "stroke-width": 3, class: "poignee" });
    const hAh = el("circle", { cx: X0 + wB / 2, cy: Y0 + S - hA, r: 13, fill: "var(--a)", stroke: "var(--carte)", "stroke-width": 3, class: "poignee" });
    svg.appendChild(hB); svg.appendChild(hAh);
    glisse(hB, p => { pBC = Math.min(1, Math.max(0.05, Math.round((p.x - X0) / S * 20) / 20)); });
    glisse(hAh, p => { pAB = Math.min(1, Math.max(0.05, Math.round((Y0 + S - p.y) / S * 20) / 20)); });
    const pAC = pAB * pBC;
    $("constat").innerHTML = `p<sub>AC</sub> = <span class="a">${dec(pAB)}</span> × <span class="b">${dec(pBC)}</span> = ${dec(pAC)} : <span class="a">A</span> représente ${pc(pAC)} de C`;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return { x: (evt.clientX - r.left) * 900 / r.width, y: (evt.clientY - r.top) * 600 / r.height }; }
  function glisse(node, maj) {
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { maj(point(ev)); dessin(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
