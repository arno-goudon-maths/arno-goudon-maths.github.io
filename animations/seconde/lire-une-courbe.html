<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Lire une courbe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Lecture graphique d'une image ou d'antécédents, comme dans le chapitre 3 :
   courbe Cf en bleu, traits de lecture en rouge vif, graduation lue en rouge. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --courbe: #1f5fbf; --lecture: #e0161b; --lecture-fond: rgba(224, 22, 27, 0.10);
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --courbe: #6fa3f0; --lecture: #ff4d52; --lecture-fond: rgba(255, 77, 82, 0.14); color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --courbe: #6fa3f0; --lecture: #ff4d52; --lecture-fond: rgba(255, 77, 82, 0.14); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.m { font-family: var(--math); font-style: italic; }
.barre { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.modes, .courbes { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
.modes button { font-weight: 500; font-size: 16px; }
.modes button[aria-pressed="true"] { border-color: var(--lecture); box-shadow: inset 0 0 0 1.5px var(--lecture); color: var(--lecture); }
.courbes button { font-size: 14px; color: var(--discret); }
.courbes button[aria-pressed="true"] { border-color: var(--courbe); color: var(--courbe); box-shadow: inset 0 0 0 1px var(--courbe); }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-family: var(--math); font-size: clamp(19px, 2.6vw, 24px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--lecture-fond); border: 1.5px solid var(--lecture); min-height: 1.6em; }
.constat b { color: var(--lecture); font-weight: 600; }
button:focus-visible { outline: 3px solid var(--lecture); outline-offset: 2px; }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 3 · Généralités sur les fonctions</span>
  <h1>Lire une courbe</h1>
  <p class="chapeau" id="chapeau"></p>
  <div class="barre">
    <div class="modes" role="group" aria-label="Que lire ?">
      <button type="button" data-mode="image">Lire une image</button>
      <button type="button" data-mode="ante">Lire des antécédents</button>
    </div>
    <div class="courbes" role="group" aria-label="Choix de la courbe" id="courbes"></div>
  </div>
  <div class="figure"><svg id="g" viewBox="0 0 900 575" role="img" aria-label="Courbe représentative d'une fonction f et lecture graphique"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = (x, d = 1) => { const r = Math.round(x * 10 ** d) / 10 ** d; return (Object.is(r, -0) ? 0 : r).toString().replace(".", ",").replace("-", "−"); };
  const entier = x => Math.abs(x - Math.round(x)) < 1e-6;

  // Courbes du cours (3.3) et du TD3 (exercices 23 et 25), passant exactement par leurs points
  const C = [
    { P: [[-5,-3],[-4,-2],[-2,0],[-1,2],[0,3],[2,2],[3,0],[4,-2],[6,-3]], X: [-6, 7], Y: [-4, 4] },
    { P: [[-5,-2],[-4,-1],[-3,0],[-2,1],[-1,2],[0,1],[1,0],[2,-1],[3,-3],[6,-1.5]], X: [-6, 7], Y: [-4, 4] },
    { P: [[-3,-1],[-2,1],[-1,3],[0,2],[0.5,1],[1,0],[2,-0.5]], X: [-4, 3], Y: [-2, 4] }
  ];
  // Interpolation cubique monotone (Fritsch-Carlson) : pas de dépassement entre deux points
  C.forEach(c => {
    const P = c.P, n = P.length, h = [], s = [], m = [];
    for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; s[i] = (P[i + 1][1] - P[i][1]) / h[i]; }
    m[0] = s[0]; m[n - 1] = s[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = s[i - 1] * s[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / s[i - 1] + (h[i] + 2 * h[i - 1]) / s[i]);
    c.a = P[0][0]; c.b = P[n - 1][0];
    c.f = x => {
      let i = 0; while (i < n - 2 && x > P[i + 1][0]) i++;
      const t = (x - P[i][0]) / h[i], t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * P[i][1] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * P[i + 1][1] + (t3 - t2) * h[i] * m[i + 1];
    };
  });

  let k = 0, mode = location.hash === "#antecedents" ? "ante" : "image", xr = 2, yk = 1;
  const G = 52, D = 880, H = [18, 520];
  const sx = x => G + (x - C[k].X[0]) / (C[k].X[1] - C[k].X[0]) * (D - G);
  const sy = y => H[1] - (y - C[k].Y[0]) / (C[k].Y[1] - C[k].Y[0]) * (H[1] - H[0]);
  const ix = px => C[k].X[0] + (px - G) / (D - G) * (C[k].X[1] - C[k].X[0]);
  const iy = py => C[k].Y[0] + (H[1] - py) / (H[1] - H[0]) * (C[k].Y[1] - C[k].Y[0]);

  const chapeau = { image: "Faites glisser le point rouge sur l'axe des abscisses : on monte jusqu'à la courbe, puis on lit l'ordonnée.",
                    ante: "Faites glisser la droite rouge : là où elle coupe la courbe, on descend lire les abscisses." };

  const courbes = $("courbes");
  C.forEach((c, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = "Courbe " + (i + 1); b.addEventListener("click", () => { k = i; xr = Math.round((C[i].a + C[i].b) / 2); yk = 1; dessine(); }); courbes.appendChild(b); });
  document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; dessine(); }));

  // antécédents de y = yk : changements de signe de f − yk, plus les contacts en un point
  function antecedents(c, y) {
    const r = [], N = 4000;
    let x0 = c.a, v0 = c.f(x0) - y;
    for (let i = 1; i <= N; i++) {
      const x1 = c.a + (c.b - c.a) * i / N, v1 = c.f(x1) - y;
      if (Math.abs(v0) < 1e-9) r.push(x0);
      else if (v0 * v1 < 0) { let lo = x0, hi = x1; for (let j = 0; j < 50; j++) { const mi = (lo + hi) / 2; ((c.f(lo) - y) * (c.f(mi) - y) <= 0) ? hi = mi : lo = mi; } r.push((lo + hi) / 2); }
      x0 = x1; v0 = v1;
    }
    if (Math.abs(v0) < 1e-9) r.push(x0);
    c.P.forEach(([px, py]) => { if (Math.abs(py - y) < 1e-9 && !r.some(z => Math.abs(z - px) < 1e-3)) r.push(px); });
    return r.filter((z, i, t) => t.findIndex(w => Math.abs(w - z) < 1e-3) === i).sort((p, q) => p - q);
  }

  function dessine() {
    const c = C[k], g = $("g"); g.textContent = "";
    $("chapeau").textContent = chapeau[mode];
    document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    [...courbes.children].forEach((b, i) => b.setAttribute("aria-pressed", i === k));
    // grille, axes, graduations (on garde les nœuds de texte pour pouvoir les colorer)
    for (let x = Math.ceil(c.X[0]); x <= c.X[1]; x++) g.appendChild(el("line", { x1: sx(x), x2: sx(x), y1: H[0], y2: H[1], stroke: "var(--grille)" }));
    for (let y = Math.ceil(c.Y[0]); y <= c.Y[1]; y++) g.appendChild(el("line", { x1: G, x2: D, y1: sy(y), y2: sy(y), stroke: "var(--grille)" }));
    g.appendChild(el("line", { x1: G, x2: D, y1: sy(0), y2: sy(0), stroke: "var(--encre)", "stroke-width": 1.6 }));
    g.appendChild(el("line", { x1: sx(0), x2: sx(0), y1: H[0], y2: H[1], stroke: "var(--encre)", "stroke-width": 1.6 }));
    g.appendChild(el("text", { x: D - 4, y: sy(0) - 8, "text-anchor": "end", "font-family": "var(--math)", "font-style": "italic", "font-size": 20, fill: "var(--discret)" }, "x"));
    g.appendChild(el("text", { x: sx(0) + 8, y: H[0] + 18, "font-family": "var(--math)", "font-style": "italic", "font-size": 20, fill: "var(--discret)" }, "y"));
    const gradX = {}, gradY = {};
    for (let x = Math.ceil(c.X[0]); x <= c.X[1]; x++) { const t = el("text", { x: x ? sx(x) : sx(0) - 9, y: sy(0) + 21, "text-anchor": "middle", "font-size": 15, fill: "var(--discret)", "font-family": "var(--ui)" }, String(x).replace("-", "−")); g.appendChild(t); gradX[x] = t; }
    for (let y = Math.ceil(c.Y[0]); y <= c.Y[1]; y++) if (y) { const t = el("text", { x: sx(0) - 9, y: sy(y) + 5, "text-anchor": "end", "font-size": 15, fill: "var(--discret)", "font-family": "var(--ui)" }, String(y).replace("-", "−")); g.appendChild(t); gradY[y] = t; }
    // courbe
    let d = "";
    for (let i = 0; i <= 500; i++) { const x = c.a + (c.b - c.a) * i / 500; d += (i ? "L" : "M") + sx(x).toFixed(1) + "," + sy(c.f(x)).toFixed(1); }
    g.appendChild(el("path", { d, fill: "none", stroke: "var(--courbe)", "stroke-width": 4, "stroke-linejoin": "round" }));
    [c.a, c.b].forEach(x => g.appendChild(el("circle", { cx: sx(x), cy: sy(c.f(x)), r: 5.5, fill: "var(--courbe)" })));
    const nom = el("text", { x: sx(c.b) - 6, y: sy(c.f(c.b)) - 14, "text-anchor": "end", "font-family": "var(--math)", "font-size": 24, fill: "var(--courbe)" });
    nom.appendChild(el("tspan", { "font-style": "italic" }, "C")); nom.appendChild(el("tspan", { "font-size": 16, dy: 6, "font-style": "italic" }, "f")); g.appendChild(nom);

    const aRemonter = [];
    const rouge = t => { if (t) { t.setAttribute("fill", "var(--lecture)"); t.setAttribute("font-weight", 700); t.setAttribute("font-size", 17); t.setAttribute("stroke", "var(--carte)"); t.setAttribute("stroke-width", 6); t.setAttribute("paint-order", "stroke"); aRemonter.push(t); } };
    const etiquetteX = (x, dessous, approx = true) => {
      if (entier(x) && gradX[Math.round(x)]) return rouge(gradX[Math.round(x)]);
      const y = dessous ? sy(0) + 40 : sy(0) - 12, txt = (approx ? "≈ " : "") + fr(x);
      g.appendChild(el("text", { x: sx(x), y, "text-anchor": "middle", "font-size": 16, "font-weight": 700, fill: "var(--lecture)", stroke: "var(--carte)", "stroke-width": 6, "paint-order": "stroke", "font-family": "var(--ui)" }, txt));
    };
    const etiquetteY = y => {
      if (entier(y) && (gradY[Math.round(y)] || Math.round(y) === 0)) return Math.round(y) === 0 ? rouge(gradX[0]) : rouge(gradY[Math.round(y)]);
      g.appendChild(el("text", { x: sx(0) - 9, y: sy(y) + 5, "text-anchor": "end", "font-size": 16, "font-weight": 700, fill: "var(--lecture)", stroke: "var(--carte)", "stroke-width": 6, "paint-order": "stroke", "font-family": "var(--ui)" }, "≈ " + fr(y)));
    };
    const trait = (x1, y1, x2, y2) => g.appendChild(el("line", { x1, y1, x2, y2, stroke: "var(--lecture)", "stroke-width": 3.5, "stroke-dasharray": "9 7", "stroke-linecap": "round" }));
    const point = (x, y) => g.appendChild(el("circle", { cx: sx(x), cy: sy(y), r: 7, fill: "var(--lecture)", stroke: "var(--carte)", "stroke-width": 2 }));
    const constat = $("constat");

    if (mode === "image") {
      const dans = xr >= c.a - 1e-9 && xr <= c.b + 1e-9;
      if (dans) {
        const y = c.f(xr);
        trait(sx(xr), sy(0), sx(xr), sy(y)); trait(sx(xr), sy(y), sx(0), sy(y));
        point(xr, y); etiquetteX(xr, true, false); etiquetteY(y);
        const ex = c.P.some(([px]) => Math.abs(px - xr) < 1e-9);
        constat.innerHTML = `<span class="m">f</span>(${fr(xr)}) ${ex ? "=" : "≈"} <b>${fr(y)}</b>` + (ex ? "" : " <span style='color:var(--discret);font-size:.8em'>(lecture approchée)</span>");
      } else {
        etiquetteX(xr, true, false);
        constat.innerHTML = `${fr(xr)} n'est pas dans l'ensemble de définition : <b>pas d'image</b>.`;
      }
      // poignée sur l'axe des abscisses
      const hx = sx(xr), hy = sy(0);
      g.appendChild(el("path", { d: `M${hx},${hy + 27} l-11,22 h22 z`, fill: "var(--lecture)", stroke: "var(--carte)", "stroke-width": 2 }));
      aRemonter.forEach(t => g.appendChild(t));
      const zone = el("rect", { x: G, y: H[0], width: D - G, height: H[1] - H[0] + 40, fill: "transparent", style: "cursor:ew-resize" }); g.appendChild(zone);
      glisser(zone, (px) => { xr = Math.max(c.X[0] + 0.5, Math.min(c.X[1] - 0.5, Math.round(ix(px) * 2) / 2)); });
    } else {
      trait(G, sy(yk), D, sy(yk));
      etiquetteY(yk);
      const r = antecedents(c, yk);
      r.forEach(x => { trait(sx(x), sy(yk), sx(x), sy(0)); point(x, yk); etiquetteX(x, yk > 0); });
      const liste = r.map(x => (entier(x) ? "" : "≈ ") + fr(x));
      const yy = fr(yk);
      constat.innerHTML = r.length === 0 ? `${yy} n'a <b>aucun antécédent</b> par <span class="m">f</span>.`
        : r.length === 1 ? `${yy} a <b>un seul antécédent</b> : <b>${liste[0]}</b>.`
        : `Les antécédents de ${yy} sont <b>${liste.slice(0, -1).join(" ; ")}</b> et <b>${liste.at(-1)}</b>.`;
      // poignée sur l'axe des ordonnées
      const hy = sy(yk);
      g.appendChild(el("path", { d: `M${D - 26},${hy} l24,-11 v22 z`, fill: "var(--lecture)", stroke: "var(--carte)", "stroke-width": 2 }));
      aRemonter.forEach(t => g.appendChild(t));
      const zone = el("rect", { x: G, y: H[0], width: D - G, height: H[1] - H[0], fill: "transparent", style: "cursor:ns-resize" }); g.appendChild(zone);
      glisser(zone, (px, py) => { yk = Math.max(c.Y[0] + 0.5, Math.min(c.Y[1] - 0.5, Math.round(iy(py) * 2) / 2)); });
    }
  }

  // glisser à la souris ou au doigt ; les flèches du clavier déplacent aussi
  function glisser(cible, maj) {
    const svg = $("g");
    const pos = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    cible.addEventListener("pointerdown", e => {
      e.preventDefault(); const p = pos(e); maj(p.x, p.y); dessine();
      const bouge = ev => { const q = pos(ev); maj(q.x, q.y); dessine(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  window.addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key) || e.target.tagName === "BUTTON" && e.key.startsWith("Arrow") && false) return;
    const c = C[k];
    if (mode === "image" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { xr = Math.max(c.X[0] + 0.5, Math.min(c.X[1] - 0.5, xr + (e.key === "ArrowRight" ? 0.5 : -0.5))); e.preventDefault(); dessine(); }
    if (mode === "ante" && (e.key === "ArrowUp" || e.key === "ArrowDown")) { yk = Math.max(c.Y[0] + 0.5, Math.min(c.Y[1] - 0.5, yk + (e.key === "ArrowUp" ? 0.5 : -0.5))); e.preventDefault(); dessine(); }
  });
  dessine();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
