<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Somme de vecteurs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Comme dans le chapitre 4 : u en bleu, v en rouge. On les place bout à bout ;
   le vecteur somme (en vert) n'apparaît qu'à ce moment-là. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e2e6ec;
  --u: #1f5fd6; --v: #e0161b; --somme: #0d9a3e; --somme-fond: rgba(13, 154, 62, 0.12);
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --u: #6fa3f0; --v: #ff5a5f; --somme: #3ddc7a; --somme-fond: rgba(61, 220, 122, 0.14); color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --u: #6fa3f0; --v: #ff5a5f; --somme: #3ddc7a; --somme-fond: rgba(61, 220, 122, 0.14); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.vec { font-family: var(--math); font-style: italic; position: relative; display: inline-block; padding-top: .18em; }
.vec::before { content: ""; position: absolute; left: .02em; right: -.06em; top: .02em; height: 0; border-top: 1.5px solid currentColor; }
.vec::after { content: ""; position: absolute; right: -.1em; top: -.16em; border: .2em solid transparent; border-left: .32em solid currentColor; border-right: 0; }
.u { color: var(--u); } .v { color: var(--v); } .s { color: var(--somme); }
.barre { display: flex; justify-content: flex-end; }
button { font: inherit; font-weight: 500; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--somme); outline-offset: 2px; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-size: clamp(17px, 2.4vw, 21px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); min-height: 1.6em; }
.constat.ok { border-color: var(--somme); background: var(--somme-fond); }
@keyframes trace { from { stroke-dashoffset: var(--long); } to { stroke-dashoffset: 0; } }
.nait { animation: trace .7s ease-out both; }
@keyframes apparait { 0%, 80% { opacity: 0; } to { opacity: 1; } }
.nait-tete { animation: apparait .8s ease-out both; }
@media (prefers-reduced-motion: reduce) { .nait, .nait-tete { animation: none; } }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 4 · Vecteurs du plan</span>
  <h1>Somme de deux vecteurs</h1>
  <p class="chapeau">Faites glisser les vecteurs <span class="vec u">u</span> et <span class="vec v">v</span> pour les placer <b>bout à bout</b> : l'origine de l'un sur l'extrémité de l'autre.</p>
  <div class="barre"><button type="button" id="nouveaux">Nouveaux vecteurs</button></div>
  <div class="figure"><svg id="g" viewBox="0 0 900 560" role="img" aria-label="Deux vecteurs à placer bout à bout sur un quadrillage"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const NX = 18, NY = 11, U = 900 / (NX + 1), OX = U / 2, OY = (560 - NY * U) / 2;
  const px = x => OX + x * U, py = y => OY + (NY - y) * U;            // nœud (x ; y) -> pixels, y vers le haut
  // vecteurs : origine (x, y) sur un nœud et déplacement (dx, dy)
  let V = [];
  function tirage() {
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    let a, b;
    do {
      a = { dx: r(-5, 5), dy: r(-4, 4) }; b = { dx: r(-5, 5), dy: r(-4, 4) };
    } while (Math.hypot(a.dx, a.dy) < 2.5 || Math.hypot(b.dx, b.dy) < 2.5 || a.dx * b.dy - a.dy * b.dx === 0 ||
             Math.hypot(a.dx + b.dx, a.dy + b.dy) < 2 || Math.abs(a.dx + b.dx) > 9 || Math.abs(a.dy + b.dy) > 7);
    const place = (w, zone) => { const xs = [Math.max(0, -w.dx), Math.min(NX, NX - w.dx)], ys = [Math.max(0, -w.dy), Math.min(NY, NY - w.dy)];
      return { x: r(Math.max(xs[0], zone[0]), Math.min(xs[1], zone[1])), y: r(ys[0], ys[1]) }; };
    V = [{ nom: "u", c: "var(--u)", ...a, ...place(a, [0, 7]) }, { nom: "v", c: "var(--v)", ...b, ...place(b, [10, NX]) }];
    dejaVu = "";
  }
  let dejaVu = "";

  function fleche(g, x1, y1, x2, y2, couleur, epais, classe) {
    const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, t = 20;
    const corps = el("line", { x1, y1, x2: x2 - ux * t * 0.8, y2: y2 - uy * t * 0.8, stroke: couleur, "stroke-width": epais, "stroke-linecap": "round" });
    const tete = el("path", { d: `M${x2},${y2} L${x2 - ux * t - uy * t * 0.45},${y2 - uy * t + ux * t * 0.45} L${x2 - ux * t + uy * t * 0.45},${y2 - uy * t - ux * t * 0.45} Z`, fill: couleur });
    if (classe) { corps.setAttribute("class", classe); corps.style.setProperty("--long", L); corps.setAttribute("stroke-dasharray", L); tete.setAttribute("class", "nait-tete"); }
    g.appendChild(corps); g.appendChild(tete);
    return { ux, uy };
  }
  function nom(g, lettre, x, y, couleur, taille = 26, plus) {
    // lettre(s) en italique surmontée(s) d'une flèche, comme \vv{u}
    const grp = el("g", {}); g.appendChild(grp);
    const t = el("text", { x, y, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-size": taille, fill: couleur, stroke: "var(--carte)", "stroke-width": 6, "paint-order": "stroke" }, lettre);
    grp.appendChild(t);
    const w = Math.max(14, lettre.length * taille * 0.42), yb = y - taille * 0.78;
    grp.appendChild(el("line", { x1: x - w / 2, y1: yb, x2: x + w / 2, y2: yb, stroke: couleur, "stroke-width": 2 }));
    grp.appendChild(el("path", { d: `M${x + w / 2 + 4},${yb} l-8,-4 v8 z`, fill: couleur }));
  }

  function boutABout() {
    const [a, b] = V;
    if (a.x + a.dx === b.x && a.y + a.dy === b.y) return { de: a, puis: b, nom: "u + v" };
    if (b.x + b.dx === a.x && b.y + b.dy === a.y) return { de: b, puis: a, nom: "v + u" };
    return null;
  }

  function dessine() {
    const g = $("g"); g.textContent = "";
    for (let x = 0; x <= NX; x++) g.appendChild(el("line", { x1: px(x), x2: px(x), y1: py(0), y2: py(NY), stroke: "var(--grille)", "stroke-width": 1.2 }));
    for (let y = 0; y <= NY; y++) g.appendChild(el("line", { x1: px(0), x2: px(NX), y1: py(y), y2: py(y), stroke: "var(--grille)", "stroke-width": 1.2 }));
    const bb = boutABout();
    // vecteur somme, seulement bout à bout
    if (bb) {
      const o = bb.de, f = { x: bb.puis.x + bb.puis.dx, y: bb.puis.y + bb.puis.dy };
      const neuf = dejaVu !== bb.nom + o.x + o.y;
      fleche(g, px(o.x), py(o.y), px(f.x), py(f.y), "var(--somme)", 6, neuf ? "nait" : null);
      const mx = (px(o.x) + px(f.x)) / 2, my = (py(o.y) + py(f.y)) / 2, L = Math.hypot(px(f.x) - px(o.x), py(f.y) - py(o.y));
      const nx = -(py(f.y) - py(o.y)) / L, ny = (px(f.x) - px(o.x)) / L;
      // l'étiquette se place du côté opposé au point de jonction
      const j = { x: px(bb.puis.x), y: py(bb.puis.y) }, cote = ((j.x - mx) * nx + (j.y - my) * ny) > 0 ? -1 : 1;
      const [p1, p2] = bb.nom.split(" + "), cx = mx + cote * nx * 40, cy = my + cote * ny * 40 + 8;
      g.appendChild(el("rect", { x: cx - 42, y: cy - 30, width: 84, height: 40, rx: 8, fill: "var(--carte)", opacity: 0.85 }));
      nom(g, p1, cx - 24, cy, "var(--somme)", 25);
      g.appendChild(el("text", { x: cx, y: cy, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 25, fill: "var(--somme)" }, "+"));
      nom(g, p2, cx + 24, cy, "var(--somme)", 25);
      dejaVu = bb.nom + o.x + o.y;
      // point de jonction
      g.appendChild(el("circle", { cx: j.x, cy: j.y, r: 7, fill: "none", stroke: "var(--somme)", "stroke-width": 3 }));
      const ordre = bb.nom === "u + v" ? ["u", "v"] : ["v", "u"];
      $("constat").className = "constat ok";
      $("constat").innerHTML = `Bout à bout ! Le vecteur <span class="vec s">${ordre[0]}</span> <span class="s">+</span> <span class="vec s">${ordre[1]}</span> va de l'origine de <span class="vec ${ordre[0]}">${ordre[0]}</span> à l'extrémité de <span class="vec ${ordre[1]}">${ordre[1]}</span>.`;
    } else {
      dejaVu = "";
      $("constat").className = "constat";
      $("constat").innerHTML = `Placez l'origine de l'un sur l'extrémité de l'autre : le vecteur somme apparaîtra.`;
    }
    // les deux vecteurs (au-dessus), avec une zone de prise épaisse
    V.forEach((w, i) => {
      const x1 = px(w.x), y1 = py(w.y), x2 = px(w.x + w.dx), y2 = py(w.y + w.dy);
      const { ux, uy } = fleche(g, x1, y1, x2, y2, w.c, 5);
      g.appendChild(el("circle", { cx: x1, cy: y1, r: 5, fill: w.c }));
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      nom(g, w.nom, mx - uy * 26, my + ux * 26 + 9, w.c);
      const prise = el("line", { x1, y1, x2, y2, stroke: "transparent", "stroke-width": 34, "stroke-linecap": "round", style: "cursor:grab" });
      prise.dataset.i = i; g.appendChild(prise);
      prise.addEventListener("pointerdown", e => attrape(e, i));
    });
  }

  function attrape(e, i) {
    e.preventDefault();
    const svg = $("g");
    const pos = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const p0 = pos(e), w = V[i], x0 = w.x, y0 = w.y;
    const bouge = ev => {
      const p = pos(ev);
      const nx = Math.round(x0 + (p.x - p0.x) / U), ny = Math.round(y0 - (p.y - p0.y) / U);
      w.x = Math.max(Math.max(0, -w.dx), Math.min(Math.min(NX, NX - w.dx), nx));
      w.y = Math.max(Math.max(0, -w.dy), Math.min(Math.min(NY, NY - w.dy), ny));
      dessine();
    };
    const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
    window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
  }

  $("nouveaux").addEventListener("click", () => { tirage(); dessine(); });
  tirage();
  // démonstration pour l'aperçu : ?#bout ou #bout place v au bout de u
  if (location.hash === "#bout") { V[1].x = V[0].x + V[0].dx; V[1].y = V[0].y + V[0].dy; if (V[1].x + V[1].dx < 0 || V[1].x + V[1].dx > NX || V[1].y + V[1].dy < 0 || V[1].y + V[1].dy > NY) { V[0].x = 7; V[0].y = 5; V[0].dx = 3; V[0].dy = 2; V[1].dx = 2; V[1].dy = -4; V[1].x = 10; V[1].y = 7; } }
  dessine();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
