<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Coordonnées de AB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Cours, chapitre 4, « Coordonnées d'un vecteur AB » : AB (x_B − x_A ; y_B − y_A) en colonne.
   Le déplacement horizontal en bleu, le vertical en orange. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e2e6ec;
  --hor: #1a56db; --ver: #f07800; --vec: #7c3aed;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --hor: #6fa3f0; --ver: #ff9a3c; --vec: #b48cff; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --hor: #6fa3f0; --ver: #ff9a3c; --vec: #b48cff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.vec { font-family: var(--math); font-style: italic; position: relative; display: inline-block; padding-top: .18em; }
.vec::before { content: ""; position: absolute; left: .02em; right: -.06em; top: .02em; height: 0; border-top: 1.5px solid currentColor; }
.vec::after { content: ""; position: absolute; right: -.1em; top: -.16em; border: .2em solid transparent; border-left: .32em solid currentColor; border-right: 0; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.poignee { cursor: grab; } .poignee:active { cursor: grabbing; }
.constat { font-family: var(--math); font-size: clamp(17px, 2.4vw, 22px); margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); display: flex; align-items: center; justify-content: center; gap: .45em; flex-wrap: wrap; }
.col { display: inline-flex; align-items: center; }
.col .p { font-size: 2.3em; font-weight: 300; line-height: 1; transform: scaleX(.6); }
.col .c { display: inline-grid; grid-template-rows: auto auto; justify-items: center; line-height: 1.25; }
.h { color: var(--hor); } .v { color: var(--ver); }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 4 · Vecteurs du plan</span>
  <h1>Coordonnées du vecteur <span class="vec">AB</span></h1>
  <p class="chapeau">Faites glisser les points <i>A</i> et <i>B</i>. Pour aller de <i>A</i> à <i>B</i>, on se déplace horizontalement (en bleu), puis verticalement (en orange).</p>
  <div class="figure"><svg id="g" viewBox="0 0 900 560" role="img" aria-label="Repère avec deux points A et B et le vecteur AB décomposé"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const XMIN = -8, XMAX = 8, YMIN = -5, YMAX = 5, U = 50, OX = 450, OY = 280;
  const px = x => OX + x * U, py = y => OY - y * U;
  const svg = $("g");
  let A = { x: -4, y: -2 }, B = { x: 3, y: 2 };
  const s = n => n < 0 ? "−" + (-n) : "" + n;
  const par = n => n < 0 ? "(" + s(n) + ")" : s(n);

  function fleche(x1, y1, x2, y2, c, ep) {
    const L = Math.hypot(x2 - x1, y2 - y1); if (L < 1) return;
    const ux = (x2 - x1) / L, uy = (y2 - y1) / L, t = 18;
    svg.appendChild(el("line", { x1, y1, x2: x2 - ux * t * 0.8, y2: y2 - uy * t * 0.8, stroke: c, "stroke-width": ep, "stroke-linecap": "round" }));
    svg.appendChild(el("path", { d: `M${x2},${y2} L${x2 - ux * t - uy * t * 0.45},${y2 - uy * t + ux * t * 0.45} L${x2 - ux * t + uy * t * 0.45},${y2 - uy * t - ux * t * 0.45} Z`, fill: c }));
  }

  function dessin() {
    svg.textContent = "";
    for (let x = XMIN; x <= XMAX; x++) svg.appendChild(el("line", { x1: px(x), y1: py(YMIN), x2: px(x), y2: py(YMAX), stroke: "var(--grille)" }));
    for (let y = YMIN; y <= YMAX; y++) svg.appendChild(el("line", { x1: px(XMIN), y1: py(y), x2: px(XMAX), y2: py(y), stroke: "var(--grille)" }));
    svg.appendChild(el("line", { x1: px(XMIN), y1: OY, x2: px(XMAX), y2: OY, stroke: "var(--encre)", "stroke-width": 1.4 }));
    svg.appendChild(el("line", { x1: OX, y1: py(YMIN), x2: OX, y2: py(YMAX), stroke: "var(--encre)", "stroke-width": 1.4 }));
    svg.appendChild(el("text", { x: OX - 8, y: OY + 20, "text-anchor": "end", "font-family": "var(--math)", "font-style": "italic", "font-size": 18, fill: "var(--encre)" }, "O"));
    fleche(OX, OY, px(1), OY, "var(--encre)", 2.5); fleche(OX, OY, OX, py(1), "var(--encre)", 2.5);
    svg.appendChild(el("text", { x: px(0.5), y: OY + 22, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-size": 18, fill: "var(--encre)" }, "i"));
    svg.appendChild(el("text", { x: OX - 14, y: py(0.5) + 6, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-size": 18, fill: "var(--encre)" }, "j"));
    const dx = B.x - A.x, dy = B.y - A.y;
    // escalier
    if (dx) { fleche(px(A.x), py(A.y), px(B.x), py(A.y), "var(--hor)", 3);
      svg.appendChild(el("text", { x: px((A.x + B.x) / 2), y: py(A.y) + (dy > 0 ? 26 : -12), "text-anchor": "middle", "font-family": "var(--math)", "font-size": 20, fill: "var(--hor)" }, (dx > 0 ? "+" : "") + s(dx))); }
    if (dy) { fleche(px(B.x), py(A.y), px(B.x), py(B.y), "var(--ver)", 3);
      svg.appendChild(el("text", { x: px(B.x) + (dx >= 0 ? 12 : -12), y: py((A.y + B.y) / 2) + 6, "text-anchor": dx >= 0 ? "start" : "end", "font-family": "var(--math)", "font-size": 20, fill: "var(--ver)" }, (dy > 0 ? "+" : "") + s(dy))); }
    fleche(px(A.x), py(A.y), px(B.x), py(B.y), "var(--vec)", 4);
    // points
    [[A, "A"], [B, "B"]].forEach(([P, nom]) => {
      svg.appendChild(el("circle", { cx: px(P.x), cy: py(P.y), r: 5, fill: "var(--encre)" }));
      const autre = P === A ? B : A, gx = P.x <= autre.x ? -1 : 1, gy = P.y <= autre.y ? 1 : -1;
      svg.appendChild(el("text", { x: px(P.x) + gx * 12, y: py(P.y) + (gy > 0 ? 24 : -12), "text-anchor": gx < 0 ? "end" : "start", "font-family": "var(--math)", "font-size": 19, fill: "var(--encre)" }, `${nom}(${s(P.x)} ; ${s(P.y)})`));
      const h = el("circle", { cx: px(P.x), cy: py(P.y), r: 16, fill: "var(--vec)", opacity: 0.18, class: "poignee" });
      svg.appendChild(h);
      glisse(h, p => {
        const nx = Math.max(XMIN, Math.min(XMAX, Math.round((p.x - OX) / U))), ny = Math.max(YMIN, Math.min(YMAX, Math.round((OY - p.y) / U)));
        const o = P === A ? B : A;
        if (nx !== o.x || ny !== o.y) { P.x = nx; P.y = ny; }
      });
    });
    const col = (a, b) => `<span class="col"><span class="p">(</span><span class="c"><span class="h">${a}</span><span class="v">${b}</span></span><span class="p">)</span></span>`;
    $("constat").innerHTML = `<span class="vec">AB</span>${col("x<sub>B</sub> − x<sub>A</sub>", "y<sub>B</sub> − y<sub>A</sub>")} = ${col(s(B.x) + " − " + par(A.x), s(B.y) + " − " + par(A.y))} = ${col(s(dx), s(dy))}`;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return { x: (evt.clientX - r.left) * 900 / r.width, y: (evt.clientY - r.top) * 560 / r.height }; }
  function glisse(node, maj) {
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { maj(point(ev)); dessin(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
