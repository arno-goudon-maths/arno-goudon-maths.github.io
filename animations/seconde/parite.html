<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Parité d'une fonction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Chapitre 3, partie 4 : fonction paire (symétrie par rapport à l'axe des ordonnées)
   ou impaire (symétrie par rapport à l'origine). On dessine la moitié droite,
   la moitié gauche se construit par symétrie. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --droite: #1f5fbf; --gauche: #ea7a00; --symetrie: #e0161b; --symetrie-fond: rgba(224, 22, 27, 0.10);
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --droite: #6fa3f0; --gauche: #ffa53d; --symetrie: #ff4d52; --symetrie-fond: rgba(255, 77, 82, 0.14); color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --droite: #6fa3f0; --gauche: #ffa53d; --symetrie: #ff4d52; --symetrie-fond: rgba(255, 77, 82, 0.14); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.m { font-family: var(--math); font-style: italic; }
.modes { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-weight: 500; font-size: 16px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--symetrie); color: var(--symetrie); box-shadow: inset 0 0 0 1.5px var(--symetrie); }
button:focus-visible { outline: 3px solid var(--symetrie); outline-offset: 2px; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-family: var(--math); font-size: clamp(19px, 2.6vw, 24px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--symetrie-fond); border: 1.5px solid var(--symetrie); min-height: 1.6em; }
.constat b { color: var(--symetrie); font-weight: 600; }
.constat .d { color: var(--droite); } .constat .g { color: var(--gauche); }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 3 · Parité d'une fonction</span>
  <h1>Paire ou impaire ?</h1>
  <p class="chapeau">Déplacez les points bleus de la partie droite : la partie gauche de la courbe se construit par symétrie.</p>
  <div class="modes" role="group" aria-label="Parité">
    <button type="button" data-mode="paire">Fonction paire</button>
    <button type="button" data-mode="impaire">Fonction impaire</button>
  </div>
  <div class="figure"><svg id="g" viewBox="0 0 900 600" role="img" aria-label="Courbe d'une fonction complétée par symétrie"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = x => { const r = Math.round(x * 10) / 10; return (Object.is(r, -0) ? 0 : r).toString().replace(".", ",").replace("-", "−"); };
  const X = [-5.5, 5.5], Y = [-4.5, 4.5], G = 30, D = 870, H = [20, 580];
  const sx = x => G + (x - X[0]) / (X[1] - X[0]) * (D - G);
  const sy = y => H[1] - (y - Y[0]) / (Y[1] - Y[0]) * (H[1] - H[0]);
  const iy = p => Y[0] + (H[1] - p) / (H[1] - H[0]) * (Y[1] - Y[0]);
  let mode = location.hash === "#impaire" ? "impaire" : "paire", actif = 3, refus = false;
  const pts = { paire: [1, 2.5, 1, 2, 3], impaire: [0, 2, 1.5, -1, 1] };   // f(0), f(1), …, f(4)

  // courbe lisse passant par les points (interpolation cubique monotone)
  function lisse(P) {
    const n = P.length, h = [], s = [], m = [];
    for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; s[i] = (P[i + 1][1] - P[i][1]) / h[i]; }
    m[0] = s[0]; m[n - 1] = s[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = s[i - 1] * s[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / s[i - 1] + (h[i] + 2 * h[i - 1]) / s[i]);
    return x => { let i = 0; while (i < n - 2 && x > P[i + 1][0]) i++;
      const t = (x - P[i][0]) / h[i], t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * P[i][1] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * P[i + 1][1] + (t3 - t2) * h[i] * m[i + 1]; };
  }

  document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; refus = false; if (mode === "impaire" && actif === 0) actif = 3; dessine(); }));

  function dessine() {
    const g = $("g"); g.textContent = "";
    document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    const v = pts[mode]; if (mode === "impaire") v[0] = 0;
    for (let x = -5; x <= 5; x++) g.appendChild(el("line", { x1: sx(x), x2: sx(x), y1: H[0], y2: H[1], stroke: "var(--grille)" }));
    for (let y = -4; y <= 4; y++) g.appendChild(el("line", { x1: G, x2: D, y1: sy(y), y2: sy(y), stroke: "var(--grille)" }));
    g.appendChild(el("line", { x1: G, x2: D, y1: sy(0), y2: sy(0), stroke: "var(--encre)", "stroke-width": 1.6 }));
    // l'élément de symétrie, en rouge : l'axe des ordonnées ou l'origine
    if (mode === "paire") g.appendChild(el("line", { x1: sx(0), x2: sx(0), y1: H[0], y2: H[1], stroke: "var(--symetrie)", "stroke-width": 3.5 }));
    else g.appendChild(el("line", { x1: sx(0), x2: sx(0), y1: H[0], y2: H[1], stroke: "var(--encre)", "stroke-width": 1.6 }));
    for (let x = -5; x <= 5; x++) if (x) g.appendChild(el("text", { x: sx(x), y: sy(0) + 21, "text-anchor": "middle", "font-size": 15, fill: "var(--discret)", "font-family": "var(--ui)" }, String(x).replace("-", "−")));
    for (let y = -4; y <= 4; y++) if (y) g.appendChild(el("text", { x: sx(0) - 9, y: sy(y) + 5, "text-anchor": "end", "font-size": 15, fill: "var(--discret)", "font-family": "var(--ui)" }, String(y).replace("-", "−")));
    g.appendChild(el("text", { x: sx(0) - 9, y: sy(0) + 21, "text-anchor": "end", "font-size": 15, fill: "var(--discret)", "font-family": "var(--ui)" }, "0"));

    const P = v.map((y, i) => [i, y]), f = lisse(P);
    const signe = mode === "paire" ? 1 : -1;
    const chemin = (a, b, fn) => { let d = ""; for (let i = 0; i <= 200; i++) { const x = a + (b - a) * i / 200; d += (i ? "L" : "M") + sx(x).toFixed(1) + "," + sy(fn(x)).toFixed(1); } return d; };
    g.appendChild(el("path", { d: chemin(-4, 0, x => signe * f(-x)), fill: "none", stroke: "var(--gauche)", "stroke-width": 4.5, "stroke-linecap": "round" }));
    g.appendChild(el("path", { d: chemin(0, 4, f), fill: "none", stroke: "var(--droite)", "stroke-width": 4.5, "stroke-linecap": "round" }));

    // le point actif et son symétrique, reliés en pointillés rouges
    const a = actif, ya = v[a];
    if (a > 0) {
      const xs = -a, ys = signe * ya;
      g.appendChild(el("line", { x1: sx(a), y1: sy(ya), x2: sx(xs), y2: sy(ys), stroke: "var(--symetrie)", "stroke-width": 3, "stroke-dasharray": "8 7" }));
      g.appendChild(el("circle", { cx: sx(xs), cy: sy(ys), r: 9, fill: "var(--gauche)", stroke: "var(--carte)", "stroke-width": 3 }));
    }
    if (mode === "impaire") g.appendChild(el("circle", { cx: sx(0), cy: sy(0), r: 8, fill: "var(--symetrie)", stroke: "var(--carte)", "stroke-width": 2.5 }));

    // points déplaçables de la partie droite
    v.forEach((y, i) => {
      const bloque = mode === "impaire" && i === 0;
      if (bloque) return;
      g.appendChild(el("circle", { cx: sx(i), cy: sy(y), r: i === a ? 12 : 10, fill: "var(--droite)", stroke: "var(--carte)", "stroke-width": 3, style: "cursor:ns-resize" }));
      const prise = el("rect", { x: sx(i) - 26, y: H[0], width: 52, height: H[1] - H[0], fill: "transparent", style: "cursor:ns-resize" });
      prise.addEventListener("pointerdown", e => attrape(e, i)); g.appendChild(prise);
    });
    if (mode === "impaire") { const zone = el("rect", { x: sx(0) - 20, y: H[0], width: 40, height: H[1] - H[0], fill: "transparent", style: "cursor:not-allowed" }); zone.addEventListener("pointerdown", e => { e.preventDefault(); refus = true; dessine(); }); g.appendChild(zone); }

    const c = $("constat");
    if (refus && mode === "impaire") c.innerHTML = `Impossible de bouger ce point : <span class="m">f</span>(0) = −<span class="m">f</span>(0), donc <b><span class="m">f</span>(0) = 0</b>.`;
    else if (a === 0) c.innerHTML = `Le point d'abscisse 0 est sur l'axe : il est son propre symétrique.`;
    else if (mode === "paire") c.innerHTML = `<span class="m g">f</span><span class="g">(−${a})</span> = <span class="m d">f</span><span class="d">(${a})</span> = <b>${fr(ya)}</b>`;
    else c.innerHTML = `<span class="m g">f</span><span class="g">(−${a})</span> = −<span class="m d">f</span><span class="d">(${a})</span> = <b>${fr(-ya)}</b>`;
  }

  function attrape(e, i) {
    e.preventDefault(); actif = i; refus = false;
    const svg = $("g");
    const pos = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const bouge = ev => { const p = pos(ev); pts[mode][i] = Math.max(-4, Math.min(4, Math.round(iy(p.y) * 2) / 2)); dessine(); };
    bouge(e);
    const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
    window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
  }
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { actif = Math.max(mode === "impaire" ? 1 : 0, Math.min(4, actif + (e.key === "ArrowRight" ? 1 : -1))); e.preventDefault(); dessine(); }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") { if (mode === "impaire" && actif === 0) return; pts[mode][actif] = Math.max(-4, Math.min(4, pts[mode][actif] + (e.key === "ArrowUp" ? 0.5 : -0.5))); e.preventDefault(); dessine(); }
  });
  dessine();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
