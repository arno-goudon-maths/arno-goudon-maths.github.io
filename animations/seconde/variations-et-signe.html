<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Variations et signe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --courbe: #1f5fbf; --rouge: #e0161b; --rouge-fond: rgba(224, 22, 27, 0.10);
  --hausse: #1a56db; --baisse: #f07800; --hausse-fond: rgba(26, 86, 219, 0.20); --baisse-fond: rgba(240, 120, 0, 0.24);
  --orange: #e07000; --violet: #7c3aed;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --courbe: #6fa3f0; --rouge: #ff4d52; --rouge-fond: rgba(255, 77, 82, 0.14); --hausse: #6aa0ff; --baisse: #ffa133; --hausse-fond: rgba(106, 160, 255, 0.24); --baisse-fond: rgba(255, 161, 51, 0.26); --orange: #ffa53d; --violet: #b794f6; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --courbe: #6fa3f0; --rouge: #ff4d52; --rouge-fond: rgba(255, 77, 82, 0.14); --hausse: #6aa0ff; --baisse: #ffa133; --hausse-fond: rgba(106, 160, 255, 0.24); --baisse-fond: rgba(255, 161, 51, 0.26); --orange: #ffa53d; --violet: #b794f6; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.page > * { min-width: 0; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; }
.centre { text-align: center; margin: 0 auto !important; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.m { font-family: var(--math); font-style: italic; }
.barre { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.groupe { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-weight: 500; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--rouge); color: var(--rouge); box-shadow: inset 0 0 0 1.5px var(--rouge); }
button:focus-visible { outline: 3px solid var(--rouge); outline-offset: 2px; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-family: var(--math); font-size: clamp(18px, 2.5vw, 23px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--carte); border: 1.5px solid var(--filet); min-height: 1.6em; }
.constat b { font-weight: 600; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; font-size: .78em; line-height: 1.05; text-align: center; margin: 0 .08em; } .fr > span:first-child { border-bottom: 1.3px solid currentColor; padding: 0 .15em; }

</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 5 · Variations et signe d'une fonction</span>
  <h1>Le tableau se construit sous la courbe</h1>
  <p class="chapeau" id="chapeau">Faites glisser le point <span class="m">M</span> le long de la courbe, de gauche à droite : le tableau se remplit au fur et à mesure.</p>
  <div class="barre">
    <div class="groupe" role="group" aria-label="Tableau"><button type="button" data-mode="var">Variations</button><button type="button" data-mode="signe">Signe</button></div>
    <div class="groupe" role="group" aria-label="Courbe"><button type="button" data-c="0">Courbe 1</button><button type="button" data-c="1">Courbe 2</button></div>
  </div>
  <div class="figure"><svg id="g" viewBox="0 0 900 486" role="img" aria-label="Courbe d'une fonction parcourue par un point"></svg></div>
  <div class="figure" style="padding:10px"><svg id="tab" viewBox="0 0 900 170" role="img" aria-label="Tableau de variations ou de signes"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = (x, d = 2) => { const r = Math.round(x * 10 ** d) / 10 ** d; return (Object.is(r, -0) ? 0 : r).toString().replace(".", ",").replace("-", "−"); };
  const entier = x => Math.abs(x - Math.round(x)) < 1e-9;
  const pgcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  // fraction p/q réduite, écrite en HTML (−3/4 en barre de fraction compacte)
  const frac = (p, q) => { if (q < 0) { p = -p; q = -q; } const g = pgcd(p, q); p /= g; q /= g;
    const s = p < 0 ? "−" : ""; p = Math.abs(p);
    return q === 1 ? s + p : `${s}<span class="fr"><span>${p}</span><span>${q}</span></span>`; };
  const pos = (svg, ev) => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  function glisser(svg, cible, maj, fini) {
    cible.addEventListener("pointerdown", e => {
      e.preventDefault(); maj(pos(svg, e));
      const bouge = ev => maj(pos(svg, ev));
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); if (fini) fini(); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  // courbe lisse passant par des points, sans dépassement (Fritsch-Carlson)
  function lisse(P) {
    const n = P.length, h = [], s = [], m = [];
    for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; s[i] = (P[i + 1][1] - P[i][1]) / h[i]; }
    m[0] = s[0]; m[n - 1] = s[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = s[i - 1] * s[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / s[i - 1] + (h[i] + 2 * h[i - 1]) / s[i]);
    return x => { let i = 0; while (i < n - 2 && x > P[i + 1][0]) i++;
      const t = (x - P[i][0]) / h[i], t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * P[i][1] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * P[i + 1][1] + (t3 - t2) * h[i] * m[i + 1]; };
  }
  // repère quadrillé : renvoie les fonctions d'échelle
  function repere(g, X, Y, cadre, opt = {}) {
    const [G, D, Hh, B] = cadre;
    const id = "c" + Math.random().toString(36).slice(2, 7);
    g.appendChild(el("defs")).appendChild(el("clipPath", { id })).appendChild(el("rect", { x: G, y: Hh, width: D - G, height: B - Hh }));
    const sx = x => G + (x - X[0]) / (X[1] - X[0]) * (D - G), sy = y => B - (y - Y[0]) / (Y[1] - Y[0]) * (B - Hh);
    const pas = opt.pas || 1;
    for (let x = Math.ceil(X[0]); x <= X[1]; x++) g.appendChild(el("line", { x1: sx(x), x2: sx(x), y1: Hh, y2: B, stroke: "var(--grille)" }));
    for (let y = Math.ceil(Y[0]); y <= Y[1]; y++) g.appendChild(el("line", { x1: G, x2: D, y1: sy(y), y2: sy(y), stroke: "var(--grille)" }));
    g.appendChild(el("line", { x1: G, x2: D, y1: sy(0), y2: sy(0), stroke: "var(--encre)", "stroke-width": 1.6 }));
    g.appendChild(el("line", { x1: sx(0), x2: sx(0), y1: Hh, y2: B, stroke: "var(--encre)", "stroke-width": 1.6 }));
    const t = { x: {}, y: {} };
    for (let x = Math.ceil(X[0]); x <= X[1]; x++) if (x % pas === 0) { const e = el("text", { x: x ? sx(x) : sx(0) - 9, y: sy(0) + 20, "text-anchor": "middle", "font-size": 14, fill: "var(--discret)", "font-family": "var(--ui)" }, String(x).replace("-", "−")); g.appendChild(e); t.x[x] = e; }
    for (let y = Math.ceil(Y[0]); y <= Y[1]; y++) if (y && y % pas === 0) { const e = el("text", { x: sx(0) - 8, y: sy(y) + 5, "text-anchor": "end", "font-size": 14, fill: "var(--discret)", "font-family": "var(--ui)" }, String(y).replace("-", "−")); g.appendChild(e); t.y[y] = e; }
    return { clip: `url(#${id})`, sx, sy, ix: p => X[0] + (p - G) / (D - G) * (X[1] - X[0]), iy: p => Y[0] + (B - p) / (B - Hh) * (Y[1] - Y[0]), t };
  }

  // On fait glisser le point M le long de la courbe, de gauche à droite.
  // Variations : la courbe parcourue se colore (bleu : croissante, orange : décroissante)
  // et le tableau de variations se construit. Signe : au-dessus de l'axe en bleu (+),
  // en dessous en orange (−), et la ligne de signes se remplit.
  const C = [
    { P: [[-4,-2],[-3,0],[-2,2],[-1,0],[1,-2],[2,0],[3,1],[4,0],[5,-1]], X: [-5, 6], Y: [-3, 3] },
    { P: [[-5,3],[-4,0],[-2,-2],[0,0],[2,2],[4,0],[5,-1]], X: [-6, 6], Y: [-3, 4] }
  ];
  C.forEach(c => {
    c.f = lisse(c.P); c.a = c.P[0][0]; c.b = c.P.at(-1)[0];
    // extremums : les bornes et les points où le sens change
    c.E = c.P.filter((p, i, t) => i === 0 || i === t.length - 1 || (p[1] - t[i - 1][1]) * (t[i + 1][1] - p[1]) < 0);
    // zéros précis par dichotomie
    c.Z = []; const N = 3000; let p = c.a, vp = c.f(p);
    for (let i = 1; i <= N; i++) { const x = c.a + (c.b - c.a) * i / N, v = c.f(x);
      if (Math.abs(v) < 1e-12) c.Z.push(x); else if (vp * v < 0) { let lo = p, hi = x; for (let j = 0; j < 60; j++) { const m = (lo + hi) / 2; c.f(lo) * c.f(m) <= 0 ? hi = m : lo = m; } c.Z.push((lo + hi) / 2); }
      p = x; vp = v; }
    c.Z = c.Z.filter((z, i, t) => (i === 0 || z - t[i - 1] > 1e-3) && z > c.a + 1e-6 && z < c.b - 1e-6);
  });
  let k = 0, mode = location.hash === "#signe" ? "signe" : "var", xm = null;
  const svg = $("g"), tab = $("tab");
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; dessine(); }));
  document.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { k = +b.dataset.c; xm = null; dessine(); }));
  const nb = x => (entier(x) ? "" : "≈ ") + fr(x, 1);
  function dessine() {
    const c = C[k]; if (xm === null) xm = c.a + (c.b - c.a) * 0.62;
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    document.querySelectorAll("[data-c]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.c === k));
    svg.textContent = "";
    const R = repere(svg, c.X, c.Y, [36, 884, 16, 470]), { sx, sy } = R;
    const tracer = (u, v, coul, w, op = 1) => { if (v <= u) return; let d = ""; for (let i = 0; i <= 160; i++) { const x = u + (v - u) * i / 160; d += (i ? "L" : "M") + sx(x).toFixed(1) + "," + sy(c.f(x)).toFixed(1); }
      svg.appendChild(el("path", { d, fill: "none", stroke: coul, "stroke-width": w, opacity: op, "stroke-linecap": "round" })); };
    tracer(c.a, c.b, "var(--discret)", 3, 0.35);
    let morceaux;
    if (mode === "var") {
      morceaux = c.E.slice(0, -1).map((p, i) => [p[0], c.E[i + 1][0], c.E[i + 1][1] > p[1]]);
    } else {
      const b = [c.a, ...c.Z, c.b];
      morceaux = b.slice(0, -1).map((u, i) => [u, b[i + 1], c.f((u + b[i + 1]) / 2) > 0]);
      // aires colorées entre la courbe et l'axe, jusqu'à M
      morceaux.forEach(([u, v, pos]) => { const w = Math.min(v, xm); if (w <= u) return; let d = `M${sx(u)},${sy(0)}`;
        for (let i = 0; i <= 120; i++) { const x = u + (w - u) * i / 120; d += `L${sx(x).toFixed(1)},${sy(c.f(x)).toFixed(1)}`; }
        d += `L${sx(w)},${sy(0)}Z`; svg.appendChild(el("path", { d, fill: pos ? "var(--hausse-fond)" : "var(--baisse-fond)" })); });
    }
    morceaux.forEach(([u, v, pos]) => tracer(u, Math.min(v, xm), pos ? "var(--hausse)" : "var(--baisse)", 5.5));
    // repères atteints : extremums (variations) ou zéros (signe)
    if (mode === "var") c.E.forEach(([px, py], i) => { if (px > xm + 1e-9) return; const bord = i === 0 || i === c.E.length - 1;
      const max = !bord && py > c.E[i - 1][1];
      svg.appendChild(el("circle", { cx: sx(px), cy: sy(py), r: 7, fill: bord ? "var(--encre)" : "var(--violet)", stroke: "var(--carte)", "stroke-width": 2 }));
      if (!bord) svg.appendChild(el("text", { x: sx(px), y: sy(py) + (max ? -16 : 30), "text-anchor": "middle", "font-size": 15, "font-weight": 600, fill: "var(--violet)", "font-family": "var(--ui)", stroke: "var(--carte)", "stroke-width": 5, "paint-order": "stroke" }, max ? "maximum" : "minimum")); });
    else c.Z.forEach(z => { if (z <= xm) svg.appendChild(el("circle", { cx: sx(z), cy: sy(0), r: 7, fill: "var(--encre)", stroke: "var(--carte)", "stroke-width": 2 })); });
    // point M
    const ym = c.f(xm);
    svg.appendChild(el("line", { x1: sx(xm), x2: sx(xm), y1: sy(ym), y2: sy(0), stroke: "var(--discret)", "stroke-width": 1.5, "stroke-dasharray": "4 5" }));
    svg.appendChild(el("circle", { cx: sx(xm), cy: sy(ym), r: 12, fill: "var(--encre)", stroke: "var(--carte)", "stroke-width": 3 }));
    svg.appendChild(el("text", { x: sx(xm) + 14, y: sy(ym) - 14, "font-family": "var(--math)", "font-style": "italic", "font-size": 22, fill: "var(--encre)", stroke: "var(--carte)", "stroke-width": 5, "paint-order": "stroke" }, "M"));
    const zone = el("rect", { x: 36, y: 16, width: 848, height: 454, fill: "transparent", style: "cursor:ew-resize" }); svg.appendChild(zone);
    glisser(svg, zone, p => { xm = Math.max(c.a, Math.min(c.b, R.ix(p.x))); dessine(); });
    tableau(c, morceaux);
    // constat
    const ici = morceaux.find(([u, v]) => xm >= u && xm <= v + 1e-9) || morceaux.at(-1);
    $("constat").innerHTML = mode === "var"
      ? (ici[2] ? `Sur [${nb(ici[0])} ; ${nb(ici[1])}], <span class="m">f</span> est <b style="color:var(--hausse)">croissante</b> : la courbe monte.` : `Sur [${nb(ici[0])} ; ${nb(ici[1])}], <span class="m">f</span> est <b style="color:var(--baisse)">décroissante</b> : la courbe descend.`)
      : (Math.abs(ym) < 0.03 ? `<span class="m">f</span>(<span class="m">x</span>) = 0 : la courbe coupe l'axe des abscisses.` : ym > 0 ? `<span class="m">f</span>(<span class="m">x</span>) <b style="color:var(--hausse)">&gt; 0</b> : la courbe est au-dessus de l'axe.` : `<span class="m">f</span>(<span class="m">x</span>) <b style="color:var(--baisse)">&lt; 0</b> : la courbe est en dessous de l'axe.`);
  }
  // tableau de variations ou de signes, rempli jusqu'à l'abscisse de M
  function tableau(c, morceaux) {
    tab.textContent = "";
    const G = 120, D = 880, h1 = 44, h2 = mode === "var" ? 120 : 56;
    const bornes = [morceaux[0][0], ...morceaux.map(m => m[1])];
    const px = i => G + 40 + i / (bornes.length - 1) * (D - G - 80);
    tab.setAttribute("viewBox", `0 0 900 ${h1 + h2 + 4}`);
    tab.appendChild(el("rect", { x: 2, y: 2, width: 896, height: h1 + h2, fill: "none", stroke: "var(--encre)", "stroke-width": 1.5 }));
    tab.appendChild(el("line", { x1: 2, x2: 898, y1: 2 + h1, y2: 2 + h1, stroke: "var(--encre)", "stroke-width": 1.2 }));
    tab.appendChild(el("line", { x1: G, x2: G, y1: 2, y2: 2 + h1 + h2, stroke: "var(--encre)", "stroke-width": 1.2 }));
    const t = (x, y, s, o = {}) => tab.appendChild(el("text", Object.assign({ x, y, "text-anchor": "middle", "font-size": 19, "font-family": "var(--math)", fill: "var(--encre)" }, o), s));
    t(G / 2, 2 + h1 / 2 + 7, "x", { "font-style": "italic" });
    const lab = el("text", { x: G / 2, y: 2 + h1 + h2 / 2 + 7, "text-anchor": "middle", "font-size": 19, "font-family": "var(--math)", fill: "var(--encre)" });
    lab.appendChild(el("tspan", { "font-style": "italic" }, "f")); lab.appendChild(el("tspan", {}, mode === "var" ? "" : "(")); lab.appendChild(el("tspan", { "font-style": "italic" }, mode === "var" ? "" : "x")); lab.appendChild(el("tspan", {}, mode === "var" ? "" : ")"));
    tab.appendChild(lab);
    bornes.forEach((b, i) => { if (b <= xm + 1e-9) t(px(i), 2 + h1 / 2 + 7, nb(b)); });
    if (mode === "var") {
      const yv = v => v > (Math.min(...c.E.map(p => p[1])) + Math.max(...c.E.map(p => p[1]))) / 2;
      c.E.forEach(([bx, by], i) => { if (bx > xm + 1e-9) return; t(px(i), yv(by) ? 2 + h1 + 26 : 2 + h1 + h2 - 10, fr(by), { fill: "var(--violet)", "font-weight": 600 }); });
      morceaux.forEach(([u, v, pos], i) => { if (xm <= u) return; const fin = Math.min(1, (xm - u) / (v - u));
        const x1 = px(i) + 22, x2 = px(i + 1) - 22, y1 = pos ? 2 + h1 + h2 - 30 : 2 + h1 + 34, y2 = pos ? 2 + h1 + 34 : 2 + h1 + h2 - 30;
        const xe = x1 + (x2 - x1) * fin, ye = y1 + (y2 - y1) * fin, coul = pos ? "var(--hausse)" : "var(--baisse)";
        tab.appendChild(el("line", { x1, y1, x2: xe, y2: ye, stroke: coul, "stroke-width": 3.5 }));
        if (fin === 1) { const a = Math.atan2(y2 - y1, x2 - x1), L = 13;
          tab.appendChild(el("path", { d: `M${x2},${y2} L${x2 - L * Math.cos(a - .4)},${y2 - L * Math.sin(a - .4)} L${x2 - L * Math.cos(a + .4)},${y2 - L * Math.sin(a + .4)}Z`, fill: coul })); } });
    } else {
      bornes.forEach((b, i) => { if (i > 0 && i < bornes.length - 1 && b <= xm) { tab.appendChild(el("line", { x1: px(i), x2: px(i), y1: 2 + h1, y2: 2 + h1 + h2, stroke: "var(--encre)", "stroke-dasharray": "3 4" })); t(px(i), 2 + h1 + h2 / 2 + 7, "0", { "font-weight": 600, stroke: "var(--carte)", "stroke-width": 6, "paint-order": "stroke" }); } });
      morceaux.forEach(([u, v, pos], i) => { if (xm <= u + 1e-9) return; t((px(i) + px(i + 1)) / 2, 2 + h1 + h2 / 2 + 9, pos ? "+" : "−", { fill: pos ? "var(--hausse)" : "var(--baisse)", "font-size": 26, "font-weight": 600, "font-family": "var(--ui)" }); });
    }
  }
  dessine();

})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
