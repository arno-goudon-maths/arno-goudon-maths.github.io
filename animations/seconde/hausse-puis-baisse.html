<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Hausse puis baisse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Notations du cours (chapitre 2, 5.1) : V_i →×CM_1→ V →×CM_2→ V_f, CM_g = CM_1 × CM_2, t_g = CM_g − 1.
   Hausse en bleu, baisse en orange. */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --hausse: #1a56db; --baisse: #f07800; --neutre: #8a94a3; --rouge: #e0161b;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #2a313b; --hausse: #6fa3f0; --baisse: #ff9a3c; --neutre: #7d8796; --rouge: #ff5a5f; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #2a313b; --hausse: #6fa3f0; --baisse: #ff9a3c; --neutre: #7d8796; --rouge: #ff5a5f; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.barre { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
button { font: inherit; font-size: 14px; font-weight: 500; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--hausse); outline-offset: 2px; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.poignee { cursor: ns-resize; }
.constat { font-family: var(--math); font-size: clamp(17px, 2.4vw, 22px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 2 · Proportions et évolutions</span>
  <h1>Hausse puis baisse</h1>
  <p class="chapeau">Un prix de 100 € subit deux évolutions successives. Faites glisser le haut des deux dernières barres.</p>
  <div class="barre"><button type="button" id="contraire">Même taux, sens contraire</button><button type="button" id="raz">Revenir à +20 % puis −20 %</button></div>
  <div class="figure"><svg id="g" viewBox="0 0 900 520" role="img" aria-label="Trois barres : valeur initiale, après la première évolution, après la seconde"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const svg = $("g"), BAS = 440, ECH = 1.55;      // 1 € = 1,55 px ; 0 € en bas
  let t1 = 20, t2 = -20;                           // taux en %, entiers
  const VI = 100;
  const nb = x => (Math.round(x * 100) / 100).toString().replace(".", ",");
  const taux = t => (t > 0 ? "+" : t < 0 ? "−" : "") + nb(Math.abs(t)) + " %";
  const coul = t => t > 0 ? "var(--hausse)" : t < 0 ? "var(--baisse)" : "var(--neutre)";

  function dessin() {
    svg.textContent = "";
    const V1 = VI * (1 + t1 / 100), V2 = V1 * (1 + t2 / 100);
    const X = [150, 450, 750], W = 120;
    // graduations
    for (let v = 0; v <= 260; v += 20) {
      const y = BAS - v * ECH;
      svg.appendChild(el("line", { x1: 60, y1: y, x2: 860, y2: y, stroke: "var(--grille)", "stroke-width": v === 0 ? 2 : 1 }));
      if (v % 40 === 0) svg.appendChild(el("text", { x: 52, y: y + 5, "text-anchor": "end", "font-size": 13, fill: "var(--discret)" }, v));
    }
    // niveau de départ en pointillés
    svg.appendChild(el("line", { x1: 60, y1: BAS - VI * ECH, x2: 860, y2: BAS - VI * ECH, stroke: "var(--encre)", "stroke-width": 1.5, "stroke-dasharray": "6 6", opacity: 0.55 }));
    const barres = [[VI, "var(--neutre)", "Prix initial"], [V1, coul(t1), "Après la 1re évolution"], [V2, coul(t2), "Prix final"]];
    barres.forEach(([v, c, nom], i) => {
      const h = v * ECH;
      svg.appendChild(el("rect", { x: X[i] - W / 2, y: BAS - h, width: W, height: h, fill: c, opacity: i === 0 ? 0.55 : 0.85, rx: 4 }));
      svg.appendChild(el("text", { x: X[i], y: BAS - h - 12, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 22, fill: "var(--encre)" }, nb(v) + " €"));
      svg.appendChild(el("text", { x: X[i], y: BAS + 28, "text-anchor": "middle", "font-size": 14, fill: "var(--discret)" }, nom));
    });
    // flèches ×CM
    [[t1, 0], [t2, 1]].forEach(([t, i]) => {
      const xa = X[i] + W / 2 + 10, xb = X[i + 1] - W / 2 - 10, y = 70, c = coul(t);
      svg.appendChild(el("line", { x1: xa, y1: y, x2: xb - 10, y2: y, stroke: c, "stroke-width": 2.5 }));
      svg.appendChild(el("path", { d: `M${xb},${y} l-14,-7 l0,14 Z`, fill: c }));
      svg.appendChild(el("text", { x: (xa + xb) / 2, y: y - 12, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 20, fill: c }, "× " + nb(1 + t / 100)));
      svg.appendChild(el("text", { x: (xa + xb) / 2, y: y + 26, "text-anchor": "middle", "font-size": 15, fill: c }, taux(t)));
    });
    // poignées
    [[V1, 1], [V2, 2]].forEach(([v, i]) => {
      const h = el("rect", { x: X[i] - W / 2 - 6, y: BAS - v * ECH - 7, width: W + 12, height: 14, rx: 7, fill: "var(--encre)", opacity: 0.8, class: "poignee" });
      svg.appendChild(h);
      glisse(h, p => {
        const val = Math.max(10, Math.min(260, (BAS - p.y) / ECH));
        if (i === 1) { t1 = Math.max(-90, Math.min(160, Math.round((val / VI - 1) * 100))); }
        else { const base = VI * (1 + t1 / 100); t2 = Math.max(-90, Math.round((val / base - 1) * 100)); if (base * (1 + t2 / 100) > 260) t2 = Math.floor((260 / base - 1) * 100); }
      });
    });
    const CMg = (1 + t1 / 100) * (1 + t2 / 100), tg = Math.round((CMg - 1) * 10000) / 100;
    let fin;
    if (Math.abs(tg) < 1e-9) fin = "on revient exactement au prix de départ.";
    else if (t1 === -t2) fin = `on ne revient pas au départ : ${tg < 0 ? "baisse" : "hausse"} globale de ${nb(Math.abs(tg))} %.`;
    else fin = `soit une évolution globale de ${taux(tg)}.`;
    $("constat").innerHTML = `CM<sub>g</sub> = ${nb(1 + t1 / 100)} × ${nb(1 + t2 / 100)} = ${nb(Math.round(CMg * 10000) / 10000)} : ${fin}`;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return { x: (evt.clientX - r.left) * 900 / r.width, y: (evt.clientY - r.top) * 520 / r.height }; }
  function glisse(node, maj) {
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { maj(point(ev)); dessin(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  $("contraire").addEventListener("click", () => { t2 = -t1; if (t2 < -90) t2 = -90; dessin(); });
  $("raz").addEventListener("click", () => { t1 = 20; t2 = -20; dessin(); });
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
