<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>L'enclos et le drapeau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Deux problèmes du TD3 de 2nde (enclos contre un mur, drapeau et sa croix) : à gauche la figure qui change avec x,
   à droite la courbe et son point. Une vue par ancre : #enclos, #drapeau (QR codes à côté des exercices). */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --rouge: #e0161b; --courbe: #1a56db; --orange: #f07800; --violet: #7c3aed; --herbe: #dff0d2; --mur: #c9ced8; --gris: #cfd4dc;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --rouge: #ff4d52; --courbe: #6aa0ff; --orange: #ffa133; --violet: #b794f6; --herbe: #23331c; --mur: #4a5260; --gris: #3a414c; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --rouge: #ff4d52; --courbe: #6aa0ff; --orange: #ffa133; --violet: #b794f6; --herbe: #23331c; --mur: #4a5260; --gris: #3a414c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.page > * { min-width: 0; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); padding-right: 150px; }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 70ch; }
.m { font-family: var(--math); font-style: italic; }
.onglets { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; font-weight: 500; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); color: var(--encre); cursor: pointer; }
button[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.barre { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.barre label { font-size: 15px; }
.barre input[type=range] { flex: 1 1 260px; min-width: 0; accent-color: var(--orange); height: 28px; }
.barre output { font-family: var(--math); font-size: 20px; min-width: 5.5em; }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.constat { font-family: var(--math); font-size: clamp(18px, 2.5vw, 23px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--carte); border: 1.5px solid var(--filet); min-height: 1.6em; }
.constat.fort { border-color: var(--rouge); }
details { font-size: 14px; color: var(--discret); }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 3 · Modéliser une situation par une fonction</span>
  <h1 id="titre">L'enclos contre le mur</h1>
  <p class="chapeau" id="chapeau"></p>
  <div class="onglets" role="group" aria-label="Problème">
    <button type="button" id="b-enclos" aria-pressed="true">L'enclos</button>
    <button type="button" id="b-drapeau" aria-pressed="false">Le drapeau</button>
  </div>
  <div class="barre">
    <label for="rx">Faire varier <span class="m">x</span></label>
    <input id="rx" type="range" min="0" max="10" step="0.1" value="3">
    <output id="ox"></output>
  </div>
  <div class="figure"><svg id="g" viewBox="0 0 960 470" role="img" aria-label="À gauche la figure, à droite la courbe et son point"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
  <details><summary>Pour aller plus loin</summary><p id="plus"></p></details>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = (v, d = 1) => (Math.abs(v) < 1e-9 ? 0 : v).toFixed(d).replace(".", ",").replace("-", "−");
  const svg = $("g");
  let vue = "enclos";

  // repère à droite : x de 0 à XMAX, y de 0 à YMAX
  const RX0 = 530, RX1 = 920, RY0 = 420, RY1 = 40;
  function repere(XMAX, YMAX, pasX, pasY, etX, etY, nomY) {
    const sx = x => RX0 + x / XMAX * (RX1 - RX0), sy = y => RY0 - y / YMAX * (RY0 - RY1);
    const g = el("g");
    for (let x = pasX; x <= XMAX + 1e-9; x += pasX) g.appendChild(el("line", { x1: sx(x), x2: sx(x), y1: RY1, y2: RY0, stroke: "var(--grille)" }));
    for (let y = pasY; y <= YMAX + 1e-9; y += pasY) g.appendChild(el("line", { x1: RX0, x2: RX1, y1: sy(y), y2: sy(y), stroke: "var(--grille)" }));
    g.appendChild(el("line", { x1: RX0, x2: RX1 + 14, y1: RY0, y2: RY0, stroke: "var(--encre)", "stroke-width": 1.6 }));
    g.appendChild(el("polygon", { points: `${RX1 + 22},${RY0} ${RX1 + 12},${RY0 - 5} ${RX1 + 12},${RY0 + 5}`, fill: "var(--encre)" }));
    g.appendChild(el("line", { x1: RX0, x2: RX0, y1: RY0, y2: RY1 - 12, stroke: "var(--encre)", "stroke-width": 1.6 }));
    g.appendChild(el("polygon", { points: `${RX0},${RY1 - 20} ${RX0 - 5},${RY1 - 10} ${RX0 + 5},${RY1 - 10}`, fill: "var(--encre)" }));
    for (let x = etX; x <= XMAX + 1e-9; x += etX) g.appendChild(el("text", { x: sx(x), y: RY0 + 20, "text-anchor": "middle", fill: "var(--discret)", "font-size": 14, "font-family": "var(--math)" }, fr(x, Number.isInteger(x) ? 0 : 1)));
    for (let y = etY; y <= YMAX + 1e-9; y += etY) g.appendChild(el("text", { x: RX0 - 8, y: sy(y) + 5, "text-anchor": "end", fill: "var(--discret)", "font-size": 14, "font-family": "var(--math)" }, y));
    g.appendChild(el("text", { x: RX0 - 8, y: RY0 + 18, "text-anchor": "end", fill: "var(--discret)", "font-size": 14, "font-family": "var(--math)" }, "0"));
    g.appendChild(el("text", { x: RX1 + 10, y: RY0 + 40, "text-anchor": "end", fill: "var(--encre)", "font-size": 15, "font-family": "var(--math)", "font-style": "italic" }, "x"));
    g.appendChild(el("text", { x: RX0 + 10, y: RY1 - 6, fill: "var(--encre)", "font-size": 15, "font-family": "var(--ui)" }, nomY));
    return { g, sx, sy };
  }
  const chemin = (f, a, b, sx, sy) => { let d = ""; for (let i = 0; i <= 160; i++) { const x = a + (b - a) * i / 160; d += (i ? " L " : "M ") + sx(x).toFixed(1) + " " + sy(f(x)).toFixed(1); } return d; };

  // ---------------------------------------------------------------- l'enclos
  const A = x => 20 * x - 2 * x * x;
  function enclos(x) {
    svg.replaceChildren();
    // figure : un mur en haut, l'enclos de x m sur 20 − 2x m (échelle 19 px par mètre)
    const k = 19, L = 20 - 2 * x, cx = 260, top = 90;
    svg.appendChild(el("rect", { x: 30, y: 40, width: 460, height: 400, fill: "var(--herbe)", rx: 8 }));
    svg.appendChild(el("rect", { x: 30, y: top - 22, width: 460, height: 22, fill: "var(--mur)" }));
    svg.appendChild(el("line", { x1: 30, x2: 490, y1: top, y2: top, stroke: "var(--encre)", "stroke-width": 3 }));
    svg.appendChild(el("text", { x: 260, y: top - 6, "text-anchor": "middle", fill: "var(--encre)", "font-size": 15, "font-family": "var(--ui)" }, "mur"));
    const x0 = cx - L * k / 2, x1 = cx + L * k / 2, y1 = top + x * k;
    if (L > 0 && x > 0) svg.appendChild(el("rect", { x: x0, y: top, width: x1 - x0, height: y1 - top, fill: "var(--orange)", opacity: .22 }));
    svg.appendChild(el("path", { d: `M ${x0} ${top} L ${x0} ${y1} L ${x1} ${y1} L ${x1} ${top}`, fill: "none", stroke: "var(--courbe)", "stroke-width": 4, "stroke-linejoin": "round" }));
    if (x > 0.6) {
      svg.appendChild(el("text", { x: x0 - 8, y: (top + y1) / 2 + 6, "text-anchor": "end", fill: "var(--courbe)", "font-size": 17, "font-family": "var(--math)" }, fr(x) + " m"));
      svg.appendChild(el("text", { x: x1 + 8, y: (top + y1) / 2 + 6, fill: "var(--courbe)", "font-size": 17, "font-family": "var(--math)" }, fr(x) + " m"));
    }
    svg.appendChild(el("text", { x: cx, y: y1 + 24, "text-anchor": "middle", fill: "var(--courbe)", "font-size": 17, "font-family": "var(--math)" }, fr(L) + " m"));
    if (L > 2 && x > 1.2) svg.appendChild(el("text", { x: cx, y: (top + y1) / 2 + 7, "text-anchor": "middle", fill: "var(--encre)", "font-size": 20, "font-weight": 600, "font-family": "var(--math)" }, fr(A(x)) + " m²"));
    svg.appendChild(el("text", { x: 46, y: 430, fill: "var(--discret)", "font-size": 14, "font-family": "var(--ui)" }, "grillage : " + fr(x) + " + " + fr(L) + " + " + fr(x) + " = 20 m"));
    // repère
    const r = repere(10, 60, 1, 5, 1, 10, "aire (m²)"); svg.appendChild(r.g);
    svg.appendChild(el("path", { d: chemin(A, 0, 10, r.sx, r.sy), fill: "none", stroke: "var(--courbe)", "stroke-width": 3 }));
    svg.appendChild(el("text", { x: r.sx(7.7) + 6, y: r.sy(A(7.7)) - 8, fill: "var(--courbe)", "font-size": 20, "font-style": "italic", "font-family": "var(--math)" }, "𝒞").appendChild(el("tspan", { "font-size": 13, dy: 5 }, "A")).parentNode);
    const px = r.sx(x), py = r.sy(A(x));
    svg.appendChild(el("line", { x1: px, x2: px, y1: py, y2: RY0, stroke: "var(--rouge)", "stroke-width": 2, "stroke-dasharray": "5 5" }));
    svg.appendChild(el("line", { x1: RX0, x2: px, y1: py, y2: py, stroke: "var(--rouge)", "stroke-width": 2, "stroke-dasharray": "5 5" }));
    svg.appendChild(el("circle", { cx: px, cy: py, r: 7, fill: "var(--rouge)", stroke: "var(--carte)", "stroke-width": 2 }));
    svg.appendChild(el("text", { x: RX0 + 8, y: py - 8, fill: "var(--rouge)", "font-size": 16, "font-weight": 600, "font-family": "var(--math)" }, fr(A(x)) + " m²"));
    let c = `x = ${fr(x)} m : l'enclos mesure ${fr(x)} m sur ${fr(L)} m, son aire est A(x) = ${fr(A(x))} m².`, fort = false;
    if (Math.abs(x - 5) < 0.05) { c = "x = 5 m : l'aire est la plus grande, 50 m² (enclos de 5 m sur 10 m)."; fort = true; }
    else if (Math.abs(x - 2) < 0.05 || Math.abs(x - 8) < 0.05) { c = `x = ${fr(x, 0)} m : l'aire vaut 32 m². Deux enclos différents ont cette aire !`; fort = true; }
    else if (x < 0.05 || x > 9.95) c = "Pas d'enclos du tout : l'aire est nulle.";
    return [c, fort];
  }

  // ---------------------------------------------------------------- le drapeau
  const C = x => 7 * x - x * x, R = x => x * x - 7 * x + 12;
  function drapeau(x) {
    svg.replaceChildren();
    // figure : drapeau de 4 m sur 3 m, une seule échelle (90 px par mètre)
    const k = 95, X0 = 70, Y0 = 110, W = 4 * k, H = 3 * k;
    svg.appendChild(el("rect", { x: X0, y: Y0, width: W, height: H, fill: "var(--gris)" }));
    svg.appendChild(el("rect", { x: X0 + W / 2 - x * k / 2, y: Y0, width: x * k, height: H, fill: "var(--courbe)", opacity: .75 }));
    svg.appendChild(el("rect", { x: X0, y: Y0 + H / 2 - x * k / 2, width: W, height: x * k, fill: "var(--courbe)", opacity: .75 }));
    svg.appendChild(el("rect", { x: X0, y: Y0, width: W, height: H, fill: "none", stroke: "var(--encre)", "stroke-width": 2.5 }));
    svg.appendChild(el("line", { x1: X0 - 14, x2: X0 - 14, y1: Y0 - 6, y2: Y0 + H + 40, stroke: "var(--discret)", "stroke-width": 5 }));
    svg.appendChild(el("text", { x: X0 + W / 2, y: Y0 + H + 30, "text-anchor": "middle", fill: "var(--encre)", "font-size": 16, "font-family": "var(--math)" }, "4 m"));
    svg.appendChild(el("text", { x: X0 + W + 10, y: Y0 + H / 2 + 6, fill: "var(--encre)", "font-size": 16, "font-family": "var(--math)" }, "3 m"));
    if (x > 0.05) svg.appendChild(el("text", { x: X0 + W / 2, y: Y0 - 10, "text-anchor": "middle", fill: "var(--courbe)", "font-size": 16, "font-family": "var(--math)" }, "x = " + fr(x) + " m"));
    svg.appendChild(el("text", { x: 70, y: 52, fill: "var(--courbe)", "font-size": 17, "font-family": "var(--math)" }, "croix : C(x) = " + fr(C(x)) + " m²"));
    svg.appendChild(el("text", { x: 70, y: 76, fill: "var(--orange)", "font-size": 17, "font-family": "var(--math)" }, "partie grise : A(x) = " + fr(R(x)) + " m²"));
    // repère : C (bleu) et A (orange, tirets longs)
    const r = repere(4, 13, 0.5, 1, 0.5, 2, "aire (m²)"); svg.appendChild(r.g);
    svg.appendChild(el("path", { d: chemin(C, 0, 3, r.sx, r.sy), fill: "none", stroke: "var(--courbe)", "stroke-width": 3 }));
    svg.appendChild(el("path", { d: chemin(R, 0, 3, r.sx, r.sy), fill: "none", stroke: "var(--orange)", "stroke-width": 3, "stroke-dasharray": "14 6" }));
    const nC = el("text", { x: r.sx(1.45) - 34, y: r.sy(C(1.45)) - 6, fill: "var(--courbe)", "font-size": 20, "font-style": "italic", "font-family": "var(--math)" }, "𝒞"); nC.appendChild(el("tspan", { "font-size": 13, dy: 5 }, "C")); svg.appendChild(nC);
    const nA = el("text", { x: r.sx(2.3) + 8, y: r.sy(R(2.3)) - 8, fill: "var(--orange)", "font-size": 20, "font-style": "italic", "font-family": "var(--math)" }, "𝒞"); nA.appendChild(el("tspan", { "font-size": 13, dy: 5 }, "A")); svg.appendChild(nA);
    const px = r.sx(x);
    svg.appendChild(el("line", { x1: px, x2: px, y1: Math.min(r.sy(C(x)), r.sy(R(x))), y2: RY0, stroke: "var(--rouge)", "stroke-width": 2, "stroke-dasharray": "5 5" }));
    svg.appendChild(el("circle", { cx: px, cy: r.sy(C(x)), r: 7, fill: "var(--courbe)", stroke: "var(--carte)", "stroke-width": 2 }));
    svg.appendChild(el("circle", { cx: px, cy: r.sy(R(x)), r: 7, fill: "var(--orange)", stroke: "var(--carte)", "stroke-width": 2 }));
    let c, fort = false;
    if (Math.abs(x - 1) < 0.05) { c = "x = 1 m : la croix et la partie grise ont la même aire, 6 m² chacune. Les deux courbes se coupent !"; fort = true; }
    else if (x < 1) c = `x = ${fr(x)} m : la croix (${fr(C(x))} m²) est plus petite que la partie grise (${fr(R(x))} m²).`;
    else c = `x = ${fr(x)} m : la croix (${fr(C(x))} m²) est plus grande que la partie grise (${fr(R(x))} m²).`;
    return [c, fort];
  }

  // ---------------------------------------------------------------- vues
  const VUES = {
    enclos: { titre: "L'enclos contre le mur", max: 10, x: 3, f: enclos,
      chapeau: "Avec 20 m de grillage, on borde un enclos rectangulaire contre un mur. On note x la longueur, en mètres, des deux côtés perpendiculaires au mur : l'aire est A(x) = 20x − 2x². Faites varier x.",
      plus: "Le côté parallèle au mur mesure 20 − 2x mètres, donc A(x) = x(20 − 2x) = 20x − 2x². La courbe monte jusqu'à son point le plus haut (5 ; 50) puis redescend : un enclos très étroit ou très plat a une petite aire." },
    drapeau: { titre: "Le drapeau et sa croix", max: 3, x: 0.5, f: drapeau,
      chapeau: "Un drapeau de 4 m sur 3 m est traversé par une croix de largeur x. Aire de la croix : C(x) = 7x − x² ; aire de la partie grise : A(x) = x² − 7x + 12. Faites varier x.",
      plus: "La croix et la partie grise ont la même aire quand C(x) = A(x) : c'est l'abscisse du point d'intersection des deux courbes, x = 1. On vérifie : C(1) = 7 − 1 = 6 et A(1) = 1 − 7 + 12 = 6." }
  };
  function dessine() {
    const x = +$("rx").value;
    $("ox").textContent = "x = " + fr(x) + " m";
    const [c, fort] = VUES[vue].f(x);
    $("constat").textContent = c; $("constat").classList.toggle("fort", fort);
  }
  function choisir(v, garderX) {
    vue = v; const V = VUES[v];
    $("titre").textContent = V.titre; $("chapeau").textContent = V.chapeau; $("plus").textContent = V.plus;
    $("rx").max = V.max; if (!garderX) $("rx").value = V.x;
    $("b-enclos").setAttribute("aria-pressed", v === "enclos"); $("b-drapeau").setAttribute("aria-pressed", v === "drapeau");
    dessine();
  }
  $("b-enclos").addEventListener("click", () => { history.replaceState(null, "", "#enclos"); choisir("enclos"); });
  $("b-drapeau").addEventListener("click", () => { history.replaceState(null, "", "#drapeau"); choisir("drapeau"); });
  $("rx").addEventListener("input", dessine);
  const depuisAncre = () => choisir(location.hash === "#drapeau" ? "drapeau" : "enclos");
  window.addEventListener("hashchange", depuisAncre);
  depuisAncre();
})();
</script>
<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
