<style>
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e4e8ee;
  --courbe: #1f5fbf; --rouge: #e0161b; --rouge-fond: rgba(224, 22, 27, 0.10);
  --hausse: #1a56db; --baisse: #f07800; --hausse-fond: rgba(26, 86, 219, 0.20); --baisse-fond: rgba(240, 120, 0, 0.24);
  --orange: #e07000; --violet: #7c3aed; --gcourbe: #f07800;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --courbe: #6fa3f0; --rouge: #ff4d52; --rouge-fond: rgba(255, 77, 82, 0.14); --hausse: #6aa0ff; --baisse: #ffa133; --hausse-fond: rgba(106, 160, 255, 0.24); --baisse-fond: rgba(255, 161, 51, 0.26); --orange: #ffa53d; --violet: #b794f6; --gcourbe: #ffa133; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --courbe: #6fa3f0; --rouge: #ff4d52; --rouge-fond: rgba(255, 77, 82, 0.14); --hausse: #6aa0ff; --baisse: #ffa133; --hausse-fond: rgba(106, 160, 255, 0.24); --baisse-fond: rgba(255, 161, 51, 0.26); --orange: #ffa53d; --violet: #b794f6; --gcourbe: #ffa133; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

button[aria-pressed="true"] { border-color: var(--rouge); color: var(--rouge); box-shadow: inset 0 0 0 1.5px var(--rouge); }
button:focus-visible { outline: 3px solid var(--rouge); outline-offset: 2px; }

.constat b { font-weight: 600; }

</style>

<div class="page">
  <span class="niveau">Seconde · Automatismes de calcul · Inéquations</span>
  <h1>Résoudre graphiquement <span class="m">f</span>(<span class="m">x</span>) ≤ <span class="m">g</span>(<span class="m">x</span>)</h1>
  <p class="chapeau">Montez ou descendez la courbe orange de <span class="m">g</span> avec la glissière de droite. Les solutions sont les abscisses des points de la courbe bleue situés sous la courbe orange (ou au-dessus).</p>
  <div class="barre">
    <div class="groupe" role="group" aria-label="Inégalité"><button type="button" data-sens="≤"><span class="m">f</span>(<span class="m">x</span>) ≤ <span class="m">g</span>(<span class="m">x</span>)</button><button type="button" data-sens="<"><span class="m">f</span>(<span class="m">x</span>) &lt; <span class="m">g</span>(<span class="m">x</span>)</button><button type="button" data-sens="≥"><span class="m">f</span>(<span class="m">x</span>) ≥ <span class="m">g</span>(<span class="m">x</span>)</button><button type="button" data-sens=">"><span class="m">f</span>(<span class="m">x</span>) &gt; <span class="m">g</span>(<span class="m">x</span>)</button></div>
    <div class="groupe" role="group" aria-label="Couple de fonctions"><button type="button" data-c="0">Figure 1</button><button type="button" data-c="1">Figure 2</button><button type="button" data-c="2">Figure 3</button></div>
  </div>
  <div class="figure"><svg id="g" viewBox="0 0 960 606" role="img" aria-label="Résolution graphique de f(x) ≤ g(x)"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
  <p class="chapeau centre" id="note" style="font-size:13px;min-height:1.4em"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const fr = (x, d = 2) => { const r = Math.round(x * 10 ** d) / 10 ** d; return (Object.is(r, -0) ? 0 : r).toString().replace(".", ",").replace("-", "−"); };
  const entier = x => Math.abs(x - Math.round(x)) < 1e-9;
  const posSvg = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const pos = (svg, ev) => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  function glisser(svg, cible, maj) {
    cible.addEventListener("pointerdown", e => {
      e.preventDefault(); const y0 = pos(svg, e).y, d0 = dec;
      const bouge = ev => maj(pos(svg, ev).y - y0, d0);
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  // courbe lisse passant par des points, sans dépassement (Fritsch-Carlson)
  function lisse(P) {
    const n = P.length, h = [], s = [], m = [];
    for (let i = 0; i < n - 1; i++) { h[i] = P[i + 1][0] - P[i][0]; s[i] = (P[i + 1][1] - P[i][1]) / h[i]; }
    m[0] = s[0]; m[n - 1] = s[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = s[i - 1] * s[i] <= 0 ? 0 : 3 * (h[i - 1] + h[i]) / ((2 * h[i] + h[i - 1]) / s[i - 1] + (h[i] + 2 * h[i - 1]) / s[i]);
    return x => { let i = 0; while (i < n - 2 && x > P[i + 1][0]) i++;
      const t = (x - P[i][0]) / h[i], t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * P[i][1] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * P[i + 1][1] + (t3 - t2) * h[i] * m[i + 1]; };
  }
  function repere(g, X, Y, cadre) {
    const [G, D, Hh, B] = cadre;
    const sx = x => G + (x - X[0]) / (X[1] - X[0]) * (D - G), sy = y => B - (y - Y[0]) / (Y[1] - Y[0]) * (B - Hh);
    for (let x = Math.ceil(X[0]); x <= X[1]; x++) g.appendChild(el("line", { x1: sx(x), x2: sx(x), y1: Hh, y2: B, stroke: "var(--grille)" }));
    for (let y = Math.ceil(Y[0]); y <= Y[1]; y++) g.appendChild(el("line", { x1: G, x2: D, y1: sy(y), y2: sy(y), stroke: "var(--grille)" }));
    g.appendChild(el("line", { x1: G, x2: D, y1: sy(0), y2: sy(0), stroke: "var(--encre)", "stroke-width": 1.6 }));
    g.appendChild(el("line", { x1: sx(0), x2: sx(0), y1: Hh, y2: B, stroke: "var(--encre)", "stroke-width": 1.6 }));
    const t = { x: {}, y: {} };
    for (let x = Math.ceil(X[0]); x <= X[1]; x++) { const e = el("text", { x: x ? sx(x) : sx(0) - 9, y: sy(0) + 20, "text-anchor": "middle", "font-size": 14, fill: "var(--discret)", "font-family": "var(--ui)" }, String(x).replace("-", "−")); g.appendChild(e); t.x[x] = e; }
    for (let y = Math.ceil(Y[0]); y <= Y[1]; y++) if (y) { const e = el("text", { x: sx(0) - 8, y: sy(y) + 5, "text-anchor": "end", "font-size": 14, fill: "var(--discret)", "font-family": "var(--ui)" }, String(y).replace("-", "−")); g.appendChild(e); t.y[y] = e; }
    return { sx, sy, t, ky: (B - Hh) / (Y[1] - Y[0]) };
  }

  // trois couples (f, g) définis sur un même intervalle [a ; b] ; on décale g verticalement
  const C = [
    { F: [[-1,0],[0,-1],[1,-1],[2,0],[3,2],[4,5]], G: [[-1,-2],[4,3]], X: [-2, 5], Y: [-3, 6] },
    { F: [[-3,-1.5],[-2,0],[-1,2],[0,1],[1,0],[2,2],[3,4],[4,3],[5,2]], G: [[-3,-0.5],[5,3.5]], X: [-4, 6], Y: [-3, 5] },
    { F: [[-2,3],[-1,1],[0,0],[1,-0.5],[2,0],[3,1],[4,3]], G: [[-2,-1],[-1,1],[0,2],[1,2.5],[2,2],[3,1],[4,-1]], X: [-3, 5], Y: [-3, 5] }
  ];
  C.forEach(c => { c.f = lisse(c.F); c.g0 = lisse(c.G); c.a = c.F[0][0]; c.b = c.F.at(-1)[0]; });
  let k = 0, sens = "≤", dec = 0;
  const svg = $("g");
  document.querySelectorAll("[data-sens]").forEach(b => b.addEventListener("click", () => { sens = b.dataset.sens; dessine(); }));
  document.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { k = +b.dataset.c; dec = 0; dessine(); }));
  const strict = () => sens === "<" || sens === ">";
  const h = (c, x) => c.f(x) - (c.g0(x) + dec);
  const ok = (c, x) => { const v = h(c, x); return (sens === "≤" || sens === "<") ? v <= 1e-9 : v >= -1e-9; };
  const rond = u => Math.abs(u - Math.round(u)) < 0.02 ? Math.round(u) : u;
  function racines(c) {
    const N = 3000, R = []; let xp = c.a, vp = h(c, c.a);
    if (Math.abs(vp) < 1e-9) R.push(c.a);
    for (let i = 1; i <= N; i++) {
      const x = c.a + (c.b - c.a) * i / N, v = h(c, x);
      if (Math.abs(v) < 1e-9) R.push(x);
      else if (vp * v < 0 && Math.abs(vp) > 1e-9) { let lo = xp, hi = x; for (let j = 0; j < 50; j++) { const m = (lo + hi) / 2; h(c, m) * h(c, lo) > 0 ? lo = m : hi = m; } R.push((lo + hi) / 2); }
      xp = x; vp = v;
    }
    return R.map(rond).filter((r, i, t) => i === 0 || Math.abs(r - t[i - 1]) > 1e-6);
  }
  function intervalles(c, R) {
    const N = 3000, res = []; let deb = null, vp = ok(c, c.a);
    if (vp) deb = c.a;
    for (let i = 1; i <= N; i++) {
      const x = c.a + (c.b - c.a) * i / N, v = ok(c, x);
      if (v && !vp) deb = R.find(r => r <= x + 1e-9 && r >= x - (c.b - c.a) / N - 1e-9) ?? x;
      if (!v && vp) { res.push([deb, R.find(r => r <= x + 1e-9 && r >= x - (c.b - c.a) / N - 1e-9) ?? x]); deb = null; }
      vp = v;
    }
    if (vp) res.push([deb, c.b]);
    return res.map(([u, v]) => [rond(u), rond(v)]).filter(([u, v]) => v - u > 1e-6 || !strict());
  }
  function dessine() {
    const c = C[k];
    document.querySelectorAll("[data-sens]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sens === sens));
    document.querySelectorAll("[data-c]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.c === k));
    svg.textContent = "";
    const Rp = repere(svg, c.X, c.Y, [36, 884, 16, 590]), { sx, sy } = Rp;
    const R = racines(c), S = intervalles(c, R);
    const ferme = x => !strict() || ((x === c.a || x === c.b) && !R.includes(x));
    S.forEach(([u, v]) => svg.appendChild(el("rect", { x: sx(u), y: 16, width: Math.max(2, sx(v) - sx(u)), height: 574, fill: "var(--rouge-fond)", opacity: .7 })));
    const trace = (fn, u, v, n) => { let d = ""; for (let i = 0; i <= n; i++) { const x = u + (v - u) * i / n; d += (i ? "L" : "M") + sx(x).toFixed(1) + "," + sy(fn(x)).toFixed(1); } return d; };
    const g = x => c.g0(x) + dec;
    svg.appendChild(el("path", { d: trace(g, c.a, c.b, 400), fill: "none", stroke: "var(--gcourbe)", "stroke-width": 4, "stroke-dasharray": "16 7" }));
    [c.a, c.b].forEach(x => svg.appendChild(el("circle", { cx: sx(x), cy: sy(g(x)), r: 5, fill: "var(--gcourbe)" })));
    svg.appendChild(el("path", { d: trace(c.f, c.a, c.b, 500), fill: "none", stroke: "var(--courbe)", "stroke-width": 3.5, opacity: .45 }));
    S.forEach(([u, v]) => { if (v > u) svg.appendChild(el("path", { d: trace(c.f, u, v, 200), fill: "none", stroke: "var(--courbe)", "stroke-width": 5.5, "stroke-linecap": "round" })); });
    [c.a, c.b].forEach(x => svg.appendChild(el("circle", { cx: sx(x), cy: sy(c.f(x)), r: 5, fill: "var(--courbe)" })));
    const y0 = sy(0);
    // points d'intersection et lecture de leur abscisse
    R.forEach(r => { svg.appendChild(el("line", { x1: sx(r), x2: sx(r), y1: sy(c.f(r)), y2: y0, stroke: "var(--rouge)", "stroke-width": 2.5, "stroke-dasharray": "7 5" }));
      svg.appendChild(el("circle", { cx: sx(r), cy: sy(c.f(r)), r: 6.5, fill: "var(--violet)", stroke: "var(--carte)", "stroke-width": 2 })); });
    // noms des courbes, placés du côté où l'autre courbe ne passe pas
    const nom = (txt, x, fn, autre, col) => { const dessus = fn(x) >= autre(x); const e = el("text", { x: sx(x), y: sy(fn(x)) + (dessus ? -16 : 30), "text-anchor": "middle", "font-family": "var(--math)", "font-size": 22, "font-style": "italic", fill: col, stroke: "var(--carte)", "stroke-width": 6, "paint-order": "stroke" }, txt); svg.appendChild(e); };
    nom("𝒞f", c.a + 0.45, c.f, g, "var(--courbe)"); nom("𝒞g", c.b - 0.45, g, c.f, "var(--gcourbe)");
    // solutions sur l'axe : noir épais, crochets dessinés
    S.forEach(([u, v]) => {
      if (u === v) { svg.appendChild(el("circle", { cx: sx(u), cy: y0, r: 7, fill: "var(--encre)" })); return; }
      svg.appendChild(el("line", { x1: sx(u), x2: sx(v), y1: y0, y2: y0, stroke: "var(--encre)", "stroke-width": 8 }));
      [[u, 1], [v, -1]].forEach(([x, s]) => { const p = sx(x), o = ferme(x) ? s : -s;
        svg.appendChild(el("path", { d: `M${p + 7 * o},${y0 - 13} H${p} V${y0 + 13} H${p + 7 * o}`, fill: "none", stroke: "var(--encre)", "stroke-width": 3.5 })); });
    });
    Object.values(Rp.t.x).forEach(t => { t.setAttribute("y", y0 + 32); t.setAttribute("stroke", "var(--carte)"); t.setAttribute("stroke-width", 4); t.setAttribute("paint-order", "stroke"); svg.appendChild(t); });
    Object.values(Rp.t.y).forEach(t => { t.setAttribute("stroke", "var(--carte)"); t.setAttribute("stroke-width", 4); t.setAttribute("paint-order", "stroke"); svg.appendChild(t); });
    // glissière verticale, sur le côté du graphique
    const xt = 926, haut = 40, bas = 566, pos = v => bas - (v + 3) / 6 * (bas - haut), val = p => Math.max(-3, Math.min(3, Math.round(((bas - p) / (bas - haut) * 6 - 3) * 2) / 2));
    svg.appendChild(el("line", { x1: xt, x2: xt, y1: haut, y2: bas, stroke: "var(--filet)", "stroke-width": 6, "stroke-linecap": "round" }));
    svg.appendChild(el("line", { x1: xt - 9, x2: xt + 9, y1: pos(0), y2: pos(0), stroke: "var(--discret)", "stroke-width": 2 }));
    svg.appendChild(el("circle", { cx: xt, cy: pos(dec), r: 15, fill: "var(--gcourbe)", stroke: "var(--carte)", "stroke-width": 3 }));
    svg.appendChild(el("path", { d: `M${xt},${pos(dec) - 9} l-5,6 h10 z M${xt},${pos(dec) + 9} l-5,-6 h10 z`, fill: "var(--carte)" }));
    svg.appendChild(el("text", { x: xt, y: 24, "text-anchor": "middle", "font-family": "var(--math)", "font-size": 20, "font-style": "italic", fill: "var(--gcourbe)" }, "g"));
    const zone = el("rect", { x: 896, y: 10, width: 60, height: 590, fill: "transparent", style: "cursor:ns-resize" });
    svg.appendChild(zone);
    zone.addEventListener("pointerdown", e => { e.preventDefault();
      const maj = ev => { const v = val(posSvg(ev).y); if (v !== dec) { dec = v; dessine(); } };
      maj(e); const fin = () => { window.removeEventListener("pointermove", maj); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", maj); window.addEventListener("pointerup", fin); });
    // constat
    const nb = x => fr(x, 1), arrondi = S.some(([u, v]) => !entier(u) || !entier(v));
    const br = (x, g) => g ? (ferme(x) ? "[" : "]") : (ferme(x) ? "]" : "[");
    const txt = S.map(([u, v]) => u === v ? `{${nb(u)}}` : `${br(u, true)}${nb(u)} ; ${nb(v)}${br(v, false)}`).join(" ∪ ");
    const sym = { "≤": "≤", "<": "&lt;", "≥": "≥", ">": "&gt;" }[sens];
    $("constat").innerHTML = `<span class="m">f</span>(<span class="m">x</span>) ${sym} <span class="m">g</span>(<span class="m">x</span>) &nbsp;⟺&nbsp; ` + (S.length ? `<span class="m">x</span> ∈ <b>${txt}</b>` : `<b>aucune solution</b>`);
    $("note").textContent = arrondi ? "Les bornes non entières sont des valeurs arrondies au dixième, lues sur le graphique." : "";
  }
  window.addEventListener("keydown", e => { if (e.key === "ArrowUp" || e.key === "ArrowDown") { dec = Math.max(-3, Math.min(3, dec + (e.key === "ArrowUp" ? .5 : -.5))); e.preventDefault(); dessine(); } });
  dessine();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
