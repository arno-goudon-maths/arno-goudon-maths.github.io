<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Produit par un réel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Cours, chapitre 4, « Produit d'un vecteur par un nombre réel » : u en bleu.
   k u : violet si k > 0 (même sens), orange si k < 0 (sens contraire). */
:root {
  --papier: #f7f8fa; --carte: #ffffff; --encre: #1b1f24; --discret: #5d6672; --filet: #d9dee5; --grille: #e2e6ec;
  --u: #1f5fd6; --pos: #7c3aed; --neg: #f07800;
  --math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --u: #6fa3f0; --pos: #b48cff; --neg: #ff9a3c; color-scheme: dark; }
}
:root[data-theme="dark"] { --papier: #14171c; --carte: #1c2027; --encre: #e8ebf0; --discret: #9aa4b1; --filet: #313844; --grille: #262c35; --u: #6fa3f0; --pos: #b48cff; --neg: #ff9a3c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--ui); font-size: 15px; line-height: 1.5; margin: 0; }
.page { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 14px; }
.niveau { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--discret); }
h1 { font-family: var(--math); font-weight: 600; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
.chapeau { margin: 0; color: var(--discret); max-width: 68ch; }
.vec { font-family: var(--math); font-style: italic; position: relative; display: inline-block; padding-top: .18em; }
.vec::before { content: ""; position: absolute; left: .02em; right: -.06em; top: .02em; height: 0; border-top: 1.5px solid currentColor; }
.vec::after { content: ""; position: absolute; right: -.1em; top: -.16em; border: .2em solid transparent; border-left: .32em solid currentColor; border-right: 0; }
.u { color: var(--u); } .pos { color: var(--pos); } .neg { color: var(--neg); }
.figure { background: var(--carte); border: 1px solid var(--filet); border-radius: 10px; padding: 6px; touch-action: none; }
svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.poignee { cursor: grab; } .poignee:active { cursor: grabbing; }
.constat { font-size: clamp(16px, 2.2vw, 20px); text-align: center; margin: 0; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--filet); background: var(--carte); }
.constat .k { font-family: var(--math); font-size: 1.15em; }
</style>

<div class="page">
  <span class="niveau">Seconde · Chapitre 4 · Vecteurs du plan</span>
  <h1>Produit d'un vecteur par un réel</h1>
  <p class="chapeau">Faites glisser l'extrémité du vecteur <span class="vec u">u</span>, puis celle du vecteur <span class="m"><i>k</i></span><span class="vec pos">u</span> le long de sa droite pour changer le réel <i>k</i>.</p>
  <div class="figure"><svg id="g" viewBox="0 0 900 560" role="img" aria-label="Un vecteur u et le vecteur k u sur un quadrillage"></svg></div>
  <p class="constat" id="constat" aria-live="polite"></p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const NX = 18, NY = 11, U = 900 / (NX + 1), OX = U / 2, OY = (560 - NY * U) / 2;
  const px = x => OX + x * U, py = y => OY + (NY - y) * U;
  const svg = $("g");
  const A = { x: 2, y: 8 };                 // origine de u
  const B = { x: 9, y: 5 };                 // origine de k u
  let u = { dx: 2, dy: 1 }, k = 2;
  const nb = x => (Math.round(x * 100) / 100).toString().replace(".", ",").replace("-", "−");

  function fleche(x1, y1, x2, y2, c, ep) {
    const L = Math.hypot(x2 - x1, y2 - y1);
    if (L < 1) { svg.appendChild(el("circle", { cx: x1, cy: y1, r: 6, fill: c })); return; }
    const ux = (x2 - x1) / L, uy = (y2 - y1) / L, t = 18;
    svg.appendChild(el("line", { x1, y1, x2: x2 - ux * t * 0.8, y2: y2 - uy * t * 0.8, stroke: c, "stroke-width": ep, "stroke-linecap": "round" }));
    svg.appendChild(el("path", { d: `M${x2},${y2} L${x2 - ux * t - uy * t * 0.45},${y2 - uy * t + ux * t * 0.45} L${x2 - ux * t + uy * t * 0.45},${y2 - uy * t - ux * t * 0.45} Z`, fill: c }));
  }
  function nomVec(x, y, txt, c, prefixe) {
    const g = el("text", { x, y, "text-anchor": "middle", "font-family": "var(--math)", "font-style": "italic", "font-size": 24, fill: c });
    g.textContent = (prefixe || "") + txt;
    svg.appendChild(g);
    const w = 11, xx = x + (prefixe ? prefixe.length * 5.5 : 0);
    svg.appendChild(el("line", { x1: xx - w / 2, y1: y - 20, x2: xx + w / 2, y2: y - 20, stroke: c, "stroke-width": 1.5 }));
    svg.appendChild(el("path", { d: `M${xx + w / 2 + 4},${y - 20} l-6,-3.5 l0,7 Z`, fill: c }));
  }

  function dessin() {
    svg.textContent = "";
    for (let i = 0; i <= NX; i++) svg.appendChild(el("line", { x1: px(i), y1: py(0), x2: px(i), y2: py(NY), stroke: "var(--grille)" }));
    for (let j = 0; j <= NY; j++) svg.appendChild(el("line", { x1: px(0), y1: py(j), x2: px(NX), y2: py(j), stroke: "var(--grille)" }));
    // droite de direction de u passant par B
    const L = Math.hypot(u.dx, u.dy), ex = u.dx / L, ey = u.dy / L;
    svg.appendChild(el("line", { x1: px(B.x - ex * 30), y1: py(B.y - ey * 30), x2: px(B.x + ex * 30), y2: py(B.y + ey * 30), stroke: "var(--discret)", "stroke-width": 1.2, "stroke-dasharray": "5 6", opacity: 0.7 }));
    svg.appendChild(el("rect", { x: px(0), y: py(NY), width: px(NX) - px(0), height: py(0) - py(NY), fill: "none", stroke: "var(--filet)" }));
    // u
    fleche(px(A.x), py(A.y), px(A.x + u.dx), py(A.y + u.dy), "var(--u)", 4);
    nomVec(px(A.x + u.dx / 2) - 18 * ey, py(A.y + u.dy / 2) - 18 * ex + 8, "u", "var(--u)");
    const hu = el("circle", { cx: px(A.x + u.dx), cy: py(A.y + u.dy), r: 12, fill: "var(--u)", opacity: 0.25, class: "poignee" });
    svg.appendChild(hu);
    glisse(hu, p => {
      const nx = Math.round((p.x - OX) / U), ny = Math.round(NY - (p.y - OY) / U);
      const dx = nx - A.x, dy = ny - A.y;
      if ((dx || dy) && Math.abs(dx) <= 4 && Math.abs(dy) <= 3 && nx >= 0 && nx <= NX && ny >= 0 && ny <= NY) {
        u = { dx, dy };
        const dedans = kk => { const fx = B.x + kk * u.dx, fy = B.y + kk * u.dy; return fx >= 0 && fx <= NX && fy >= 0 && fy <= NY; };
        while (!dedans(k)) k = Math.sign(k) * (Math.abs(k) - 0.5);   // k u reste dans le quadrillage
      }
    });
    // k u
    const c = k > 0 ? "var(--pos)" : "var(--neg)";
    const tx = B.x + k * u.dx, ty = B.y + k * u.dy;
    fleche(px(B.x), py(B.y), px(tx), py(ty), c, 4);
    svg.appendChild(el("circle", { cx: px(B.x), cy: py(B.y), r: 3.5, fill: "var(--encre)" }));
    if (k !== 0) nomVec(px(B.x + k * u.dx / 2) - 22 * ey, py(B.y + k * u.dy / 2) - 22 * ex + 8, "u", c, (k === 1 ? "" : k === -1 ? "−" : nb(k)));
    const hk = el("circle", { cx: px(tx), cy: py(ty), r: 13, fill: c, opacity: 0.3, class: "poignee" });
    svg.appendChild(hk);
    glisse(hk, p => {
      const qx = (p.x - OX) / U - B.x, qy = (NY - (p.y - OY) / U) - B.y;
      let kk = (qx * u.dx + qy * u.dy) / (u.dx * u.dx + u.dy * u.dy);
      kk = Math.max(-3, Math.min(3, Math.round(kk * 2) / 2));
      const fx = B.x + kk * u.dx, fy = B.y + kk * u.dy;
      if (fx >= 0 && fx <= NX && fy >= 0 && fy <= NY) k = kk;
    });
    const ku = `<span class="k">${k === 1 ? "" : k === -1 ? "−" : nb(k)}</span><span class="vec ${k > 0 ? "pos" : "neg"}">u</span>`;
    let msg;
    if (k === 0) msg = `<span class="k">k = 0</span> : 0<span class="vec u">u</span> est le vecteur nul.`;
    else if (k > 0) msg = `<span class="k">k = ${nb(k)}</span> : ${ku} a la <b>même direction</b> et le <b>même sens</b> que <span class="vec u">u</span>, et une norme ${k === 1 ? "égale" : nb(k) + " fois celle de <span class=\"vec u\">u</span>"}.`;
    else msg = `<span class="k">k = ${nb(k)}</span> : ${ku} a la <b>même direction</b> que <span class="vec u">u</span>, le <b>sens contraire</b>, et une norme ${k === -1 ? "égale" : nb(-k) + " fois celle de <span class=\"vec u\">u</span>"}.`;
    $("constat").innerHTML = msg;
  }

  function point(evt) { const r = svg.getBoundingClientRect(); return { x: (evt.clientX - r.left) * 900 / r.width, y: (evt.clientY - r.top) * 560 / r.height }; }
  function glisse(node, maj) {
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      const bouge = ev => { maj(point(ev)); dessin(); };
      const fin = () => { window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); };
      window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin);
    });
  }
  dessin();
})();
</script>

<!-- plein-ecran : bouton commun à toutes les pages interactives -->
<style>
#pleinEcran { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; font: 500 13px var(--ui, system-ui, sans-serif); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--filet, #d9dee5); background: var(--carte, #fff); color: var(--encre, #1b1f24); cursor: pointer; opacity: .9; }
#pleinEcran:hover { opacity: 1; }
body.plein-ecran .niveau, body.plein-ecran h1, body.plein-ecran h1 + .chapeau { display: none !important; }
body.plein-ecran .page { max-width: none !important; min-height: 100vh; padding-top: 48px !important; align-content: start; }
body.plein-ecran .page svg:not(.mini) { max-height: 76vh; }
body.plein-ecran.plein-multi .page svg:not(.mini) { max-height: 46vh; }
body.plein-ecran .constat { font-size: clamp(20px, 2.6vw, 30px); }
</style>
<script>
(() => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "pleinEcran"; document.body.appendChild(b);
  function etat(on) { document.body.classList.toggle("plein-ecran", on); b.textContent = on ? "✕ Quitter le plein écran" : "⛶ Plein écran"; b.setAttribute("aria-pressed", on); window.dispatchEvent(new Event("resize")); }
  b.addEventListener("click", async () => {
    const on = !document.body.classList.contains("plein-ecran");
    etat(on);
    try { on ? await document.documentElement.requestFullscreen() : (document.fullscreenElement && await document.exitFullscreen()); } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("plein-ecran")) etat(false); });
  window.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("plein-ecran")) etat(false); });
  if (document.querySelectorAll(".page svg:not(.mini), .page canvas").length > 1) document.body.classList.add("plein-multi");
  etat(location.hash === "#plein");
})();
</script>

</body></html>
