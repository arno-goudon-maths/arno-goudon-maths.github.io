.actions button:hover, .actions a.bouton:hover { filter: brightness(0.96); }

.paire a.bouton { border-radius: 0; }

.actions { gap: 8px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }

.paire button { border-radius: 0; }
.paire button:first-child { border-radius: 6px 0 0 6px; }
.paire button:last-child { border-radius: 0 6px 6px 0; }

.paire button.corr { background: transparent; box-shadow: inset 0 0 0 1px var(--accent-fond); color: var(--discret); font-weight: 400; }
.paire button.corr:hover { color: var(--accent); }
.vide { font-size: 13px; color: var(--discret); font-style: italic; }
.anims { grid-column: 2 / 4; display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
.anims a { color: var(--encre); text-decoration: none; font-size: 14.5px; display: inline-flex; gap: 8px; align-items: baseline; width: fit-content; }
.anims a:hover span { text-decoration: underline; text-underline-offset: 3px; }
.anims .marque { font-size: 11px; color: var(--accent); width: 1.1em; }
.anims .video .marque { color: var(--video); }
.legende { color: var(--discret); font-size: 13px; margin: 18px 2px 0; }
.legende b { font-weight: 500; }

  function el(tag, attrs = {}, ...enfants) {

      if (mon !== jeton) return;
      P.textContent = "";
      const largeur = Math.min(P.clientWidth - 32, 860), dpr = window.devicePixelRatio || 1;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i); if (mon !== jeton) return;
        const v0 = page.getViewport({ scale: 1 }), v = page.getViewport({ scale: largeur / v0.width * dpr });
        const c = el("canvas", { width: Math.floor(v.width), height: Math.floor(v.height), "aria-label": `page ${i}` });
        P.appendChild(c);
        await page.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
      }
    } catch (e) {
      P.textContent = ""; P.appendChild(el("p", { class: "etat", texte: "Le document n'a pas pu s'afficher." }));
    }
  }
  function fermer() { jeton++; $("lecteur").hidden = true; document.body.style.overflow = ""; $("pages").textContent = ""; }
  $("fermer").addEventListener("click", fermer);
  window.addEventListener("keydown", e => { if (e.key === "Escape" && !$("lecteur").hidden) fermer(); });
  $("telecharger").addEventListener("click", async () => {
    if (!courant || !telechargements) return;
    const b = $("telecharger"); b.disabled = true;
    try {
      const blob = await (await fetch(courant.url)).blob();
      await telechargements.save({ filename: courant.nom, data: blob });
    } catch (e) { /* refus ou indisponible : rien à faire */ }
    b.disabled = false;
  });

  rendre();
})();
</script>
