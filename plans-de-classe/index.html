<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f4a3c"><meta name="description" content="Plans de classe : élèves, salles, contraintes, placement et export PDF. Les données restent sur votre ordinateur."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icone-32.png"><link rel="apple-touch-icon" href="icone-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Plan de classe"><style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="pont-web.js"></script></head><body><title>Plan de classe</title>
<link rel="stylesheet" href="lexend.css">
<style>
/* Trois espaces, comme les outils de plans de classe en ligne : Mes classes, Mes salles, Mes plans.
   Le plan reprend les objets de la salle : tableau vert ardoise, tables en bois clair, bureau du professeur. */
:root {
  --fond: #f2f5f4; --carte: #ffffff; --encre: #16201e; --discret: #56635f; --filet: #d3ddd9; --survol: #e7eeeb;
  --accent: #1d6b74; --accent-fond: #d9eeec; --accent-encre: #ffffff;
  --ardoise: #2f4a3c; --ardoise-texte: #e8f1ea; --bois: #ecdcbe; --bois-bord: #c4a574; --bois-texte: #34250f; --bureau: #c4a574;
  --vide: #e3e9e6; --alerte: #c2361f; --alerte-fond: #fbe3dd; --ok: #2c7a3f; --verrou: #7a4fb0;
  --f: #b4467a; --g: #2d62b8; --ombre: 0 6px 20px rgba(20, 40, 35, .10);
  --vitre: #cfeaf8; --vitre-bord: #7fbde0; --vitre-texte: #1f5d80;
  --ia: #5b45c9; --ia-fond: #eeeafd; --ia-bulle: #ffffff;
  --ui: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --fond: #111615; --carte: #1a211f; --encre: #e7eeec; --discret: #a1b2ae; --filet: #2e3a37; --survol: #243030;
    --accent: #62b9c1; --accent-fond: #1c3a3d; --accent-encre: #0d1514; --ardoise: #23382d; --ardoise-texte: #dcebe0;
    --bois: #6b5638; --bois-bord: #92764b; --bois-texte: #fbf0dd; --bureau: #8d7146; --vide: #222b29; --alerte: #ff7a63; --alerte-fond: #3d211b;
    --ok: #6fcf86; --verrou: #b896e6; --f: #ea8ab6; --g: #84aef0; --ombre: 0 6px 20px rgba(0, 0, 0, .35); --ia: #ad9cf7; --ia-fond: #241f3d; --ia-bulle: #1a211f; --vitre: #1d3a4a; --vitre-bord: #3f7fa6; --vitre-texte: #b9e1f7; color-scheme: dark; }
}
:root[data-theme="dark"] { --vitre: #1d3a4a; --vitre-bord: #3f7fa6; --vitre-texte: #b9e1f7; --ia: #ad9cf7; --ia-fond: #241f3d; --ia-bulle: #1a211f; --fond: #111615; --carte: #1a211f; --encre: #e7eeec; --discret: #a1b2ae; --filet: #2e3a37; --survol: #243030;
    --accent: #62b9c1; --accent-fond: #1c3a3d; --accent-encre: #0d1514; --ardoise: #23382d; --ardoise-texte: #dcebe0;
    --bois: #6b5638; --bois-bord: #92764b; --bois-texte: #fbf0dd; --bureau: #8d7146; --vide: #222b29; --alerte: #ff7a63; --alerte-fond: #3d211b;
    --ok: #6fcf86; --verrou: #b896e6; --f: #ea8ab6; --g: #84aef0; --ombre: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--fond); color: var(--encre); font-family: var(--ui); font-size: 17px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

/* ---- barre et navigation ---- */
.barre { display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--carte); border-bottom: 1px solid var(--filet); }
.marque { font-weight: 700; font-size: 22px; display: flex; align-items: center; gap: 9px; letter-spacing: -.01em; }
.marque svg { color: var(--accent); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav button { border: 0; background: none; border-radius: 999px; padding: 9px 18px; font-weight: 600; font-size: 17px; color: var(--discret); display: inline-flex; gap: 8px; align-items: center; }
.nav button:hover { background: var(--survol); color: var(--encre); }
.nav button[aria-current="page"] { background: var(--accent); color: var(--accent-encre); }
.nav .nb { font-size: 14px; font-weight: 600; background: color-mix(in srgb, currentColor 16%, transparent); border-radius: 999px; padding: 0 8px; }
.espace { flex: 1; }
.etat { font-size: 15px; color: var(--discret); }
.corps { max-width: 1520px; margin: 0 auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---- éléments communs ---- */
select, input[type=text], input[type=number], textarea { background: var(--carte); border: 1.5px solid var(--filet); border-radius: 10px; padding: 8px 11px; min-height: 44px; }
input[type=number] { width: 5em; }
textarea { width: 100%; resize: vertical; min-height: 110px; }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; accent-color: var(--accent); vertical-align: -4px; }
.btn { border: 1.5px solid var(--filet); background: var(--carte); border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; white-space: nowrap; }
.btn:hover { background: var(--survol); }
.btn.principal { background: var(--accent); color: var(--accent-encre); border-color: var(--accent); }
.btn.principal:hover { filter: brightness(1.07); }
.btn.petit { padding: 5px 12px; font-size: 15px; min-height: 36px; }
.btn.danger { color: var(--alerte); }
.btn.danger.arme { background: var(--alerte); color: #fff; border-color: var(--alerte); }
.btn:disabled { opacity: .5; cursor: default; }
.ligne { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.aide { font-size: 15px; color: var(--discret); margin: 0; }
.exemple { font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-fond); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.entete { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.entete h1 { font-size: 32px; margin: 0; line-height: 1.15; }
.entete .aide { margin-top: 4px; font-size: 16px; }
.titre-bloc { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; flex: 1; }
.titre-champ { font-size: 30px !important; font-weight: 700; border-color: transparent !important; background: transparent !important; padding: 2px 8px !important; margin-left: -8px; field-sizing: content; min-width: 8ch; max-width: 100%; }
.titre-champ:hover, .titre-champ:focus { border-color: var(--filet) !important; background: var(--carte) !important; }
.retour { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 16px; padding: 4px 0; margin-bottom: 6px; }
.retour:hover { text-decoration: underline; }
.panneau { background: var(--carte); border: 1px solid var(--filet); border-radius: 16px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panneau h2 { font-size: 20px; margin: 0; }
.panneau h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .07em; color: var(--discret); margin: 6px 0 0; }
.deux { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .deux { grid-template-columns: minmax(0, 1fr); } }
.bandeau { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-fond); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; font-size: 16px; }
.vide { border: 2px dashed var(--filet); border-radius: 16px; padding: 34px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--discret); }
.vide b { color: var(--encre); font-size: 20px; }

/* ---- cartes des listes ---- */
.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.carte { background: var(--carte); border: 1.5px solid var(--filet); border-radius: 16px; padding: 18px; display: grid; gap: 10px; align-content: start; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; min-width: 0; }
.carte:hover { border-color: var(--accent); box-shadow: var(--ombre); transform: translateY(-1px); }
.carte-titre { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-size: 21px; font-weight: 600; line-height: 1.25; }
.carte-titre span:first-child { overflow-wrap: anywhere; }
.carte-info { color: var(--discret); font-size: 16px; }
.carte-noms { font-size: 15px; color: var(--discret); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carte .ligne { margin-top: 4px; }
.apercu { display: grid; gap: 0; justify-content: center; padding: 10px; background: var(--fond); border-radius: 10px; }
.apercu i { display: block; width: 11px; height: 8px; border-radius: 1px; }
.apercu i.s { background: var(--bois); box-shadow: inset 0 0 0 1px var(--bois-bord); }
.apercu i.o { background: var(--bois-bord); }
.apercu .tab { height: 5px; background: var(--ardoise); border-radius: 2px; margin: 0 15% 4px; }
.etapes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 20px; }
.etape { background: var(--carte); border: 1.5px solid var(--filet); border-radius: 16px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.etape .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-fond); color: var(--accent); font-weight: 700; }
.etape.faite .num { background: var(--ok); color: #fff; }
.etape b { font-size: 19px; }

/* ---- sous-onglets ---- */
.sous-onglets { display: flex; gap: 4px; border-bottom: 1.5px solid var(--filet); margin-bottom: 18px; overflow-x: auto; }
.sous-onglets button { border: 0; background: none; padding: 10px 16px; font-weight: 600; font-size: 17px; color: var(--discret); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.sous-onglets button[aria-selected="true"] { color: var(--encre); border-bottom-color: var(--accent); }

/* ---- plan ---- */
.scene { background: var(--carte); border: 1px solid var(--filet); border-radius: 16px; padding: 20px; overflow-x: auto; min-width: 0; }
.salle { display: grid; gap: 14px; justify-items: center; margin: 0 auto; width: max-content; min-width: 100%; }
.tableau { background: var(--ardoise); color: var(--ardoise-texte); border-radius: 6px; padding: 8px 0; text-align: center; letter-spacing: .3em; font-weight: 600; font-size: 15px; width: min(70%, 680px); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--ardoise) 70%, black); }
.avant { width: 100%; display: flex; }
.bureau { background: var(--bureau); color: var(--bois-texte); border-radius: 6px; padding: 9px 20px; font-size: 15px; font-weight: 600; text-align: center; }
.grille { display: flex; flex-direction: column; }
.rangee { display: grid; }
.case { width: var(--cw, 112px); height: var(--ch, 58px); }
.place { background: var(--bois); border: 0 solid var(--bois-bord); display: flex; align-items: center; justify-content: center; position: relative; padding: 4px 6px; text-align: center; color: var(--bois-texte); touch-action: none; user-select: none; }
.place[data-e] { cursor: grab; }
.place .nom { font-weight: 600; font-size: var(--fs, 17px); line-height: 1.12; overflow-wrap: anywhere; }
.place.libre .nom { opacity: .4; font-weight: 400; font-size: calc(var(--fs, 17px) * .75); }
.place.cible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 2; }
.place.conflit { box-shadow: inset 0 0 0 3px var(--alerte); }
.place .num { position: absolute; right: 6px; bottom: 3px; font-size: max(11px, calc(var(--fs, 17px) * .55)); font-weight: 600; opacity: .55; }
.place.choisie, .carte-eleve.choisie { outline: 4px solid var(--ia); outline-offset: -4px; z-index: 3; }
.carte-eleve.choisie { outline-offset: 1px; }
.rang3 { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.slot { display: flex; gap: 10px; align-items: center; }
.slot.gauche { justify-content: flex-start; } .slot.centre { justify-content: center; } .slot.droite { justify-content: flex-end; }
.corps-salle { display: flex; gap: 14px; align-items: stretch; justify-content: center; }
.corps-salle > .porte { align-self: center; }
.fenetres { width: 24px; flex: none; border-radius: 5px; background: repeating-linear-gradient(to bottom, var(--vitre) 0 34px, var(--vitre-bord) 34px 37px); border: 2px solid var(--vitre-bord); display: flex; align-items: center; justify-content: center; }
.fenetres span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 600; color: var(--vitre-texte); letter-spacing: .1em; }
.porte { border: 2px dashed var(--discret); color: var(--discret); background: var(--carte); border-radius: 8px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
.projection .porte { font-size: 18px; } .projection .fenetres span { font-size: 15px; }
.place .pin { position: absolute; top: 2px; right: 5px; font-size: 13px; }
.place .sexe { position: absolute; left: 6px; top: 5px; width: 9px; height: 9px; border-radius: 50%; }
.sexe.F { background: var(--f); } .sexe.G { background: var(--g); }
.carte-eleve { display: inline-flex; align-items: center; background: var(--bois); color: var(--bois-texte); border: 1.5px solid var(--bois-bord); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 16px; touch-action: none; cursor: grab; user-select: none; }
.fantome { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 8px 22px rgba(0,0,0,.25); }
.non-places { min-height: 52px; border: 2px dashed var(--filet); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.non-places.cible { border-color: var(--accent); background: var(--accent-fond); }
.alertes { margin: 0; padding-left: 20px; color: var(--alerte); font-size: 16px; }
.ok { color: var(--ok); font-size: 16px; margin: 0; }
.legende { display: flex; gap: 18px; flex-wrap: wrap; font-size: 15px; color: var(--discret); }
.outils { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.segment { display: inline-flex; border: 1.5px solid var(--filet); border-radius: 10px; overflow: hidden; }
.segment button { border: 0; background: var(--carte); padding: 0 14px; font-weight: 600; font-size: 16px; min-height: 41px; }
.segment button + button { border-left: 1.5px solid var(--filet); }
.segment button:disabled { opacity: .4; cursor: default; }
.segment button[aria-pressed="true"] { background: var(--accent); color: var(--accent-encre); }
.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-liste { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--carte); border: 1.5px solid var(--filet); border-radius: 12px; box-shadow: var(--ombre); padding: 6px; display: grid; min-width: 260px; }
.menu-liste button { border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 16px; }
.menu-liste button:hover { background: var(--survol); }
.reglages-affichage { left: 0; right: auto; gap: 4px; }
.reglages-affichage label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; font-size: 16px; border-radius: 8px; }
.reglages-affichage label:hover { background: var(--survol); }
.reglages-affichage select { flex: 1; }
.meta { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; margin: -8px 0 16px; }
.meta label { font-weight: 600; color: var(--discret); font-size: 15px; display: inline-flex; gap: 8px; align-items: center; }
.lien { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 15px; padding: 0; text-decoration: underline; }
.options { border: 2px solid var(--accent); background: var(--accent-fond); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
.options label { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; font-size: 16px; cursor: pointer; }
.options label input { margin-top: 2px; flex: none; }
.options .aide { font-weight: 400; display: block; }
.puces { display: inline-flex; gap: 4px; vertical-align: -1px; }
.puces i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.claude { border: 2px solid var(--ia); background: var(--ia-fond); border-radius: 18px; padding: 16px 18px; display: grid; gap: 12px; margin-bottom: 18px; }
.claude-tete { display: flex; gap: 12px; align-items: center; }
.claude-tete svg { color: var(--ia); flex: none; }
.claude-tete h2 { margin: 0; font-size: 22px; }
.claude-tete p { margin: 2px 0 0; color: var(--discret); font-size: 15px; }
.fil { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
.bulle { max-width: min(80%, 760px); padding: 10px 14px; border-radius: 16px; font-size: 16px; line-height: 1.45; }
.bulle.moi { align-self: flex-end; background: var(--accent); color: var(--accent-encre); border-bottom-right-radius: 4px; }
.bulle.ia { align-self: flex-start; background: var(--ia-bulle); border: 1.5px solid color-mix(in srgb, var(--ia) 35%, transparent); border-bottom-left-radius: 4px; }
.bulle.attente { font-style: italic; color: var(--discret); }
.saisie { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.saisie textarea { min-height: 64px; background: var(--carte); border-color: color-mix(in srgb, var(--ia) 45%, var(--filet)); }
.btn.ia { background: var(--ia); border-color: var(--ia); color: #fff; }
.exemples { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.exemples button { min-height: 32px; border: 1.5px dashed var(--ia); background: transparent; color: var(--ia); border-radius: 999px; padding: 4px 12px; font-size: 15px; font-weight: 600; }
.exemples button:hover { background: var(--ia-bulle); }
.compris { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.compris .pastille { display: inline-flex; gap: 6px; align-items: center; background: var(--ia-bulle); border: 1.5px solid var(--ia); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 15px; }
.compris .pastille button { border: 0; background: none; color: var(--discret); font-size: 15px; width: 26px; height: 26px; border-radius: 50%; }
.compris .pastille button:hover { background: var(--survol); }
@media (max-width: 600px) { .saisie { grid-template-columns: minmax(0, 1fr); } .bulle { max-width: 92%; } }
.colonne { display: grid; gap: 16px; align-content: start; min-width: 0; }
.colonne .claude { margin-bottom: 0; padding: 14px 16px; gap: 10px; }
.colonne .claude-tete { align-items: flex-start; }
.colonne .claude-tete h2 { font-size: 20px; }
.colonne .claude-tete p { font-size: 14px; }
.colonne .claude-tete svg { width: 28px; height: 28px; }
.colonne .saisie { grid-template-columns: minmax(0, 1fr); }
.colonne .saisie .btn { width: 100%; }
.colonne .bulle { max-width: 94%; font-size: 15px; padding: 8px 12px; }
.colonne .exemples button { font-size: 14px; padding: 3px 10px; }
.colonne .compris .pastille { font-size: 14px; }
.ia-rep { font-size: 16px; background: var(--accent-fond); border-radius: 12px; padding: 12px 14px; margin: 0; }

/* ---- éditeur de salle ---- */
.edit .rangee { column-gap: 4px; }
.lien-rangs { height: 20px; border: 0; background: none; padding: 0; width: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--discret); border-radius: 6px; opacity: .45; }
.lien-rangs:hover, .lien-rangs:focus-visible { opacity: 1; background: var(--survol); }
.lien-rangs.colle { opacity: 1; color: var(--bois-texte); background: linear-gradient(var(--bois-bord), var(--bois-bord)) center / 100% 6px no-repeat; }
.lien-rangs.colle span { background: var(--carte); padding: 0 8px; border-radius: 999px; }
.apercu .r { display: grid; gap: 3px; }
.historique { display: grid; gap: 12px; }
.histo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--carte); border: 1.5px solid var(--filet); border-radius: 16px; padding: 14px 18px; }
.histo.actuel { border-color: var(--accent); }
.histo .quand { font-size: 15px; color: var(--discret); }
.histo .titre { font-size: 19px; font-weight: 600; }
@media (max-width: 700px) { .histo { grid-template-columns: minmax(0, 1fr); } }
.ajout-eleve { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 8px; align-items: center; }
@media (max-width: 700px) { .ajout-eleve { grid-template-columns: 1fr 1fr; } }

}
const MODELES = [

function nouvelleSalle(nom) { const S = { id: uid("s-"), nom, bureau: "gauche", nbDevant: 2, nbFond: 2 }; appliquerMotif(S, 5, "2 2 2"); return S; }
